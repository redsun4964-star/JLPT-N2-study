function qinfo(id){
  if(id[0]==='h'){const q=QH[+id.slice(1)];return {type:q[0],html:jp(q[1]),raw:q[1],ans:q[3][0],nh:esc(q[4]),ko:q[2],c:q[3]}}
  if(id[0]==='m'){const w=W[+id.slice(1)];return {type:CAT_TYPE[w[5]],html:'<u>'+esc(w[0])+'</u>',ans:w[2],nh:(w[1]?esc(w[1])+' · ':'')+jp(w[3]),ko:w[4],cat:w[5],wi:+id.slice(1)}}
  if(id[0]==='y'||id[0]==='s'||id[0]==='a'){const w=W[+id.slice(1)],k=id[0]==='s'?0:1;
    return {type:id[0]==='y'?'한자 읽기':(id[0]==='s'?'유의어':'반의어'),html:'<u>'+esc(w[0])+'</u>',ans:id[0]==='y'?yomi(w):SA[w[0]][k][0],
      nh:esc(w[2])+(id[0]==='y'?'':' · '+saLine(w[0]))+(w[3]?' · '+jp(w[3]):''),ko:w[4],wi:+id.slice(1)}}
  if(id[0]==='r'){const [p,i]=id.slice(1).split('_').map(Number);const q=READ[p].qs[i];return {type:'독해 지문 '+(p+1),html:jp(q.q),ans:q.c[0],nh:esc(q.note),ko:''}}
  const l=LISTEN[+id.slice(1)];return {type:'청해 대본 '+(+id.slice(1)+1),html:jp(l.q||l.lines[0][1]),ans:l.c[0],nh:esc(l.note),ko:''}
}
function record(id,ok){S.res[id]=ok?1:0;save()}
const setTop=()=>document.documentElement.style.setProperty('--top',$('top').offsetHeight+'px');
addEventListener('resize',setTop);
function renderStats(){
  const ids=Object.keys(S.res),ok=ids.filter(k=>S.res[k]===1).length,wrong=ids.length-ok;
  const known=W.filter(w=>S.known[w[0]]===true).length,marks=Object.keys(S.mark).length;
  $('stats').innerHTML=`<div class="st"><b>${ids.length} / ${TOTAL}</b><span>푼 문제</span></div>
   <div class="st"><b>${ids.length?Math.round(ok/ids.length*100):0}%</b><span>정답률 (${ok}문제)</span></div>
   <div class="st"><b>${wrong}</b><span>오답</span></div>
   <div class="st"><b>${known} / ${W.length}</b><span>아는 단어</span></div>
   <div class="st"><b>${marks}</b><span>북마크</span></div>`;setTop();
}

/* ---------- 플래시카드 ---------- */
let F={filter:'전체',deck:[],i:0,flip:false};
function buildDeck(){
  let d=W.map((c,i)=>i);
  if(['어휘','형용사','문법'].includes(F.filter))d=d.filter(i=>W[i][5]===F.filter);
  if(F.filter==='북마크')d=d.filter(i=>S.mark['w:'+W[i][0]]);
  if(F.filter==='모르는 것만')d=d.filter(i=>S.known[W[i][0]]!==true);
  F.deck=shuffle(d);F.i=0;F.flip=false;
}
function renderCards(){
  const chips=['전체','어휘','형용사','문법','북마크','모르는 것만'].map(f=>`<button class="chip" data-f="${f}" aria-pressed="${F.filter===f}">${f}</button>`).join('');
  let body;
  if(!F.deck.length)body=`<div class="done"><b>이 묶음에는 카드가 없습니다.</b><span class="sub">다른 묶음을 고르세요.</span></div>`;
  else if(F.i>=F.deck.length)body=`<div class="done"><b>한 바퀴 끝.</b><div class="acts"><button class="btn pri" data-act="again">다시 섞기</button></div></div>`;
  else{const c=W[F.deck[F.i]];
    body=`<div class="meta"><span>${F.i+1} / ${F.deck.length}</span>${starBtn('w:'+c[0])}</div>
    <div class="prog"><i style="width:${F.i/F.deck.length*100}%"></i></div>
    <button class="fc" data-act="flip" aria-label="카드 뒤집기"><span class="tag">${c[5]}</span>${F.flip&&c[1]?`<span class="rd">${esc(c[1])}</span>`:''}<span class="hw">${esc(c[0])}</span>${
      F.flip?`<span class="ko">${esc(c[2])}</span><span class="fcrow"><span class="fcmain">${c[3]?`<span class="ex">${jp(c[3])}</span><span class="exk">${esc(c[4])}</span>`:''}</span>${saPanel(c[0])}</span>`
            :`<span class="hint">눌러서 읽기와 뜻 보기</span>`}</button>
    <div class="acts"><button class="btn no" data-act="no">몰라요</button><button class="btn yes" data-act="yes">알아요</button></div>`}
  $('cards').innerHTML=`<div class="chips">${chips}<button class="chip" data-act="resetc">${F.ask?'정말 초기화?':'카드 기록 초기화'}</button></div>${body}`;
}
$('cards').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.star){toggleStar(b.dataset.star)}
  else if(b.dataset.f){F.filter=b.dataset.f;buildDeck()}
  else{const a=b.dataset.act;
    if(a==='resetc'){if(F.ask){S.known={};save();buildDeck();F.ask=false}else F.ask=true;renderCards();return}
    F.ask=false;
    if(a==='flip')F.flip=!F.flip;
    else if(a==='yes'||a==='no'){S.known[W[F.deck[F.i]][0]]=a==='yes';save();F.i++;F.flip=false}
    else if(a==='again')buildDeck()}
  renderCards();});

// 뜻이 겹치는 보기를 걸러낸다: 쉼표로 나눈 뜻풀이끼리 앞 두 글자가 같거나 세 글자 이상 겹치면 비슷한 뜻으로 본다.
const mtok=m=>m.replace(/\(.*?\)/g,'').split(',').map(t=>t.replace(/[~\s·]/g,'')).filter(Boolean);
function similar(a,b){const A=mtok(a),B=mtok(b);
  for(const x of A)for(const y of B){if(x.slice(0,2)===y.slice(0,2))return true;for(let i=0;i+3<=x.length;i++)if(y.includes(x.substr(i,3)))return true}
  return false}

/* ---------- 퀴즈 ---------- */
const TYPES=['전체',...new Set(QH.map(q=>q[0])),'어휘 뜻','형용사 뜻','문법 뜻','유의어','반의어','오답만','북마크'];
let SESSION=20;try{SESSION=+localStorage.getItem('n2study-session')||20}catch(e){}
const SIZES=[[20,'20문제'],[50,'50문제'],[9999,'전부']];
let Q={type:'전체',list:[],i:0,opts:[],pick:null,wrong:[]};
function pool(){
  if(Q.type==='오답만')return QIDS.filter(id=>S.res[id]===0);
  if(Q.type==='북마크')return QIDS.filter(id=>S.mark['q:'+id]);
  return QIDS.filter(id=>Q.type==='전체'||qinfo(id).type===Q.type);
}
function startQuiz(ids){
  if(!ids){const p=shuffle(pool());const rank=id=>S.res[id]===undefined?0:(S.res[id]===0?1:2);ids=p.sort((a,b)=>rank(a)-rank(b)).slice(0,SESSION)}
  Q.list=ids;Q.i=0;Q.wrong=[];nextQ()}
function nextQ(){Q.pick=null;if(Q.i>=Q.list.length)return;const id=Q.list[Q.i],q=qinfo(id);
  if(id[0]==='m'){const cand=shuffle([...new Set(W.filter((w,j)=>j!==q.wi&&w[5]===q.cat&&w[2]!==q.ans).map(w=>w[2]))]);
    const others=[];for(const m of cand){if(others.length===3)break;if(!similar(m,q.ans)&&!others.some(o=>similar(o,m)))others.push(m)}
    for(const m of cand){if(others.length===3)break;if(!others.includes(m))others.push(m)}Q.opts=shuffle([q.ans,...others]);Q.kor=true}
  else if(id[0]==='y'){Q.opts=shuffle([q.ans,...shuffle(mutate(q.ans)).slice(0,3)]);Q.kor=false}
  else if(id[0]==='s'||id[0]==='a'){Q.opts=saOpts(q.wi,id[0]==='s'?0:1);Q.kor=false}
  else{Q.opts=shuffle(q.c);Q.kor=false}}
function renderQuiz(){
  const cur=Q.type,cnt=t=>{Q.type=t;const n=pool().length;Q.type=cur;return n};
  const chips=TYPES.map(t=>`<button class="chip" data-type="${t}" aria-pressed="${Q.type===t}">${t} ${cnt(t)}</button>`).join('');
  const sizes=SIZES.map(([n,l])=>`<button class="chip" data-size="${n}" aria-pressed="${SESSION===n}">${l}</button>`).join('');
  const p=pool(),done=p.filter(id=>S.res[id]!==undefined).length;
  let body;
  if(!Q.list.length)body=`<div class="done"><b>이 묶음에는 문제가 없습니다.</b><span class="sub">${Q.type==='오답만'?'틀린 문제가 없습니다.':'다른 유형을 고르세요.'}</span></div>`;
  else if(Q.i>=Q.list.length){const n=Q.list.length,ok=n-Q.wrong.length;
    body=`<div class="done"><span class="big">${ok} / ${n}</span><span class="sub">이번 묶음 결과. 틀린 문제는 오답·북마크 탭에 저장됐습니다.</span>
      <div class="acts">${Q.wrong.length?'<button class="btn pri" data-act="retry">틀린 것만 다시</button>':''}<button class="btn${Q.wrong.length?'':' pri'}" data-act="more">${SESSION>=9999?'처음부터 다시':'다음 '+SESSION+'문제'}</button></div></div>`}
  else{const id=Q.list[Q.i],q=qinfo(id),ans=q.ans;
    body=`<div class="meta"><span>${Q.i+1} / ${Q.list.length} · ${q.type}</span>${starBtn('q:'+id)}</div>
    <div class="prog"><i style="width:${Q.i/Q.list.length*100}%"></i></div>
    <div class="qbox"><div class="inst">${INST[q.type]}</div><div class="qs">${q.html}</div>
     <div class="opts${Q.kor||q.type==='용법'?' one':''}">${Q.opts.map((o,k)=>`<button class="opt${Q.pick!==null?(o===ans?' ok':(k===Q.pick?' bad':'')):''}" data-o="${k}">${Q.kor?esc(o):jp(o)}</button>`).join('')}</div>
     ${Q.pick!==null?`<div class="fb"><b class="${Q.opts[Q.pick]===ans?'ok':'bad'}">${Q.opts[Q.pick]===ans?'정답':'오답'} · ${esc(ans.replace(/\[\[|\]\]/g,''))}</b>
       ${q.raw&&q.raw.includes('（　）')?`<span class="qs sm">${rb((FURI[q.raw]||q.raw).replace('（　）','[['+(FURI[ans]||ans)+']]'))}</span>`:''}
       <span class="exq">${q.nh}</span>${q.ko?`<span class="tr">${esc(q.ko)}</span>`:''}</div>
     <div class="acts"><button class="btn pri" data-act="next">다음</button></div>`:''}</div>`}
  $('quiz').innerHTML=`<div class="chips">${chips}<button class="chip" data-act="resetq">${Q.ask?'정말 초기화?':'푼 문제 초기화'}</button></div><div class="chips"><span class="sub">한 번에</span>${sizes}</div><p class="sub">이 유형 전체 ${p.length}문제 중 ${done}문제 풀었음. 이번 묶음은 ${Q.list.length}문제이고, 안 푼 문제부터 나옵니다.</p>${body}`;
}
function resetSolved(){S.res={};Object.keys(RS).forEach(k=>delete RS[k]);LS.forEach((st,i)=>{st.pick=null;st.opts=shuffle(LISTEN[i].c)});save()}
$('quiz').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.act==='resetq'){if(Q.ask){resetSolved();Q.ask=false;startQuiz()}else Q.ask=true;renderQuiz();return}
  Q.ask=false;
  if(b.dataset.star){toggleStar(b.dataset.star)}
  else if(b.dataset.size){SESSION=+b.dataset.size;try{localStorage.setItem('n2study-session',SESSION)}catch(e){}startQuiz()}
  else if(b.dataset.type){Q.type=b.dataset.type;startQuiz()}
  else if(b.dataset.o!==undefined){if(Q.pick!==null)return;Q.pick=+b.dataset.o;const id=Q.list[Q.i],ok=Q.opts[Q.pick]===qinfo(id).ans;if(!ok)Q.wrong.push(id);record(id,ok)}
  else if(b.dataset.act==='next'){Q.i++;nextQ()}
  else if(b.dataset.act==='retry')startQuiz(Q.wrong.slice());
  else if(b.dataset.act==='more')startQuiz();
  renderQuiz();});


/* ---------- 통독: 문장이 자동으로 넘어간다 ---------- */
let R={list:[],play:false,timer:null};
function flowList(){const f=S.flow.src;
  const words=W.map((w,i)=>i).filter(i=>W[i][3]&&(f==='전체'||(f==='북마크'?S.mark['w:'+W[i][0]]:W[i][5]===f)));
  const qs=(f==='전체'||f==='퀴즈 문장')?QH.map((q,i)=>'h'+i):(f==='북마크'?QH.map((q,i)=>'h'+i).filter(id=>S.mark['q:'+id]):[]);
  R.list=f==='퀴즈 문장'?qs:[...words,...qs];
  if(S.flow.i>=R.list.length)S.flow.i=0}
function flowItem(x){
  if(typeof x==='number'){const c=W[x];
    return {star:'w:'+c[0],html:`<span class="tag">${c[5]}</span>${c[1]?`<span class="rd">${esc(c[1])}</span>`:''}<span class="hw">${esc(c[0])}</span><span class="ko">${esc(c[2])}</span><span class="fcrow"><span class="fcmain"><span class="ex">${jp(c[3])}</span><span class="exk">${esc(c[4])}</span></span>${saPanel(c[0])}</span>`}}
  const q=QH[+x.slice(1)],ans=q[3][0],raw=FURI[q[1]]||q[1];
  const sent=q[1].includes('（　）')?rb(raw.replace('（　）','[['+(FURI[ans]||ans)+']]')):rb(raw);
  return {star:'q:'+x,html:`<span class="tag">퀴즈 문장 · ${esc(q[0])}</span><span class="ex big">${sent}</span><span class="ko">${jp(ans)}</span><span class="exk">${esc(q[2])}</span><span class="exk">${esc(q[4])}</span>`}}
function flowToc(){
  // 묶음별로 50개씩 끊어서 바로 갈 수 있는 목차를 만든다
  const lab=x=>typeof x==='number'?W[x][5]:'퀴즈 문장',groups=[];
  R.list.forEach((x,i)=>{const l=lab(x),g=groups[groups.length-1];if(g&&g.l===l)g.n++;else groups.push({l,start:i,n:1})});
  return groups.map(g=>{let h=`<span class="th">${g.l} ${g.n}</span>`;
    for(let a=0;a<g.n;a+=50)h+=`<button class="chip" data-jump="${g.start+a}" aria-pressed="${S.flow.i>=g.start+a&&S.flow.i<g.start+Math.min(a+50,g.n)}">${a+1}–${Math.min(a+50,g.n)}</button>`;
    return h}).join('')}
function renderFlow(){
  clearTimeout(R.timer);flowList();
  const n=R.list.length,i=S.flow.i;
  const src=['전체','어휘','형용사','문법','퀴즈 문장','북마크'].map(f=>`<button class="chip" data-src="${f}" aria-pressed="${S.flow.src===f}">${f}</button>`).join('');
  if(![3,6,12,20].includes(S.flow.sec))S.flow.sec=6;
  const sec=[3,6,12,20].map(x=>`<button class="chip" data-sec="${x}" aria-pressed="${S.flow.sec===x}">${x}초</button>`).join('');
  let body;
  if(!n)body='<div class="done"><b>이 묶음에는 문장이 없습니다.</b></div>';
  else{const it=flowItem(R.list[i]);
    body=`<div class="acts"><button class="btn pri" data-act="play" aria-pressed="${R.play}">${R.play?'자동 넘김 끄기':'자동 넘김 켜기'}</button></div>
    <div class="meta"><span>${i+1} / ${n}${R.play?' · '+S.flow.sec+'초마다 넘어가는 중':''}</span>${starBtn(it.star)}</div>
    <div class="prog"><i style="width:${(i+1)/n*100}%"></i></div>
    <div class="fc flowcard">${it.html}</div>
    <div class="acts"><button class="btn" data-act="prev">이전</button><button class="btn" data-act="nextf">다음</button></div>`;
    if(R.play)R.timer=setTimeout(()=>{if(S.flow.i+1>=R.list.length){R.play=false}else S.flow.i++;save();renderFlow()},S.flow.sec*1000)}
  $('flow').innerHTML=`<p class="sub">단어 예문과 퀴즈 문장(정답을 채운 완성 문장)이 자동으로 넘어갑니다. 보던 위치는 저장됩니다.</p><div class="chips">${src}</div><div class="chips"><span class="sub optlabel">넘어가는 간격</span>${sec}<button class="chip" data-act="first">처음부터</button><button class="chip" data-act="toc" aria-pressed="${!!R.toc}">목차</button></div>
   <form class="jump" id="jumpf"><label class="sub" for="jumpn">번호로 이동</label><input class="search num" id="jumpn" type="number" inputmode="numeric" min="1" max="${n}" placeholder="1–${n}"><button class="chip" type="submit">이동</button></form>${R.toc&&n?`<div class="toc">${flowToc()}</div>`:''}${body}`;
}
$('flow').addEventListener('submit',e=>{e.preventDefault();const v=parseInt($('jumpn').value,10);
  if(v>=1&&v<=R.list.length){S.flow.i=v-1;save();renderFlow()}});
$('flow').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.closest('#jumpf'))return;  // 번호 이동은 submit에서 처리
  if(b.dataset.star){toggleStar(b.dataset.star)}
  else if(b.dataset.jump!==undefined){S.flow.i=+b.dataset.jump}
  else if(b.dataset.act==='toc'){R.toc=!R.toc}
  else if(b.dataset.src){S.flow.src=b.dataset.src;S.flow.i=0}
  else if(b.dataset.sec){S.flow.sec=+b.dataset.sec}
  else if(b.dataset.act==='play'){R.play=!R.play}
  else if(b.dataset.act==='prev'){S.flow.i=Math.max(0,S.flow.i-1)}
  else if(b.dataset.act==='nextf'){S.flow.i=Math.min(R.list.length-1,S.flow.i+1)}
  else if(b.dataset.act==='first'){S.flow.i=0}
  save();renderFlow();});

/* ---------- 독해 ---------- */
const RS={},RS_ASK={on:false};
const ko=t=>t?`<span class="ko">${esc(t)}</span>`:'';
// 문장 단위로 나눠 일본어 바로 아래에 번역을 붙인다. 문장 수가 다르면 문단 단위로.
function senPairs(t,k){const a=(FURI[t]||t).split(/(?<=[。？！])/).filter(x=>x.trim()),b=String(k||'').split(/(?<=[.?!])\s+/).filter(x=>x.trim());
  if(a.length!==b.length)return rb(FURI[t]||t)+ko(k);
  return a.map((x,i)=>`<span class="sen">${rb(x)}</span>${ko(b[i])}`).join('')}
function renderRead(){
  const rdone=RIDS.filter(id=>S.res[id]!==undefined).length;
  $('read').innerHTML=`<p class="sub">시험 유형에 맞춰 새로 쓴 지문입니다. ${rdone} / ${RIDS.length}문제 풀었음.</p><div class="chips"><button class="chip" data-act="resetr">${RS_ASK.on?'정말 초기화?':'독해 푼 기록 초기화'}</button><button class="chip" data-act="trall" aria-pressed="${READ.every(r=>r.open)}">해석 전체 ${READ.every(r=>r.open)?'숨기기':'보기'}</button></div>
   <div class="toc"><span class="th">목차</span>${READ.map((r,p)=>`<button class="chip" data-goto="rd${p}">${p+1} · ${r.type.replace('내용 이해 ','').replace(/[()]/g,'')}</button>`).join('')}</div>`+READ.map((r,p)=>`<article class="qbox" id="rd${p}"><div class="meta"><span>지문 ${p+1}</span><span>${r.type}</span></div>
   <button class="chip tr-btn" data-tr="${p}" aria-pressed="${!!r.open}">해석 ${r.open?'숨기기':'보기'}</button>
   <div class="passage">${r.text.map((t,n)=>`<p>${r.open?senPairs(t,r.ko[n]):jp(t)}</p>`).join('')}</div>
   ${r.qs.map((q,i)=>{const k=p+'_'+i,st=RS[k]||(RS[k]={opts:shuffle(q.c),pick:null}),ans=q.c[0];
     return `<div class="subq"><div class="meta"><span>문제 ${i+1}</span>${starBtn('q:r'+k)}</div><div class="qs sm">${jp(q.q)}${r.open?ko(q.qk):''}</div><div class="opts one">${st.opts.map((o,n)=>`<button class="opt${st.pick!==null?(o===ans?' ok':(n===st.pick?' bad':'')):''}" data-k="${k}" data-o="${n}">${n+1}　${jp(o)}${r.open?ko(q.ck[q.c.indexOf(o)]):''}</button>`).join('')}</div>
     ${st.pick!==null?`<div class="fb"><b class="${st.opts[st.pick]===ans?'ok':'bad'}">${st.opts[st.pick]===ans?'정답':'오답'}</b><span>${esc(q.note)}</span></div>`:''}</div>`}).join('')}</article>`).join('');
}
$('read').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.act==='resetr'){if(RS_ASK.on){RIDS.forEach(id=>delete S.res[id]);Object.keys(RS).forEach(k=>delete RS[k]);save();RS_ASK.on=false}else RS_ASK.on=true;renderRead();return}
  RS_ASK.on=false;
  if(b.dataset.act==='trall'){const v=!READ.every(r=>r.open);READ.forEach(r=>r.open=v);renderRead();return}
  if(b.dataset.goto){const el=$(b.dataset.goto);if(el)el.scrollIntoView({block:'start'});return}
  if(b.dataset.star){toggleStar(b.dataset.star)}
  else if(b.dataset.tr!==undefined){const r=READ[+b.dataset.tr];r.open=!r.open}
  else if(b.dataset.k){const st=RS[b.dataset.k];if(st.pick!==null)return;st.pick=+b.dataset.o;const [p,i]=b.dataset.k.split('_').map(Number);record('r'+b.dataset.k,st.opts[st.pick]===READ[p].qs[i].c[0])}
  renderRead();});

/* ---------- 청해 대본 ---------- */
const LS=LISTEN.map(l=>({opts:shuffle(l.c),pick:null,open:false})),LS_ASK={on:false};
function renderScript(){
  const ldone=LIDS.filter(id=>S.res[id]!==undefined).length;
  $('script').innerHTML=`<p class="sub">청해 유형의 대화를 글로 읽고 푸는 연습입니다. 새로 쓴 대본이고 음성은 없습니다. ${ldone} / ${LIDS.length}문제 풀었음.</p><div class="chips"><button class="chip" data-act="resetl">${LS_ASK.on?'정말 초기화?':'청해 푼 기록 초기화'}</button><button class="chip" data-act="trall" aria-pressed="${LS.every(x=>x.open)}">해석 전체 ${LS.every(x=>x.open)?'숨기기':'보기'}</button></div>
   <div class="toc"><span class="th">목차</span>${LISTEN.map((l,i)=>`<button class="chip" data-goto="ls${i}">${i+1} · ${l.type}</button>`).join('')}</div>`+
  LISTEN.map((l,i)=>{const st=LS[i],ans=l.c[0],done=st.pick!==null;
   return `<article class="qbox" id="ls${i}"><div class="meta"><span>${i+1}번 · ${l.type}</span>${starBtn('q:l'+i)}</div>
    <button class="chip tr-btn" data-tr="${i}" aria-pressed="${st.open}">해석 ${st.open?'숨기기':'보기'}</button>
    <div class="script">${l.intro?`<p class="nar">${jp(l.intro)}${st.open?ko(l.ik):''}</p>`:''}${l.lines.map((x,n)=>`<p><b>${x[0]}</b> ${jp(x[1])}${st.open?ko(l.ko[n]):''}</p>`).join('')}</div>
    <div class="qs sm">${l.q?jp(l.q)+(st.open?ko(l.qk):''):'가장 알맞은 대답을 고르세요.'}</div>
    <div class="opts one">${st.opts.map((o,n)=>`<button class="opt${done?(o===ans?' ok':(n===st.pick?' bad':'')):''}" data-i="${i}" data-o="${n}">${n+1}　${jp(o)}${st.open?ko(l.ck[l.c.indexOf(o)]):''}</button>`).join('')}</div>
    ${done?`<div class="fb"><b class="${st.opts[st.pick]===ans?'ok':'bad'}">${st.opts[st.pick]===ans?'정답':'오답'}</b><span>${esc(l.note)}</span></div>`:''}</article>`}).join('');
}
$('script').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.act==='resetl'){if(LS_ASK.on){LIDS.forEach(id=>delete S.res[id]);LS.forEach((st,i)=>{st.pick=null;st.opts=shuffle(LISTEN[i].c)});save();LS_ASK.on=false}else LS_ASK.on=true;renderScript();return}
  LS_ASK.on=false;
  if(b.dataset.act==='trall'){const v=!LS.every(x=>x.open);LS.forEach(x=>x.open=v);renderScript();return}
  if(b.dataset.goto){const el=$(b.dataset.goto);if(el)el.scrollIntoView({block:'start'});return}
  if(b.dataset.star){toggleStar(b.dataset.star)}
  else if(b.dataset.tr!==undefined){const st=LS[+b.dataset.tr];st.open=!st.open}
  else if(b.dataset.i!==undefined){const i=+b.dataset.i,st=LS[i];if(st.pick!==null)return;st.pick=+b.dataset.o;record('l'+i,st.opts[st.pick]===LISTEN[i].c[0])}
  renderScript();});

/* ---------- 단어장 ---------- */
let B={cat:'전체',q:'',open:{},ask:false};
const clearMarks=p=>{Object.keys(S.mark).forEach(k=>{if(k.startsWith(p))delete S.mark[k]});save()};
function wordRow(w,i,force){const o=force||B.open[i];
  return `<div class="wr" id="w${i+1}"><span class="no">${i+1}</span>${starBtn('w:'+w[0])}<div class="w" data-open="${i}" role="button" tabindex="0">${w[1]?`<small>${esc(w[1])}</small>`:''}${esc(w[0])}</div><div class="m">${esc(w[2])}</div>${o&&w[3]?`<div class="e"><div class="fcrow"><div class="fcmain"><span class="ex">${jp(w[3])}</span><span class="etr">${esc(w[4])}</span></div>${saPanel(w[0])}</div></div>`:''}</div>`}
function bookList(){
  const q=B.q.trim().toLowerCase();
  const rows=W.map((w,i)=>[w,i]).filter(([w])=>(B.cat==='전체'||(B.cat==='북마크'?S.mark['w:'+w[0]]:w[5]===B.cat))&&(!q||(/^\d+$/.test(q)?String(W.indexOf(w)+1)===q:(w[0]+w[1]+w[2]).toLowerCase().includes(q))));
  $('booklist').innerHTML=`<p class="sub">${rows.length}개. 단어를 누르면 예문이 열립니다.</p>`+(rows.length?`<div class="wl">${rows.map(([w,i])=>wordRow(w,i)).join('')}</div>`:'');
}
function renderBook(){
  $('book').innerHTML=`<input class="search" id="bookq" type="search" placeholder="단어, 읽기, 뜻, 번호로 검색" value="${esc(B.q)}" aria-label="단어 검색">
   <div class="chips">${['전체','어휘','형용사','문법','북마크'].map(c=>`<button class="chip" data-cat="${c}" aria-pressed="${B.cat===c}">${c} ${c==='전체'?W.length:(c==='북마크'?W.filter(w=>S.mark['w:'+w[0]]).length:W.filter(w=>w[5]===c).length)}</button>`).join('')}<button class="chip" data-act="clearw">${B.ask?'정말 해제?':'단어 북마크 전체 해제'}</button></div>
   <div id="booklist"></div>`;bookList();
}
$('book').addEventListener('input',e=>{if(e.target.id==='bookq'){B.q=e.target.value;bookList()}});
$('book').addEventListener('click',e=>{
  if(e.target.closest('[data-act="clearw"]')){if(B.ask){clearMarks('w:');B.ask=false}else B.ask=true;renderBook();return}
  if(B.ask){B.ask=false;renderBook()}
  const s=e.target.closest('[data-star]');
  if(s){toggleStar(s.dataset.star);if(B.cat==='북마크')renderBook();else bookList();return}
  const c=e.target.closest('[data-cat]');if(c){B.cat=c.dataset.cat;renderBook();return}
  const o=e.target.closest('[data-open]');if(o){B.open[o.dataset.open]=!B.open[o.dataset.open];bookList()}});
$('book').addEventListener('keydown',e=>{const o=e.target.closest('[data-open]');if(o&&(e.key==='Enter'||e.key===' ')){e.preventDefault();B.open[o.dataset.open]=!B.open[o.dataset.open];bookList()}});

/* ---------- 오답·북마크 ---------- */
function qItem(id,kind){const q=qinfo(id);
  return `<div class="li"><div class="row"><span class="tag">${esc(q.type)}</span><button class="btn sm" data-del="${kind}:${id}">목록에서 빼기</button></div>
   <div class="qs">${q.html}</div><div class="a">정답 <b>${id[0]==='m'?esc(q.ans):jp(q.ans)}</b></div><div class="n">${q.nh}</div></div>`}
let V={ask:''};
function renderReview(){
  const clr=(key,label)=>`<button class="btn sm" data-clr="${key}">${V.ask===key?'정말 지우기?':label}</button>`;
  const wrong=Object.keys(S.res).filter(k=>S.res[k]===0);
  const mq=Object.keys(S.mark).filter(k=>k.startsWith('q:')).map(k=>k.slice(2));
  const mw=W.map((w,i)=>[w,i]).filter(([w])=>S.mark['w:'+w[0]]);
  const quizWrong=wrong.filter(id=>'hmysa'.includes(id[0])).length;
  $('review').innerHTML=`<h2>틀린 문제 ${wrong.length}</h2>
   ${wrong.length?`<div class="acts">${quizWrong?`<button class="btn pri" data-go="wrong">퀴즈 오답 ${quizWrong}문제 다시 풀기</button>`:''}${clr('wrong','오답 전체 지우기')}</div>${wrong.map(id=>qItem(id,'res')).join('')}`:'<p class="sub">틀린 문제가 없습니다. 퀴즈·독해·청해 대본에서 틀리면 자동으로 여기에 모입니다.</p>'}
   <h2>북마크한 문제 ${mq.length}</h2>
   ${mq.length?`<div class="acts">${clr('mq','문제 북마크 전체 해제')}</div>`+mq.map(id=>qItem(id,'mark')).join(''):'<p class="sub">퀴즈를 풀다가 ★을 누르면 여기에 저장됩니다.</p>'}
   <h2>북마크한 단어 ${mw.length}</h2>
   ${mw.length?`<div class="acts">${clr('mw','단어 북마크 전체 해제')}</div><div class="wl">${mw.map(([w,i])=>wordRow(w,i,true)).join('')}</div>`:'<p class="sub">카드나 단어장에서 ★을 누르면 여기에 저장됩니다.</p>'}`;
}
$('review').addEventListener('click',e=>{const s=e.target.closest('[data-star]');if(s){toggleStar(s.dataset.star);renderReview();return}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.clr){const k=b.dataset.clr;
    if(V.ask===k){if(k==='wrong'){Object.keys(S.res).forEach(id=>{if(S.res[id]===0)delete S.res[id]});save()}else clearMarks(k==='mq'?'q:':'w:');V.ask=''}else V.ask=k;
    renderReview();return}
  V.ask='';
  if(b.dataset.del){const [kind,id]=b.dataset.del.split(':');if(kind==='res')delete S.res[id];else delete S.mark['q:'+id];save();renderReview()}
  else if(b.dataset.go){Q.type='오답만';startQuiz();showTab('quiz')}});

/* ---------- 탭·표시 설정 ---------- */
const RENDER={cards:renderCards,quiz:renderQuiz,flow:renderFlow,read:renderRead,script:renderScript,book:renderBook,review:renderReview};
function showTab(t){if(t!=='flow'){R.play=false;clearTimeout(R.timer)}
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.t===t));
  Object.keys(RENDER).forEach(id=>$(id).hidden=id!==t);RENDER[t]()}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>showTab(t.dataset.t));
const pref={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function setFuri(on){document.body.classList.toggle('nofuri',!on);$('furi').setAttribute('aria-pressed',on);pref.set('n2study-furi',on?'1':'0')}
$('furi').onclick=()=>setFuri(document.body.classList.contains('nofuri'));
const root=document.documentElement;
const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
function setTheme(t){if(t)root.dataset.theme=t;$('theme').textContent=isDark()?'주간 모드':'야간 모드'}
$('theme').onclick=()=>{const t=isDark()?'light':'dark';pref.set('n2study-theme',t);setTheme(t)};
const fsOn=()=>document.fullscreenElement||document.webkitFullscreenElement;
const fsReq=root.requestFullscreen||root.webkitRequestFullscreen;
if(!fsReq)$('fs').hidden=true;
$('fs').onclick=()=>{try{if(fsOn())(document.exitFullscreen||document.webkitExitFullscreen).call(document);
  else{const p=fsReq.call(root);if(p&&p.catch)p.catch(()=>{$('fs').hidden=true})}}catch(e){$('fs').hidden=true}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{$('fs').textContent=fsOn()?'전체화면 끝내기':'전체화면'}));
const ZS=[1,1.15,1.3,1.5,1.75];let zi=Math.max(0,ZS.indexOf(+pref.get('n2study-zoom')));
function setZoom(d){zi=Math.min(ZS.length-1,Math.max(0,zi+d));root.style.setProperty('--z',ZS[zi]);pref.set('n2study-zoom',ZS[zi]);
  ['zup','zup2'].forEach(id=>$(id).textContent='글자 + ('+Math.round(ZS[zi]*100)+'%)')}
['zup','zup2'].forEach(id=>$(id).onclick=()=>setZoom(1));['zdn','zdn2'].forEach(id=>$(id).onclick=()=>setZoom(-1));setZoom(0);
function setFocus(on){document.body.classList.toggle('focus',on);$('dock').hidden=!on}
$('hide').onclick=()=>setFocus(true);$('show').onclick=()=>setFocus(false);
setFuri(pref.get('n2study-furi')!=='0');setTheme(pref.get('n2study-theme'));
renderStats();buildDeck();startQuiz();showTab('cards');
</script>
