,"여동생은 하루 종일 게임만 하고 숙제를 하지 않는다.",["ばかりいて","だけいて","しかいて","ほどいて"],"〜てばかりいる: ~하기만 하다."],["문법","彼が何も言わない（　）、まだ怒っているようだ。","그가 아무 말도 하지 않는 것을 보면 아직 화가 나 있는 것 같다.",["ところをみると","ところをみて","ところにみると","ところでみると"],"〜ところをみると: ~하는 것을 보면. 추측의 근거."],["문법","「禁煙」（　）、たばこを吸ってはいけないという意味だ。","'금연'이란 담배를 피워서는 안 된다는 뜻이다.",["とは","とか","には","では"],"〜とは: 말의 뜻을 설명할 때 쓴다."],["문법","北海道（　）、雪やスキーを思い出す。","홋카이도라고 하면 눈이나 스키가 떠오른다.",["というと","といっても","というより","といった"],"〜というと: ~라고 하면 (떠오르는 것)."],["문법","この工場では、テレビや冷蔵庫（　）電気製品を作っている。","이 공장에서는 텔레비전이나 냉장고 같은 전기 제품을 만들고 있다.",["といった","というと","とは","として"],"〜といった: ~와 같은. 예를 들 때."],["문법","場合（　）、会議を来週に変えるかもしれない。","경우에 따라서는 회의를 다음 주로 바꿀지도 모른다.",["によっては","によると","にとっては","について"],"〜によっては: ~에 따라서는 (그런 경우도 있다)."],["문법","のどが痛くて、水（　）飲めない。","목이 아파서 물조차 마실 수 없다.",["すら","こそ","ほど","だけ"],"〜すら: ~조차. さえ와 같은 뜻의 딱딱한 표현."],["문법","迷っているなら、先生に相談してみて（　）。","망설이고 있다면 선생님께 상담해 보면 어떨까요?",["はどうですか","もどうですか","はどうでしたか","がどうですか"],"〜てはどうか: ~하면 어떨까. 부드러운 제안."],["문법","電気をつけた（　）出かけてしまった。","불을 켠 채로 나가 버렸다.",["まま","きり","うち","ところ"],"〜たまま: ~한 채로. 상태가 바뀌지 않고 계속됨."],["문법","あの店、月曜日は休みだった（　）。","그 가게, 월요일은 쉬는 날이었나?",["っけ","って","ってば","とか"],"〜っけ: 기억이 확실하지 않은 것을 확인할 때."],["문법","彼は三年間アメリカにいたそうだ。英語がうまい（　）。","그는 3년 동안 미국에 있었다고 한다. 영어를 잘할 만하다.",["わけだ","わけがない","わけではない","わけにはいかない"],"〜わけだ: 이유를 알고 납득할 때."],["문법","水は人間が生きていくために（　）ものだ。","물은 인간이 살아가기 위해 없어서는 안 되는 것이다.",["なくてはならない","なくてもいい","ないではいられない","なければいい"],"なくてはならない: 없어서는 안 된다."],["문법","外国人（　）、日本の電車は時間に正確だそうだ。","외국인 입장에서 보면 일본의 전철은 시간이 정확하다고 한다.",["から見ると","からには","からこそ","からして"],"〜から見ると: ~의 입장에서 보면."],["문법","彼女は服から靴（　）、すべて黒でそろえている。","그녀는 옷에서 신발에 이르기까지 모두 검은색으로 맞추고 있다.",["に至るまで","にわたって","において","に応じて"],"〜から〜に至るまで: ~에서 ~에 이르기까지."],["문법","私は（　）、にぎやかな所より静かな所のほうが落ち着く。","나는 굳이 말하자면 시끄러운 곳보다 조용한 곳이 더 차분해진다.",["どちらかというと","どちらにしても","どちらでも","どちらかといって"],"どちらかというと: 굳이 말하자면."],["문법","休みなのに全然休めなかった。（　）、いつもより疲れてしまった。","쉬는 날인데 전혀 쉬지 못했다. 오히려 평소보다 더 피곤해졌다.",["それどころか","それなのに","そのうえ","そのかわり"],"それどころか: 그렇기는커녕, 오히려."],["문법","この店は年中無休、（　）一年中休みがない。","이 가게는 연중무휴, 즉 일 년 내내 쉬는 날이 없다.",["すなわち","ところが","それとも","しかも"],"すなわち: 즉. 앞의 말을 바꿔 말할 때."],["문법","財布を落としたが、カードが入っていなかった（　）。","지갑을 잃어버렸지만 카드가 들어 있지 않았던 것만 해도 다행이다.",["だけましだ","だけのことはある","にすぎない","ほかない"],"〜だけましだ: 더 나쁜 상황이 아니어서 다행이다."],["문법","彼の日本語は上手だ。十年も日本に住んでいる（　）。","그의 일본어는 능숙하다. 과연 10년이나 일본에 산 보람이 있다.",["だけのことはある","だけましだ","わけにはいかない","ことになっている"],"〜だけのことはある: 과연 ~한 만큼의 가치·결과가 있다."],["문법","それは考え（　）最も良い方法だった。","그것은 생각할 수 있는 가장 좋은 방법이었다.",["得る","かねる","がたい","きれない"],"〜得る: ~할 수 있다. 考え得る = 생각할 수 있는."],["문법","電車のドアが閉まるか（　）かのうちに、彼は飛び乗った。","전철 문이 닫히자마자 그는 뛰어올라 탔다.",["閉まらない","閉まる","閉まった","閉まって"],"〜か〜ないかのうちに: ~하자마자. 같은 동사의 ない형을 쓴다."],["문법","半年間勉強した（　）、Ｎ２に合格した。","반년 동안 공부한 보람이 있어서 N2에 합격했다.",["かいがあって","せいで","あげく","ばかりに"],"〜たかいがあって: ~한 보람이 있어서. 좋은 결과가 온다."],["문법","この料理は、見た目（　）おいしそうだ。","이 요리는 겉모습부터가 맛있어 보인다.",["からして","からには","からこそ","からといって"],"〜からして: ~부터가. 대표적인 예를 들어 전체를 판단."],["문법","時間に正確な田中さんの（　）、もうすぐ来るでしょう。","시간을 잘 지키는 다나카 씨니까 곧 올 겁니다.",["ことだから","ものだから","ことなく","ものの"],"〜のことだから: 그 사람의 성격으로 보아 당연히."],["문법","子ども（　）、大人がそんなことをするとは信じられない。","아이라면 또 모르지만 어른이 그런 짓을 하다니 믿을 수 없다.",["ならまだしも","にしては","どころか","はもちろん"],"〜ならまだしも: ~라면 또 모르지만."],["문법","こんな失敗は二度と（　）と思った。","이런 실패는 두 번 다시 하지 않겠다고 생각했다.",["するまい","しよう","するべき","しそう"],"〜まい: ~하지 않겠다 (부정의 의지). する는 するまい・すまい."],["문법","食べ物を粗末にする（　）。","음식을 함부로 다루는 것이 아니다.",["ものではない","ことはない","わけがない","はずがない"],"〜ものではない: 일반적인 충고. ~하는 게 아니다."],["문법","あんな失礼な人とは、二度と話す（　）。","저런 무례한 사람과는 두 번 다시 말하나 봐라.",["ものか","ものだ","ことか","ことだ"],"〜ものか: 강한 부정. 절대 ~하지 않겠다."],["문법","かわいそうな話を聞いて、泣か（　）。","불쌍한 이야기를 듣고 울지 않을 수 없었다.",["ないではいられなかった","ないわけではなかった","ないことはなかった","なくてもよかった"],"〜ないではいられない: 참을 수 없이 ~하게 된다."],["문법","早めに家を出たので、遅刻（　）。","일찍 집을 나와서 지각하지 않고 끝났다.",["せずに済んだ","せざるを得なかった","しかねなかった","するところだった"],"〜ずに済む: ~하지 않고 끝나다. する는 せずに."],["문법","疲れたときは、早く寝る（　）。","피곤할 때는 일찍 자는 것이 최고다.",["に限る","に限らない","に限って","に限り"],"〜に限る: ~가 제일이다."],["문법","これは会社の信用（　）問題だ。","이것은 회사의 신용이 걸린 문제다.",["にかかわる","にこたえる","にわたる","にあたる"],"〜にかかわる: ~에 영향을 미치는, ~가 걸린."],["문법","準備は早い（　）。","준비는 빠른 것보다 좋은 것은 없다.",["に越したことはない","にすぎない","に決まっている","にほかならない"],"〜に越したことはない: ~하는 편이 당연히 좋다."],["문법","ご利用（　）、次の点にご注意ください。","이용하실 때 다음 사항에 주의해 주십시오.",["に際して","において","に関して","に対して"],"〜に際して: ~할 때 (격식 있는 표현)."],["문법","どんな理由がある（　）、うそをつくのはよくない。","어떤 이유가 있다고 해도 거짓말을 하는 것은 좋지 않다.",["にせよ","にしては","につけ","において"],"〜にせよ: ~라고 해도. にしろ와 같은 뜻."],["문법","この歌を聞く（　）、ふるさとを思い出す。","이 노래를 들을 때마다 고향이 생각난다.",["につけ","にせよ","にしても","にしたら"],"〜につけ: ~할 때마다 (자연히 그런 마음이 든다)."],["문법","彼女は歌（　）、ダンスも上手だ。","그녀는 노래뿐만 아니라 춤도 잘 춘다.",["のみならず","のみで","のもとで","の上では"],"〜のみならず: ~뿐만 아니라 (문어)."],["문법","彼は三十年間、この店を一人で守り（　）。","그는 30년 동안 이 가게를 혼자서 끝까지 지켜 냈다.",["ぬいた","かけた","そうだ","がたい"],"〜ぬく: 끝까지 ~하다."],["문법","結婚（　）、仕事を変えることにした。","결혼을 계기로 일을 바꾸기로 했다.",["を契機に","を中心に","を問わず","をめぐって"],"〜を契機に: ~을 계기로 (をきっかけに보다 딱딱함)."],["문법","昨夜は暑くて、（　）眠れなかった。","어젯밤은 더워서 제대로 자지 못했다.",["ろくに","めったに","まさか","せめて"],"ろくに〜ない: 제대로 ~하지 못하다."],["문법","年を取った（　）、最近疲れやすい。","나이를 먹은 탓인지 요즘 쉽게 피곤해진다.",["せいか","おかげで","かわりに","くせに"],"〜せいか: ~탓인지 (확실하지 않은 원인)."],["문법","旅行に行けるかどうかは、天気（　）決まる。","여행을 갈 수 있을지 어떨지는 날씨에 따라 정해진다.",["次第で","次第に","次第だ","次第"],"〜次第で: ~에 따라 (결정된다)."],["문법","どんなことをし（　）、この試合に勝ちたい。","어떤 짓을 해서라도 이 시합에 이기고 싶다.",["てでも","てまで","てこそ","ては"],"〜てでも: ~해서라도 (강한 의지)."],["문법","親になっ（　）、親のありがたさが分かる。","부모가 되어야 비로소 부모의 고마움을 안다.",["てこそ","てでも","ても","ては"],"〜てこそ: ~해야 비로소."],["문법","人をだまし（　）、お金をもうけたいとは思わない。","남을 속이면서까지 돈을 벌고 싶다고는 생각하지 않는다.",["てまで","てこそ","てから","ては"],"〜てまで: ~하면서까지 (그 정도까지는 하지 않는다)."],["문법","締め切りが近いので、休ん（　）。","마감이 가까워서 쉬고 있을 수 없다.",["ではいられない","でもかまわない","でばかりいる","だものだ"],"〜てはいられない: ~하고 있을 여유가 없다."],["문법","努力すれば必ず成功する（　）。","노력하면 반드시 성공한다는 것은 아니다.",["というものではない","というものだ","ということだ","というわけだ"],"〜というものではない: 반드시 ~라고는 할 수 없다."],["문법","引き受けた（　）、途中でやめるわけにはいかない。","맡은 이상은 도중에 그만둘 수는 없다.",["上は","上に","上で","上では"],"〜上は: ~한 이상은 (책임·각오)."],["문법","この店は味（　）、サービスもすばらしい。","이 가게는 맛은 물론 서비스도 훌륭하다.",["はもとより","はともかく","にしては","のくせに"],"〜はもとより: ~은 물론 (はもちろん보다 딱딱함)."],["문법","値段（　）、デザインは気に入った。","가격은 어쨌든 디자인은 마음에 들었다.",["はともかく","はもとより","のみならず","に加えて"],"〜はともかく: ~은 일단 제쳐두고."],["문법","終電がなくなったので、タクシーで帰る（　）。","막차가 끊겨서 택시로 돌아갈 수밖에 없다.",["よりほかない","わけがない","までもない","はずがない"],"〜よりほかない: ~할 수밖에 없다."],["문법","こんなことで泣く（　）、社会では通用しない。","이런 일로 울어서는 사회에서는 통하지 않는다.",["ようでは","ようなら","ようには","ようでも"],"〜ようでは: ~해서는 (좋은 결과가 나오지 않는다)."],["문법","会社を辞めようか（　）、ずっと悩んでいる。","회사를 그만둘지 말지 계속 고민하고 있다.",["辞めるまいか","辞めないか","辞めようか","辞めまいと"],"〜ようか〜まいか: ~할지 말지."],["문법","電気をつけ（　）で寝てしまった。","불을 켜 둔 채로 자 버렸다.",["っぱなし","がち","っぽい","かけ"],"〜っぱなし: ~한 채로 내버려 둠 (좋지 않은 느낌)."],["문법","悪いと思い（　）、うそをついてしまった。","나쁘다고 생각하면서도 거짓말을 해 버렸다.",["つつも","ながらに","つつある","がてら"],"〜つつも: ~하면서도 (역접)."],["문법","隣の部屋がうるさく（　）。","옆방이 시끄러워서 견딜 수 없다.",["てしかたがない","てもしかたがない","てはいけない","てはならない"],"〜てしかたがない: ~해서 견딜 수 없다."],["문법","物価は上がる（　）、給料は少しも上がらない。","물가는 오르기만 하고 급여는 조금도 오르지 않는다.",["ばかりで","だけあって","うえで","ものの"],"〜ばかりだ: 한쪽으로만 변화가 진행된다."],["문법","見ている（　）、宿題をしたことにはならない。","보고 있는 것만으로는 숙제를 한 것이 되지 않는다.",["だけでは","だけあって","だけに","だけなら"],"〜ことにはならない와 함께: ~만으로는 ~한 것이 되지 않는다."],["문장 배열","彼は ＿＿ ＿＿ ★ ＿＿ 、まだ一度も休んでいない。","그는 이 회사에 입사한 이래 아직 한 번도 쉬지 않았다.",["して","この会社に","入社","以来"],"순서: この会社に → 入社 → して → 以来. 〜て以来: ~한 이후 계속."],["문장 배열","この仕事は ＿＿ ＿＿ ★ ＿＿ ものではない。","이 일은 경험이 없는 사람이 간단히 할 수 있는 것이 아니다.",["簡単に","経験の","ない人に","できる"],"순서: 経験の → ない人に → 簡単に → できる."],["문장 배열","忙しい ＿＿ ＿＿ ★ ＿＿ はするべきだ。","바쁘다고 해도 전화 한 통 정도는 해야 한다.",["一本","にせよ","電話の","ぐらい"],"순서: にせよ → 電話の → 一本 → ぐらい. 〜にせよ: ~라고 해도."],["문장 배열","あの二人は ＿＿ ＿＿ ★ ＿＿ ほど、よく似ている。","저 두 사람은 형제로 착각할 만큼 많이 닮았다.",["見","兄弟","と","間違える"],"순서: 兄弟 → と → 見 → 間違える. 見間違える: 잘못 보다."],["문장 배열","山田さんは ＿＿ ＿＿ ★ ＿＿ 、スポーツも得意だ。","야마다 씨는 공부는 물론 스포츠도 잘한다.",["は","勉強","のこと","もとより"],"순서: 勉強 → のこと → は → もとより. 〜はもとより: ~은 물론."],["문장 배열","雨が ＿＿ ＿＿ ★ ＿＿ 、試合は続けられた。","비가 세차게 내리고 있는데도 불구하고 시합은 계속되었다.",["にも","降っている","かかわらず","強く"],"순서: 強く → 降っている → にも → かかわらず."],["문장 배열","一度 ＿＿ ＿＿ ★ ＿＿ 、最後までやりぬくつもりだ。","한번 하겠다고 말한 이상은 끝까지 해낼 생각이다.",["言った","やる","と","からには"],"순서: やる → と → 言った → からには. 〜からには: ~한 이상은."],["문장 배열","この問題は ＿＿ ＿＿ ★ ＿＿ ことにした。","이 문제는 부장님과 상의한 뒤에 결정하기로 했다.",["うえで","相談した","部長と","決める"],"순서: 部長と → 相談した → うえで → 決める. 〜たうえで: ~한 뒤에."],["문장 배열","彼女は ＿＿ ＿＿ ★ ＿＿ 、とても上手に日本語を話す。","그녀는 일본에 온 지 얼마 안 된 것치고는 일본어를 아주 잘한다.",["ばかり","来た","にしては","日本に"],"순서: 日本に → 来た → ばかり → にしては. 〜にしては: ~치고는."],["문장 배열","子どもが ＿＿ ＿＿ ★ ＿＿ 、ゆっくり本も読めない。","아이가 태어난 이후로 느긋하게 책도 읽을 수 없다.",["という","から","生まれて","もの"],"순서: 生まれて → から → という → もの. 〜てからというもの: ~한 이후로 줄곧."],["문장 배열","健康の ＿＿ ＿＿ ★ ＿＿ 、毎日歩くことにしている。","건강에 도움이 된다고 생각해서 매일 걷기로 하고 있다.",["と","ため","思って","になる"],"순서: ため → になる → と → 思って."],["문장 배열","窓を ＿＿ ＿＿ ★ ＿＿ 、風邪をひいてしまった。","창문을 열어 둔 채로 잔 탓에 감기에 걸려 버렸다.",["寝た","にして","開けっぱなし","せいで"],"순서: 開けっぱなし → にして → 寝た → せいで."],["문장 배열","合格できるか ＿＿ ＿＿ ★ ＿＿ だ。","합격할 수 있을지 어떨지는 앞으로의 노력에 달려 있다.",["努力","これからの","次第","どうかは"],"순서: どうかは → これからの → 努力 → 次第. 〜次第だ: ~에 달려 있다."],["문장 배열","先生に ＿＿ ＿＿ ★ ＿＿ 、漢字が好きになった。","선생님께 칭찬받은 것을 계기로 한자를 좋아하게 되었다.",["きっかけ","のを","ほめられた","に"],"순서: ほめられた → のを → きっかけ → に."],["문장 배열","この町は ＿＿ ＿＿ ★ ＿＿ 、人口が減りつつある。","이 마을은 젊은 사람이 도시로 나가 버리기 때문에 인구가 줄고 있다.",["出てしまう","都会へ","若い人が","ため"],"순서: 若い人が → 都会へ → 出てしまう → ため."],["문장 배열","この薬は ＿＿ ＿＿ ★ ＿＿ ください。","이 약은 의사와 상담하고 나서 드세요.",["から","医者に","相談して","飲んで"],"순서: 医者に → 相談して → から → 飲んで. 〜てから: ~하고 나서."],["문장 배열","どんなに ＿＿ ＿＿ ★ ＿＿ 、あきらめないつもりだ。","아무리 시간이 걸린다고 해도 포기하지 않을 생각이다.",["と","時間が","かかった","しても"],"순서: 時間が → かかった → と → しても. 〜としても: ~라고 해도."],["문장 배열","この本は ＿＿ ＿＿ ★ ＿＿ 読まれている。","이 책은 아이에서 어른에 이르기까지 널리 읽히고 있다.",["至るまで","子どもから","大人に","広く"],"순서: 子どもから → 大人に → 至るまで → 広く."],["문장 배열","あの店は ＿＿ ＿＿ ★ ＿＿ 、いつも込んでいる。","그 가게는 싸고 맛있는 만큼 언제나 붐빈다.",["だけ","安くて","おいしい","あって"],"순서: 安くて → おいしい → だけ → あって. 〜だけあって: ~인 만큼."],["문장 배열","忘れない ＿＿ ＿＿ ★ ＿＿ おこう。","잊어버리기 전에 일정을 수첩에 적어 두자.",["手帳に","うちに","予定を","書いて"],"순서: うちに → 予定を → 手帳に → 書いて. 〜ないうちに: ~하기 전에."],["용법","[[余計]]","걱정되는 건 알겠지만, 쓸데없는 말은 하지 않는 편이 좋다.",["心配なのは分かるが、[[余計]]なことは言わないほうがいい。","冷蔵庫に[[余計]]があったら、少し分けてください。","最近は忙しくて、旅行に行く[[余計]]がない。","一人では食べきれず、料理がすぐ[[余計]]になる。"],"余計: 쓸데없음, 필요 이상. '남은 것'은 余り, '여유'는 余裕."],["용법","[[率直]]","회의에서는 여러분의 솔직한 의견을 들려 주세요.",["会議では、皆さんの[[率直]]な意見を聞かせてください。","この道を[[率直]]に行くと、駅に出ます。","彼は[[率直]]に働くので、上司に信頼されている。","名前と住所を[[率直]]に書いてください。"],"率直: 솔직함 (의견·감상). '똑바로'는 まっすぐ, '성실히'는 まじめに, '정확히'는 正確に."],["용법","[[評判]]","이 병원은 친절하다는 평판이 높다.",["この病院は親切だと[[評判]]が高い。","試験の[[評判]]は来週発表される。","彼の[[評判]]では、明日は雨になるそうだ。","料理の[[評判]]を塩で調える。"],"評判: 세상의 평가. '결과'는 結果, '예상'은 予想, '맛'은 味."],["용법","[[苦情]]","밤늦은 소음에 대해 이웃에게서 항의가 왔다.",["夜遅くの騒音について、近所から[[苦情]]が来た。","試験に落ちて、彼は[[苦情]]な顔をしていた。","長い[[苦情]]の末に、やっと研究が完成した。","足の[[苦情]]がひどくて、歩けない。"],"苦情: 불만·항의. '괴로운 표정'은 苦しそうな, '고생'은 苦労, '통증'은 痛み."],["용법","[[相次ぐ]]","이 교차로에서는 사고가 잇따르고 있다.",["この交差点では、事故が[[相次いで]]いる。","父の仕事を[[相次いで]]、店の主人になった。","駅で友達と[[相次いで]]、一緒に出かけた。","次の電車に[[相次いで]]ください。"],"相次ぐ: 같은 종류의 일이 잇따라 일어나다. '이어받다'는 継ぐ, '만나다'는 会う, '갈아타다'는 乗り換える."],["용법","[[こなす]]","그녀는 어려운 일도 빨리 해낸다.",["彼女は難しい仕事も早く[[こなす]]。","古い建物を[[こなして]]、公園にした。","コップを落として[[こなして]]しまった。","熱が出たので、薬で[[こなした]]。"],"こなす: (일을) 처리하다, 해내다. '부수다'는 壊す, '낫게 하다'는 治す."],["용법","[[充実]]","이 도서관은 어린이 책이 충실하게 갖춰져 있다.",["この図書館は子ども向けの本が[[充実]]している。","コップに水が[[充実]]している。","電車は朝、人で[[充実]]している。","彼は約束を[[充実]]に守る人だ。"],"充実: 내용이 알차고 풍부함. '가득 차다'는 いっぱいだ・満ちる, '붐비다'는 込む, '충실히(성실히)'는 忠実に."],["용법","[[延長]]","시합은 동점이어서 30분 연장되었다.",["試合は同点だったので、三十分[[延長]]された。","髪が[[延長]]したので、切りに行った。","子どもの[[延長]]は早いものだ。","道路を[[延長]]に歩いて、駅に着いた。"],"延長: 시간·기간을 늘림. '자라다'는 伸びる, '성장'은 成長."],["용법","[[それとなく]]","부장님에게 넌지시 일정을 물어보았다.",["部長に[[それとなく]]予定を聞いてみた。","朝から[[それとなく]]雨が降っている。","荷物は[[それとなく]]重くて、持てなかった。","彼は[[それとなく]]大きな声で怒鳴った。"],"それとなく: 분명히 말하지 않고 넌지시. 말하다·묻다·전하다와 함께 쓴다."],["용법","[[一切]]","이 가게에서는 예약을 일절 받지 않습니다.",["この店では、予約を[[一切]]受け付けておりません。","[[一切]]の時間に駅に着いた。","りんごを[[一切]]食べたら、おなかがいっぱいになった。","彼は[[一切]]に走って、一位になった。"],"一切: 뒤에 부정이 와서 '전혀 ~않다'. '한 조각'은 一切れ(ひときれ)."],["용법","[[打ち込む]]","그는 대학 시절 연구에 몰두했다.",["彼は大学時代、研究に[[打ち込んだ]]。","雨が強く[[打ち込んで]]、試合は中止になった。","友達の話に[[打ち込んで]]、思わず笑った。","大事な書類を箱に[[打ち込んで]]しまった。"],"打ち込む: 한 가지 일에 열중하다. '비가 세차게 내리다'는 降る, '넣다'는 しまう."],["용법","[[更新]]","회원증은 2년마다 갱신할 필요가 있다.",["会員証は二年ごとに[[更新]]する必要がある。","古い家を[[更新]]して、住みやすくした。","部屋の空気を[[更新]]するために窓を開けた。","店員が商品を新しい物に[[更新]]してくれた。"],"更新: 계약·기록·면허 등을 새로 바꿈. '집을 고치다'는 改築・リフォーム, '환기'는 換気, '교환'은 交換."],["문맥 규정","ごみの（　）日は、月曜日と木曜日だ。","쓰레기 수거일은 월요일과 목요일이다.",["収集","募集","集合","集中"],"ごみの収集: 쓰레기 수거."],["문맥 규정","この電池は（　）が長く、五年は使えるそうだ。","이 건전지는 수명이 길어서 5년은 쓸 수 있다고 한다.",["寿命","年齢","一生","人生"],"寿命: 사람뿐 아니라 물건이 쓸 수 있는 기간에도 쓴다."],["문맥 규정","雨は五日（　）で降り続いている。","비는 닷새 연속으로 계속 내리고 있다.",["連続","継続","連絡","続行"],"〜日連続で: ~일 연속으로."],["문맥 규정","昨日の試合で、彼はチームの中心として大（　）した。","어제 시합에서 그는 팀의 중심으로서 크게 활약했다.",["活躍","活動","活発","生活"],"大活躍する: 크게 활약하다."],["문맥 규정","社長は、社員の意見を（　）する人だ。","사장은 사원의 의견을 중시하는 사람이다.",["重視","重大","尊敬","注目"],"意見を重視する: 의견을 중시하다."],["문맥 규정","運転免許を（　）するために、教習所に通っている。","운전면허를 취득하기 위해 운전 학원에 다니고 있다.",["取得","習得","獲物","得意"],"免許・資格を取得する."],["유의 표현","二人が同じ電車に乗ったのは、[[単なる]]偶然だ。","두 사람이 같은 전철을 탄 것은 단순한 우연이다.",["ただの","珍しい","不思議な","幸運な"],"単なる = ただの: 그저 ~에 불과한."],["유의 표현","会議の前に、資料を[[作成]]しておく。","회의 전에 자료를 작성해 둔다.",["作って","配って","調べて","直して"],"作成する = 作る."],["유의 표현","電車の遅れが[[相次いで]]いる。","전철 지연이 잇따르고 있다.",["続いて","減って","止まって","終わって"],"相次ぐ = 次々に続く."],["유의 표현","彼は仕事に[[打ち込んで]]いる。","그는 일에 몰두하고 있다.",["熱中して","困って","飽きて","慣れて"],"打ち込む = 熱中する."],["유의 표현","二人は昨日[[仲直り]]した。","두 사람은 어제 화해했다.",["また仲よくなった","けんかを始めた","初めて会った","別れた"],"仲直りする: 다시 사이좋게 되다."],["표기","この機械は[[せいのう]]がいい。","이 기계는 성능이 좋다.",["性能","生能","性脳","正能"],"性能: 성능."],["표기","会員に[[とうろく]]する。","회원으로 등록한다.",["登録","登緑","当録","登記"],"登録. 録(기록할 록)과 緑(푸를 록)을 구별."],["표기","先生に[[すいせん]]してもらった。","선생님께 추천을 받았다.",["推薦","推選","水薦","推鮮"],"推薦: 추천."],["표기","弱点を[[こくふく]]する。","약점을 극복한다.",["克服","克復","刻服","告服"],"克服: 극복."],["표기","会社の[[ぎょうせき]]が伸びる。","회사 실적이 오른다.",["業績","業積","行績","業責"],"業績. 績(길쌈 적)과 積(쌓을 적)을 구별."],["단어 형성","この歌は、だれもが知っている（　）曲だ。","이 노래는 누구나 아는 명곡이다.",["名","高","良","上"],"名〜: 名曲(명곡), 名場面, 名作."],["단어 형성","この辞書は（　）新の言葉まで載っている。","이 사전은 최신 단어까지 실려 있다.",["最","再","超","高"],"最新: 최신. 最〜는 '가장'."],["단어 형성","仕事を終えたときの達成（　）は大きい。","일을 마쳤을 때의 성취감은 크다.",["感","観","性","力"],"達成感. 〜感: 느낌 (満足感, 責任感)."],["단어 형성","彼には人をまとめる指導（　）がある。","그에게는 사람을 이끄는 지도력이 있다.",["力","性","感","的"],"指導力. 〜力: 능력 (理解力, 集中力)."],["단어 형성","期限（　）のチケットは使えません。","기한이 지난 티켓은 쓸 수 없습니다.",["切れ","過ぎ","終わり","抜け"],"期限切れ: 기한 만료. 〜切れ (品切れ, 時間切れ)."]];
const READ=[{"type":"내용 이해 (단문)","text":["最近、会議の記録をパソコンではなく手書きのノートで取るようにしている。入力の速さではパソコンにかなわないが、手で書くと、聞いた言葉をそのまま写すことができないので、自然と内容を自分の言葉でまとめるようになる。その結果、会議が終わったときには、何が決まり、何が残っているのかが頭の中で整理されている。記録の量は減ったが、後で読み返して役に立つのは、むしろ手書きのほうだと感じている。"],"ko":["요즘 회의 기록을 컴퓨터가 아니라 손으로 쓰는 노트에 하고 있다. 입력 속도로는 컴퓨터를 당할 수 없지만, 손으로 쓰면 들은 말을 그대로 옮겨 적을 수 없어서 자연스럽게 내용을 내 말로 정리하게 된다. 그 결과 회의가 끝났을 때에는 무엇이 정해졌고 무엇이 남았는지가 머릿속에 정리되어 있다. 기록의 양은 줄었지만, 나중에 다시 읽었을 때 도움이 되는 것은 오히려 손으로 쓴 쪽이라고 느낀다."],"qs":[{"q":"筆者が手書きのノートを使う理由として、最も合うものはどれか。","c":["書きながら内容を自分で整理できるから","パソコンより速く記録できるから","聞いた言葉をそのまま残せるから","記録の量を増やせるから"],"note":"\"自然と内容を自分の言葉でまとめるようになる\"가 핵심. 속도는 컴퓨터가 빠르고, 기록량은 줄었다고 했다.","qk":"필자가 손으로 쓰는 노트를 사용하는 이유로 가장 알맞은 것은 무엇인가?","ck":["쓰면서 내용을 스스로 정리할 수 있어서","컴퓨터보다 빨리 기록할 수 있어서","들은 말을 그대로 남길 수 있어서","기록의 양을 늘릴 수 있어서"]}]},{"type":"내용 이해 (단문)","text":["件名：来週の定例会議について","営業部の皆さん","来週月曜日の定例会議ですが、３階の会議室が工事のため使用できなくなりました。そのため、場所を５階の第二会議室に変更します。開始時間は予定どおり午前10時です。","なお、第二会議室にはプロジェクターがありません。資料を画面に映して説明する予定の方は、金曜日の午後５時までに総務部の石川までご連絡ください。こちらで機材を用意します。","総務部　石川"],"ko":["제목: 다음 주 정례 회의에 대해","영업부 여러분","다음 주 월요일 정례 회의 말인데요, 3층 회의실이 공사 때문에 사용할 수 없게 되었습니다. 그래서 장소를 5층 제2회의실로 변경합니다. 시작 시간은 예정대로 오전 10시입니다.","또한 제2회의실에는 프로젝터가 없습니다. 자료를 화면에 띄워 설명할 예정인 분은 금요일 오후 5시까지 총무부 이시카와에게 연락해 주십시오. 이쪽에서 기자재를 준비하겠습니다.","총무부 이시카와"],"qs":[{"q":"資料を画面に映して発表する人は、何をしなければならないか。","c":["金曜日の午後５時までに石川さんに連絡する","月曜日の朝、自分でプロジェクターを運ぶ","３階の会議室を予約し直す","開始時間を変更してもらう"],"note":"\"なお\" 뒤가 요청 사항. 기자재는 총무부가 준비하므로 연락만 하면 된다.","qk":"자료를 화면에 띄워 발표할 사람은 무엇을 해야 하는가?","ck":["금요일 오후 5시까지 이시카와 씨에게 연락한다","월요일 아침에 직접 프로젝터를 옮긴다","3층 회의실을 다시 예약한다","시작 시간을 바꿔 달라고 한다"]}]},{"type":"내용 이해 (중문)","text":["知らない町を歩くとき、私は地図アプリをなるべく見ないことにしている。目的地までの道を調べれば、最短の道を迷わずに歩ける。それは確かに便利だ。しかし、画面の矢印を追って歩いた町のことを、私はほとんど覚えていない。","一方、道に迷いながら歩いた町は不思議とよく覚えている。角を曲がるたびに周りを見回し、店の看板や坂の形を手がかりにするからだろう。①そうやって歩くうちに、予定になかった小さな本屋や、地元の人でにぎわう食堂に出会うこともある。","もちろん、約束の時間がある日にまでそうするわけではない。急ぐときは迷わず道具に頼ればいい。ただ、時間に余裕のある日くらいは、少し遠回りをしてみてはどうだろうか。目的地に早く着くことだけが、歩くことの価値ではないはずだ。"],"ko":["모르는 동네를 걸을 때 나는 지도 앱을 되도록 보지 않기로 하고 있다. 목적지까지 가는 길을 찾아보면 가장 짧은 길을 헤매지 않고 걸을 수 있다. 그건 분명 편리하다. 하지만 화면의 화살표를 따라 걸었던 동네는 거의 기억나지 않는다.","반면 길을 헤매며 걸었던 동네는 신기하게도 잘 기억난다. 모퉁이를 돌 때마다 주위를 둘러보고, 가게 간판이나 언덕의 모양을 단서로 삼기 때문일 것이다. 그렇게 걷다 보면 예정에 없던 작은 서점이나 동네 사람들로 북적이는 식당을 만나기도 한다.","물론 약속 시간이 있는 날에까지 그렇게 하는 것은 아니다. 급할 때는 망설이지 말고 도구에 의지하면 된다. 다만 시간에 여유가 있는 날 정도는 조금 돌아가 보면 어떨까. 목적지에 빨리 도착하는 것만이 걷는 일의 가치는 아닐 것이다."],"qs":[{"q":"①「そうやって歩く」とは、どのように歩くことか。","c":["周りの様子を手がかりにしながら歩く","画面の矢印を追いながら歩く","最短の道を選んで急いで歩く","地元の人に道を聞きながら歩く"],"note":"지시어는 바로 앞 문장을 가리킨다. \"周りを見回し、看板や坂の形を手がかりにする\".","qk":"① '그렇게 걷는다'는 것은 어떻게 걷는 것인가?","ck":["주변 모습을 단서로 삼으며 걷는다","화면의 화살표를 따라가며 걷는다","가장 짧은 길을 골라 서둘러 걷는다","현지 사람에게 길을 물으며 걷는다"]},{"q":"筆者が最も言いたいことは何か。","c":["余裕のあるときは、遠回りをして歩くことも楽しんでほしい","地図アプリは不便なので、使わないほうがいい","約束がある日でも、道具に頼らずに歩くべきだ","知らない町では、早く目的地に着くことが大切だ"],"note":"주장은 마지막 단락. \"〜てみてはどうだろうか\"는 제안 표현이다. 앱이 편리하다는 점과 급할 때는 써도 된다는 점은 인정하고 있다.","qk":"필자가 가장 말하고 싶은 것은 무엇인가?","ck":["여유가 있을 때는 돌아가는 길을 걷는 것도 즐겼으면 한다","지도 앱은 불편하니 쓰지 않는 편이 좋다","약속이 있는 날에도 도구에 의지하지 말고 걸어야 한다","모르는 동네에서는 빨리 목적지에 도착하는 것이 중요하다"]}]},{"type":"정보 검색","text":["みどり市立図書館　学習室利用案内","■利用できる方：市内に住んでいる方、または市内の学校・会社に通っている方","■利用時間：平日 9:00〜20:00／土日・祝日 9:00〜17:00","■休館日：毎週火曜日、月末の最終金曜日","■予約：利用日の７日前から前日まで、ホームページまたは窓口で受け付けます。当日は空席がある場合のみ、窓口で先着順に受け付けます（電話不可）。","■利用時間の上限：１回３時間まで。次の予約がない場合は、窓口で１回だけ延長できます（１時間）。","■注意：飲み物はふた付きのもののみ可。食事はできません。"],"ko":["미도리 시립 도서관 학습실 이용 안내","■이용 가능한 분: 시내에 거주하는 분, 또는 시내의 학교·회사에 다니는 분","■이용 시간: 평일 9:00~20:00 / 토·일·공휴일 9:00~17:00","■휴관일: 매주 화요일, 월말의 마지막 금요일","■예약: 이용일 7일 전부터 전날까지 홈페이지 또는 창구에서 접수합니다. 당일은 빈자리가 있는 경우에만 창구에서 선착순으로 접수합니다(전화 불가).","■이용 시간 상한: 1회 3시간까지. 다음 예약이 없는 경우 창구에서 1회에 한해 연장할 수 있습니다(1시간).","■주의: 음료는 뚜껑이 있는 것만 가능. 식사는 할 수 없습니다."],"qs":[{"q":"次のうち、学習室を利用できるのはだれか。","c":["となりの市に住み、みどり市内の会社に勤めている人が、土曜日の午後３時から利用する","みどり市に住んでいる人が、火曜日の午前10時から利用する","みどり市内の高校に通う学生が、日曜日の午後６時から利用する","となりの市に住み、となりの市の大学に通う人が、水曜日の午後から利用する"],"note":"화요일은 휴관, 일요일은 17시까지, 시외 거주에 시외 통학은 대상이 아니다. 시내 회사에 다니면 이용할 수 있다.","qk":"다음 중 학습실을 이용할 수 있는 사람은 누구인가?","ck":["옆 시에 살고 미도리시 안의 회사에 다니는 사람이 토요일 오후 3시부터 이용한다","미도리시에 사는 사람이 화요일 오전 10시부터 이용한다","미도리시 안의 고등학교에 다니는 학생이 일요일 오후 6시부터 이용한다","옆 시에 살고 옆 시의 대학에 다니는 사람이 수요일 오후부터 이용한다"]},{"q":"木曜日に利用したい人が、同じ週の水曜日に予約する場合、どうすればよいか。","c":["ホームページか窓口で申し込む","電話で申し込む","窓口でしか申し込めない","もう予約できないので、当日窓口に行く"],"note":"수요일은 이용일 \"전날\"이므로 아직 홈페이지와 창구 둘 다 가능하다. 창구만 되는 것은 당일이다.","qk":"목요일에 이용하고 싶은 사람이 같은 주 수요일에 예약할 경우, 어떻게 하면 되는가?","ck":["홈페이지나 창구에서 신청한다","전화로 신청한다","창구에서만 신청할 수 있다","이미 예약할 수 없으므로 당일 창구에 간다"]}]},{"type":"내용 이해 (단문)","text":["頼まれた仕事を断るのは勇気がいる。相手をがっかりさせたくないし、能力がないと思われるのも怖い。しかし、何でも引き受けていると、結局はどの仕事も中途半端になり、かえって信頼を失うことになりかねない。できないことを早めに「できない」と伝えるのは、無責任どころか、相手に別の方法を考える時間を与えることでもある。断ることは、仕事に対する誠実さの一つの形だと私は考えている。"],"ko":["부탁받은 일을 거절하는 데에는 용기가 필요하다. 상대를 실망시키고 싶지 않고, 능력이 없다고 여겨지는 것도 두렵다. 하지만 뭐든지 떠맡다 보면 결국 어느 일이나 어중간해져서 오히려 신뢰를 잃게 될 수도 있다. 못 하는 일을 일찌감치 \"못 한다\"고 전하는 것은 무책임하기는커녕 상대에게 다른 방법을 생각할 시간을 주는 일이기도 하다. 거절하는 것은 일에 대한 성실함의 한 형태라고 나는 생각한다."],"qs":[{"q":"筆者の考えに最も近いものはどれか。","c":["できないことを早く伝えるのは、誠実な態度である","頼まれた仕事は、無理をしてでも引き受けるべきだ","断ると信頼を失うので、できるだけ避けたほうがいい","仕事を断るのは、能力がない人のすることだ"],"note":"\"無責任どころか\"와 마지막 문장이 필자의 주장. 신뢰를 잃는 것은 뭐든 떠맡았을 때다.","qk":"필자의 생각에 가장 가까운 것은 무엇인가?","ck":["할 수 없는 일을 빨리 알리는 것은 성실한 태도이다","부탁받은 일은 무리를 해서라도 맡아야 한다","거절하면 신뢰를 잃으므로 되도록 피하는 편이 좋다","일을 거절하는 것은 능력이 없는 사람이 하는 일이다"]}]},{"type":"내용 이해 (단문)","text":["エレベーター点検のお知らせ","住民の皆様","下記のとおり、エレベーターの定期点検を行います。点検中はエレベーターをご利用いただけませんので、階段をお使いください。","日時：６月12日（木）午前10時〜正午","※雨天の場合も予定どおり行います。","※作業の状況によっては、終了が30分ほど遅れることがあります。","お体の不自由な方で、この時間に外出の予定がある方は、前日までに管理人室へお知らせください。係員がお手伝いします。","管理人室"],"ko":["엘리베이터 점검 안내","주민 여러분","아래와 같이 엘리베이터 정기 점검을 실시합니다. 점검 중에는 엘리베이터를 이용하실 수 없으니 계단을 이용해 주십시오.","일시: 6월 12일(목) 오전 10시~정오","※우천 시에도 예정대로 실시합니다.","※작업 상황에 따라 종료가 30분 정도 늦어질 수 있습니다.","몸이 불편하신 분 중 이 시간에 외출 예정이 있는 분은 전날까지 관리인실로 알려 주십시오. 담당자가 도와드리겠습니다.","관리인실"],"qs":[{"q":"このお知らせの内容と合うものはどれか。","c":["手伝いが必要な人は、６月11日までに管理人室に連絡する","雨が降った場合、点検は別の日に行われる","点検は必ず正午に終わる","点検中は、係員と一緒ならエレベーターに乗れる"],"note":"\"前日までに\"는 6월 11일까지. 비가 와도 실시하고, 30분쯤 늦어질 수 있으며, 점검 중에는 이용할 수 없다.","qk":"이 안내문의 내용과 맞는 것은 무엇인가?","ck":["도움이 필요한 사람은 6월 11일까지 관리인실에 연락한다","비가 올 경우 점검은 다른 날에 실시된다","점검은 반드시 정오에 끝난다","점검 중에는 담당 직원과 함께라면 엘리베이터를 탈 수 있다"]}]},{"type":"내용 이해 (중문)","text":["私の会社では、月に一度「失敗発表会」というものを開いている。社員が自分の失敗を一つ選び、何が起きて、なぜそうなったのかを皆の前で話すのだ。","始めた当初は、だれも話したがらなかった。失敗を知られれば評価が下がると思ったからだろう。そこで、まず社長である私が、自分の判断ミスで大きな契約を逃した話をした。それをきっかけに、少しずつ手が挙がるようになった。","①おもしろいことに、発表会を続けるにつれて、同じ種類のミスが目に見えて減ってきた。一人の失敗が全員の知識になったからにほかならない。失敗は隠せば個人の傷にすぎないが、共有すれば会社の財産になる。責める文化のもとでは、人は失敗を隠すようになるだけだ。"],"ko":["우리 회사에서는 한 달에 한 번 \"실패 발표회\"라는 것을 열고 있다. 사원이 자신의 실패를 하나 골라 무슨 일이 일어났고 왜 그렇게 됐는지를 모두 앞에서 이야기하는 것이다.","시작한 당초에는 아무도 이야기하려 하지 않았다. 실패가 알려지면 평가가 내려간다고 생각했기 때문일 것이다. 그래서 먼저 사장인 내가, 내 판단 실수로 큰 계약을 놓친 이야기를 했다. 그것을 계기로 조금씩 손이 올라오게 되었다.","재미있게도 발표회를 계속함에 따라 같은 종류의 실수가 눈에 띄게 줄었다. 한 사람의 실패가 모두의 지식이 되었기 때문이다. 실패는 숨기면 개인의 상처에 불과하지만 공유하면 회사의 재산이 된다. 탓하는 문화 아래에서는 사람은 실패를 숨기게 될 뿐이다."],"qs":[{"q":"最初、社員が話したがらなかったのはなぜか。","c":["失敗を知られると、評価が下がると思ったから","発表会の準備に時間がかかるから","社長が先に話してしまったから","自分には失敗がないと思っていたから"],"note":"둘째 단락 \"失敗を知られれば評価が下がると思ったからだろう\".","qk":"처음에 사원들이 이야기하고 싶어 하지 않은 것은 왜인가?","ck":["실패가 알려지면 평가가 떨어진다고 생각해서","발표회 준비에 시간이 걸려서","사장이 먼저 이야기해 버려서","자신에게는 실패가 없다고 생각해서"]},{"q":"①「おもしろいこと」とは何か。","c":["発表会を続けるうちに、同じ種類のミスが減ったこと","社長が自分の失敗を話したこと","社員が少しずつ手を挙げるようになったこと","失敗を隠す社員が増えたこと"],"note":"\"おもしろいことに\" 바로 뒤에 내용이 나온다.","qk":"① '재미있는 일'이란 무엇인가?","ck":["발표회를 계속하는 동안 같은 종류의 실수가 줄어든 것","사장이 자신의 실패를 이야기한 것","사원들이 조금씩 손을 들게 된 것","실패를 숨기는 사원이 늘어난 것"]},{"q":"筆者が最も言いたいことは何か。","c":["失敗は責めずに共有したほうが、会社のためになる","失敗した社員は、皆の前で反省するべきだ","社長は社員より多くの失敗を話すべきだ","失敗を減らすには、評価を厳しくする必要がある"],"note":"마지막 두 문장이 주장. \"共有すれば会社の財産になる\".","qk":"필자가 가장 말하고 싶은 것은 무엇인가?","ck":["실패는 탓하지 말고 공유하는 편이 회사에 도움이 된다","실패한 사원은 모두 앞에서 반성해야 한다","사장은 사원보다 더 많은 실패를 이야기해야 한다","실패를 줄이려면 평가를 엄격하게 할 필요가 있다"]}]},{"type":"정보 검색","text":["さくら市民スポーツセンター　秋の教室案内","■水泳（初級）：毎週月・水　19:00〜20:00　月4,000円　対象：16歳以上","■ヨガ：毎週火　10:00〜11:00　月3,000円　対象：18歳以上","■卓球：毎週土　14:00〜16:00　月2,500円　対象：小学生以上","■バドミントン：毎週日　9:00〜11:00　月2,500円　対象：中学生以上","■申し込み：９月１日から20日まで、受付窓口で。定員を超えた場合は抽選。","■割引：二つ以上の教室に申し込むと、合計から500円引き。市外の方は各教室に500円追加。"],"ko":["사쿠라 시민 스포츠 센터 가을 교실 안내","■수영(초급): 매주 월·수 19:00~20:00, 월 4,000엔, 대상: 16세 이상","■요가: 매주 화 10:00~11:00, 월 3,000엔, 대상: 18세 이상","■탁구: 매주 토 14:00~16:00, 월 2,500엔, 대상: 초등학생 이상","■배드민턴: 매주 일 9:00~11:00, 월 2,500엔, 대상: 중학생 이상","■신청: 9월 1일부터 20일까지 접수 창구에서. 정원을 넘으면 추첨.","■할인: 두 개 이상의 교실을 신청하면 합계에서 500엔 할인. 시외 거주자는 교실마다 500엔 추가."],"qs":[{"q":"市内に住む会社員の田中さん（30歳）は、平日の夜しか時間がない。田中さんが参加できる教室はどれか。","c":["水泳","ヨガ","卓球","バドミントン"],"note":"평일 밤에 열리는 것은 수영뿐. 요가는 평일 오전, 탁구와 배드민턴은 주말이다.","qk":"시내에 사는 회사원 다나카 씨(30세)는 평일 밤에만 시간이 있다. 다나카 씨가 참가할 수 있는 교실은 무엇인가?","ck":["수영","요가","탁구","배드민턴"]},{"q":"市内に住む高校生（17歳）が卓球とバドミントンの両方に申し込むと、月にいくら払うか。","c":["4,500円","5,000円","5,500円","4,000円"],"note":"2,500엔 + 2,500엔 = 5,000엔. 두 교실 신청 할인 500엔을 빼면 4,500엔. 시내 거주라 추가 요금은 없다.","qk":"시내에 사는 고등학생(17세)이 탁구와 배드민턴 둘 다 신청하면 한 달에 얼마를 내는가?","ck":["4,500엔","5,000엔","5,500엔","4,000엔"]}]},{"type":"내용 이해 (단문)","text":["携帯電話が普及する前は、待ち合わせに遅れることは大きな問題だった。相手に連絡する方法がないため、時間と場所を細かく決め、必ず守らなければならなかった。今では「少し遅れる」と送れば済む。便利になったのは確かだが、その分、約束を守ろうとする気持ちが弱くなったように思う。簡単に連絡できるからこそ、相手の時間を大切にする意識を持ち続けたいものだ。"],"ko":["휴대전화가 보급되기 전에는 약속 시간에 늦는 것이 큰 문제였다. 상대에게 연락할 방법이 없어서 시간과 장소를 세세하게 정하고 반드시 지켜야 했다. 지금은 \"조금 늦는다\"고 보내면 끝난다. 편리해진 것은 분명하지만 그만큼 약속을 지키려는 마음이 약해진 것 같다. 쉽게 연락할 수 있기 때문에 더더욱 상대의 시간을 소중히 여기는 의식을 계속 지니고 싶다."],"qs":[{"q":"筆者が最も言いたいことは何か。","c":["連絡が簡単になっても、相手の時間を大切にするべきだ","携帯電話がなかった時代のほうがよかった","待ち合わせの時間は細かく決めないほうがいい","遅れるときは、必ず連絡しなければならない"],"note":"주장은 마지막 문장 \"〜たいものだ\". 옛날이 좋았다는 말이 아니라, 편리해진 지금 필요한 마음가짐을 말하고 있다.","qk":"필자가 가장 말하고 싶은 것은 무엇인가?","ck":["연락이 간단해져도 상대의 시간을 소중히 여겨야 한다","휴대전화가 없던 시대가 더 좋았다","약속 시간은 세세하게 정하지 않는 편이 좋다","늦을 때는 반드시 연락해야 한다"]}]},{"type":"내용 이해 (단문)","text":["件名：新人研修の日程変更について","新入社員の皆さん","来週予定していた工場見学ですが、工場側の都合により、木曜日から金曜日に変更になりました。集合時間と場所は変わりません。午前８時半に本社の正面玄関に集まってください。","なお、金曜日の午後に予定していたパソコン研修は、木曜日の同じ時間に行います。","工場内では安全靴が必要です。まだ受け取っていない方は、水曜日までに総務部に取りに来てください。","人事部　山本"],"ko":["제목: 신입 연수 일정 변경에 대해","신입 사원 여러분","다음 주에 예정했던 공장 견학 말인데요, 공장 측 사정으로 목요일에서 금요일로 변경되었습니다. 집합 시간과 장소는 바뀌지 않습니다. 오전 8시 반에 본사 정면 현관으로 모여 주세요.","또한 금요일 오후에 예정했던 컴퓨터 연수는 목요일 같은 시간에 실시합니다.","공장 안에서는 안전화가 필요합니다. 아직 받지 않은 분은 수요일까지 총무부로 가지러 와 주세요.","인사부 야마모토"],"qs":[{"q":"このメールの内容と合うものはどれか。","c":["パソコン研修は木曜日の午後に行われる","工場見学の集合時間が変わった","安全靴は当日、工場で受け取る","工場見学は中止になった"],"note":"견학과 컴퓨터 연수의 요일이 서로 바뀌었다. 집합 시간은 그대로이고, 안전화는 수요일까지 총무부에서 받는다.","qk":"이 메일의 내용과 맞는 것은 무엇인가?","ck":["컴퓨터 연수는 목요일 오후에 실시된다","공장 견학의 집합 시간이 바뀌었다","안전화는 당일 공장에서 받는다","공장 견학은 취소되었다"]}]},{"type":"내용 이해 (중문)","text":["速読の本がよく売れているそうだ。一冊を三十分で読めるとうたうものもある。忙しい現代人にとって、短い時間で多くの情報を得たいという気持ちはよくわかる。","しかし、私は①速く読むことにあまり意味を感じない。ビジネス書のように、必要な情報だけを拾えばよい本なら、それでもかまわないだろう。だが、小説や随筆は違う。作者が言葉を選ぶのにかけた時間を、読む側が飛ばしてしまっては、文章の味わいは残らない。","私は気に入った本を、時間をかけて何度も読む。二度目、三度目には、初めは気づかなかった表現に目が止まる。本の数を誇るより、一冊と深く付き合うほうが、得るものは大きいのではないだろうか。"],"ko":["속독 책이 잘 팔린다고 한다. 한 권을 30분에 읽을 수 있다고 내세우는 것도 있다. 바쁜 현대인에게 짧은 시간에 많은 정보를 얻고 싶다는 마음은 잘 이해된다.","하지만 나는 빨리 읽는 것에 그다지 의미를 느끼지 않는다. 비즈니스 서적처럼 필요한 정보만 건지면 되는 책이라면 그래도 괜찮을 것이다. 하지만 소설이나 수필은 다르다. 작가가 말을 고르는 데 들인 시간을 읽는 쪽이 건너뛰어 버리면 문장의 맛은 남지 않는다.","나는 마음에 든 책을 시간을 들여 여러 번 읽는다. 두 번째, 세 번째에는 처음에는 알아채지 못했던 표현에 눈이 멈춘다. 책의 수를 자랑하기보다 한 권과 깊이 사귀는 편이 얻는 것이 크지 않을까."],"qs":[{"q":"①「速く読むことにあまり意味を感じない」とあるが、小説や随筆の場合、それはなぜか。","c":["速く読むと、文章の味わいが残らないから","情報が多すぎて、覚えられないから","速読の本は値段が高いから","現代人はそれほど忙しくないから"],"note":"둘째 단락 마지막 문장 \"飛ばしてしまっては、文章の味わいは残らない\".","qk":"① '빨리 읽는 것에 별로 의미를 느끼지 못한다'고 했는데, 소설이나 수필의 경우 그것은 왜인가?","ck":["빨리 읽으면 글의 맛이 남지 않아서","정보가 너무 많아 기억할 수 없어서","속독 책은 값이 비싸서","현대인은 그렇게 바쁘지 않아서"]},{"q":"筆者によると、速く読んでもかまわないのはどのような本か。","c":["必要な情報だけを得ればよい本","作者が時間をかけて書いた小説","何度も読み返したい随筆","筆者が気に入っている本"],"note":"\"必要な情報だけを拾えばよい本なら、それでもかまわない\".","qk":"필자에 따르면, 빨리 읽어도 괜찮은 것은 어떤 책인가?","ck":["필요한 정보만 얻으면 되는 책","작가가 시간을 들여 쓴 소설","몇 번이고 다시 읽고 싶은 수필","필자가 마음에 들어 하는 책"]},{"q":"筆者の考えに合うものはどれか。","c":["多くの本を読むより、一冊を繰り返し読むほうがよい","忙しい人は、速読を身につけるべきだ","小説より、役に立つ本を読むべきだ","本は一度読めば十分である"],"note":"마지막 문장 \"〜のではないだろうか\"는 완곡한 주장.","qk":"필자의 생각에 맞는 것은 무엇인가?","ck":["많은 책을 읽기보다 한 권을 되풀이해 읽는 편이 좋다","바쁜 사람은 속독을 익혀야 한다","소설보다 도움이 되는 책을 읽어야 한다","책은 한 번 읽으면 충분하다"]}]},{"type":"내용 이해 (중문)","text":["近所のスーパーに、客が自分で会計をする機械が入った。最初は使い方がわからず、店員に聞いてばかりいたが、慣れてしまえば並ぶ時間が短くなり、便利だと感じている。","ところが、先日、年配の女性が機械の前で困っているのを見かけた。画面の文字が小さいうえに、操作の順番がわかりにくいらしい。後ろに並んだ人の視線を気にして、結局、何も買わずに帰ってしまった。","技術は多くの人の時間を節約する。その一方で、ついていけない人を置いていくこともある。店員のいるレジを一つ残すだけでも、状況は変わるはずだ。便利さを進めるときこそ、だれが困るのかを想像する必要がある。"],"ko":["근처 슈퍼에 손님이 직접 계산하는 기계가 들어왔다. 처음에는 사용법을 몰라 점원에게 묻기만 했지만, 익숙해지고 나니 줄 서는 시간이 짧아져서 편리하다고 느끼고 있다.","그런데 얼마 전 연세 지긋한 여성이 기계 앞에서 곤란해하는 것을 봤다. 화면의 글자가 작은 데다 조작 순서가 알기 어려운 모양이다. 뒤에 줄 선 사람들의 시선이 신경 쓰여 결국 아무것도 사지 않고 돌아가 버렸다.","기술은 많은 사람의 시간을 절약해 준다. 한편으로는 따라가지 못하는 사람을 두고 가기도 한다. 점원이 있는 계산대를 하나 남기는 것만으로도 상황은 달라질 것이다. 편리함을 추진할 때일수록 누가 곤란해질지를 상상할 필요가 있다."],"qs":[{"q":"年配の女性が何も買わずに帰ったのはなぜか。","c":["機械の操作がわからず、後ろの人が気になったから","店員がいなくて、商品が見つからなかったから","並ぶ時間が長くて、待てなかったから","欲しい物が売り切れていたから"],"note":"둘째 단락. 글자가 작고 조작이 어려웠으며 뒷사람의 시선이 신경 쓰였다.","qk":"나이 든 여성이 아무것도 사지 않고 돌아간 것은 왜인가?","ck":["기계 조작을 몰랐고 뒷사람이 신경 쓰여서","점원이 없어서 상품을 찾지 못해서","줄 서는 시간이 길어 기다릴 수 없어서","갖고 싶은 물건이 다 팔려서"]},{"q":"筆者の考えに最も近いものはどれか。","c":["便利な技術を広めるときは、使えない人のことも考えるべきだ","会計の機械は不便なので、なくしたほうがいい","年配の人は、機械の使い方を練習するべきだ","店員のいるレジを増やせば、時間が節約できる"],"note":"마지막 문장이 주장. 필자 자신은 기계가 편리하다고 느끼고 있다.","qk":"필자의 생각에 가장 가까운 것은 무엇인가?","ck":["편리한 기술을 보급할 때는 쓰지 못하는 사람도 생각해야 한다","계산 기계는 불편하니 없애는 편이 좋다","나이 든 사람은 기계 사용법을 연습해야 한다","점원이 있는 계산대를 늘리면 시간을 절약할 수 있다"]}]},{"type":"통합 이해","text":["Ａ","在宅勤務を始めて一年になる。通勤に使っていた時間が自分のものになり、家族と夕食をとれるようになった。集中したいときに話しかけられることもなく、仕事の質も上がったと感じる。会社に行くのは月に数回で十分だ。","Ｂ","在宅勤務は確かに楽だが、失ったものもある。廊下での立ち話や昼食の雑談から生まれていたアイディアが、画面越しの会議では出てこない。新人が先輩の仕事を見て学ぶ機会も減った。週の半分は出社する形が、ちょうどよいのではないか。"],"ko":["A","재택근무를 시작한 지 1년이 된다. 통근에 쓰던 시간이 내 것이 되어 가족과 저녁을 먹을 수 있게 되었다. 집중하고 싶을 때 누가 말을 거는 일도 없어 일의 질도 올라갔다고 느낀다. 회사에 가는 것은 한 달에 몇 번이면 충분하다.","B","재택근무는 분명 편하지만 잃은 것도 있다. 복도에서 서서 나누는 이야기나 점심때의 잡담에서 나오던 아이디어가 화면 너머의 회의에서는 나오지 않는다. 신입이 선배의 일을 보고 배울 기회도 줄었다. 주의 절반은 출근하는 형태가 딱 좋지 않을까."],"qs":[{"q":"ＡとＢのどちらも述べていることは何か。","c":["在宅勤務には良い点がある","在宅勤務では仕事の質が下がる","新人の教育が難しくなった","通勤の時間は無駄である"],"note":"A는 장점을 여럿 들었고, B도 \"確かに楽だが\"라고 인정했다. 신입 교육은 B만 말했다.","qk":"A와 B가 둘 다 말하고 있는 것은 무엇인가?","ck":["재택근무에는 좋은 점이 있다","재택근무에서는 일의 질이 떨어진다","신입 교육이 어려워졌다","통근 시간은 낭비이다"]},{"q":"出社について、ＡとＢはどう考えているか。","c":["Ａは月に数回でよいと考え、Ｂは週の半分は必要だと考えている","ＡもＢも、毎日出社するべきだと考えている","Ａは出社は必要ないと考え、Ｂは毎日必要だと考えている","ＡもＢも、出社の回数はもっと減らすべきだと考えている"],"note":"A의 마지막 문장 \"月に数回で十分\", B의 마지막 문장 \"週の半分は出社\".","qk":"출근에 대해 A와 B는 어떻게 생각하는가?","ck":["A는 한 달에 몇 번이면 된다고 생각하고, B는 일주일의 절반은 필요하다고 생각한다","A도 B도 매일 출근해야 한다고 생각한다","A는 출근이 필요 없다고 생각하고, B는 매일 필요하다고 생각한다","A도 B도 출근 횟수를 더 줄여야 한다고 생각한다"]}]},{"type":"정보 검색","text":["みなと市立美術館　入館案内","■開館時間：10:00〜18:00（金曜日は20:00まで）※入館は閉館の30分前まで","■休館日：月曜日（祝日の場合は開館し、翌日休館）","■入館料：一般 1,200円／大学生 800円／高校生以下 無料","■割引：65歳以上の方は半額。10名以上の団体は一人につき200円引き（一般・大学生のみ）。割引は一つしか使えません。","■無料の日：毎月第一日曜日は、どなたでも無料","■注意：大学生・高校生は学生証を、65歳以上の方は年齢のわかるものをお見せください。"],"ko":["미나토 시립 미술관 입장 안내","■개관 시간: 10:00~18:00 (금요일은 20:00까지) ※입장은 폐관 30분 전까지","■휴관일: 월요일 (공휴일인 경우 개관하고 다음 날 휴관)","■입장료: 일반 1,200엔 / 대학생 800엔 / 고등학생 이하 무료","■할인: 65세 이상은 반액. 10명 이상 단체는 1인당 200엔 할인(일반·대학생만). 할인은 하나만 쓸 수 있습니다.","■무료인 날: 매월 첫째 일요일은 누구나 무료","■주의: 대학생·고등학생은 학생증을, 65세 이상인 분은 나이를 알 수 있는 것을 보여 주세요."],"qs":[{"q":"山田さんは金曜日の仕事のあとに美術館へ行きたい。何時までに入館しなければならないか。","c":["19時30分","17時30分","18時","20時"],"note":"금요일은 20시까지 열고, 입장은 폐관 30분 전까지이므로 19시 30분.","qk":"야마다 씨는 금요일 퇴근 후에 미술관에 가고 싶다. 몇 시까지 입장해야 하는가?","ck":["19시 30분","17시 30분","18시","20시"]},{"q":"一般の大人12人の団体が、土曜日（第一日曜日ではない日）に入館する。入館料は全部でいくらか。","c":["12,000円","14,400円","7,200円","9,600円"],"note":"10명 이상 단체는 1인당 200엔 할인. (1,200 − 200) × 12 = 12,000엔.","qk":"일반 성인 12명 단체가 토요일(첫째 일요일이 아닌 날)에 입장한다. 입장료는 모두 얼마인가?","ck":["12,000엔","14,400엔","7,200엔","9,600엔"]}]},{"type":"글의 문법","text":["私の町の商店街には、古い本屋が一軒ある。大きな書店（ 1 ）、本の数は決して多くない。それでも私は、本を買うときは必ずこの店に行くことにしている。","店の主人は、客が手に取った本を見て、次に読むといい本を教えてくれる。インターネットでも「おすすめ」は表示されるが、あれは過去に買った本と似たものが並ぶ（ 2 ）。主人がすすめてくれるのは、私が自分では決して選ばないような本だ。","最初は半分疑いながら読み始めるのだが、読み終わるころには、いつも新しい世界を知った気持ちになる。（ 3 ）、この店は私にとって、本を買う場所というより、知らない世界への入り口なのだ。","最近は本屋が減る一方だという。便利さだけを考えれば、それも仕方のないこと（ 4 ）。しかし、人と本との出会いを作ってくれる場所がなくなるのは、やはり残念でならない。"],"ko":["우리 동네 상점가에는 오래된 서점이 한 곳 있다. 대형 서점에 비하면 책의 수는 결코 많지 않다. 그래도 나는 책을 살 때는 반드시 이 가게에 가기로 하고 있다.","가게 주인은 손님이 집어 든 책을 보고 다음에 읽으면 좋은 책을 알려 준다. 인터넷에서도 \"추천\"은 표시되지만, 그것은 과거에 산 책과 비슷한 것이 늘어설 뿐이다. 주인이 추천해 주는 것은 내가 스스로는 결코 고르지 않을 듯한 책이다.","처음에는 반쯤 의심하면서 읽기 시작하지만, 다 읽을 무렵에는 언제나 새로운 세계를 안 기분이 된다. 즉 이 가게는 나에게 책을 사는 곳이라기보다 모르는 세계로 들어가는 입구인 것이다.","요즘은 서점이 줄어들기만 한다고 한다. 편리함만 생각하면 그것도 어쩔 수 없는 일일지도 모른다. 하지만 사람과 책의 만남을 만들어 주는 곳이 없어지는 것은 역시 아쉬워 견딜 수 없다."],"qs":[{"q":"（ 1 ）に入るものはどれか。","c":["に比べると","にとっては","に応じて","にしたがって"],"note":"대형 서점과 비교하는 문맥. 〜に比べると: ~에 비하면.","qk":"( 1 )에 들어갈 것은 무엇인가?","ck":["~에 비하면","~에게는","~에 따라 (대응해서)","~에 따라 (변화에 맞춰)"]},{"q":"（ 2 ）に入るものはどれか。","c":["にすぎない","に違いない","わけがない","ことはない"],"note":"\"비슷한 것이 늘어설 뿐\"이라는 낮은 평가. 〜にすぎない: ~에 불과하다.","qk":"( 2 )에 들어갈 것은 무엇인가?","ck":["~에 불과하다","~임에 틀림없다","~일 리가 없다","~할 필요는 없다"]},{"q":"（ 3 ）に入るものはどれか。","c":["つまり","ところが","それとも","もっとも"],"note":"앞 내용을 정리해 다시 말한다. つまり: 즉.","qk":"( 3 )에 들어갈 것은 무엇인가?","ck":["즉","그런데","아니면","다만"]},{"q":"（ 4 ）に入るものはどれか。","c":["かもしれない","にほかならない","とは限らない","はずがない"],"note":"일단 인정한 뒤 \"しかし\"로 반론한다. 〜かもしれない가 자연스럽다.","qk":"( 4 )에 들어갈 것은 무엇인가?","ck":["~일지도 모른다","바로 ~이다","~라고는 할 수 없다","~일 리가 없다"]}]},{"type":"글의 문법","text":["先月から、会社まで自転車で通うことにした。きっかけは、健康診断で運動不足を注意された（ 1 ）。最初の一週間は、会社に着いただけで疲れてしまい、仕事（ 2 ）。","ところが、二週間目に入ると体が慣れてきて、朝の空気が気持ちよく感じられるようになった。電車に乗っていたころは気づかなかった小さな公園や、開店の準備をするパン屋の様子も目に入る。同じ道を通っている（ 3 ）、見える景色はまったく違うのだ。","もちろん、雨の日は電車に乗る（ 4 ）。それでも、晴れた朝に自転車で走る時間は、今では一日の中でいちばんの楽しみになっている。"],"ko":["지난달부터 회사까지 자전거로 다니기로 했다. 계기는 건강 검진에서 운동 부족을 지적받은 것이다. 처음 일주일은 회사에 도착한 것만으로 지쳐 버려서 일할 상황이 아니었다.","그런데 2주째에 들어서자 몸이 익숙해져서 아침 공기가 기분 좋게 느껴지게 되었다. 전철을 타던 때는 알아채지 못했던 작은 공원이나 개점 준비를 하는 빵집의 모습도 눈에 들어온다. 같은 길을 지나고 있는데도 보이는 풍경은 전혀 다른 것이다.","물론 비 오는 날은 전철을 탈 수밖에 없다. 그래도 맑은 아침에 자전거로 달리는 시간은 지금은 하루 중 가장 큰 즐거움이 되어 있다."],"qs":[{"q":"（ 1 ）に入るものはどれか。","c":["ことだ","ものだ","ところだ","わけだ"],"note":"\"きっかけは〜ことだ\": 계기는 ~한 것이다. 주어를 설명하는 명사화.","qk":"( 1 )에 들어갈 것은 무엇인가?","ck":["~한 것이다","~하는 법이다","막 ~한 참이다","~인 셈이다"]},{"q":"（ 2 ）に入るものはどれか。","c":["どころではなかった","にすぎなかった","ばかりだった","に決まっていた"],"note":"〜どころではない: ~할 상황이 아니다.","qk":"( 2 )에 들어갈 것은 무엇인가?","ck":["~할 상황이 아니었다","~에 불과했다","~하기만 했다","~임에 틀림없었다"]},{"q":"（ 3 ）に入るものはどれか。","c":["にもかかわらず","からには","おかげで","うえに"],"note":"같은 길인데도 풍경이 다르다는 역접. 〜にもかかわらず.","qk":"( 3 )에 들어갈 것은 무엇인가?","ck":["~인데도 불구하고","~한 이상은","~덕분에","~한 데다가"]},{"q":"（ 4 ）に入るものはどれか。","c":["しかない","ことはない","はずがない","わけではない"],"note":"〜しかない: ~할 수밖에 없다.","qk":"( 4 )에 들어갈 것은 무엇인가?","ck":["~할 수밖에 없다","~할 필요는 없다","~일 리가 없다","~인 것은 아니다"]}]},{"type":"통합 이해","text":["Ａ","小学生にスマートフォンを持たせることには、私は賛成だ。共働きの家庭が増え、子どもが一人で過ごす時間は長くなっている。何かあったときにすぐ連絡が取れるのは、親にとっても子どもにとっても安心だ。もちろん、使いすぎの心配はある。しかし、それは時間を決めるなど、家庭でルールを作れば防げることだ。危ないからといって遠ざけるより、小さいうちから正しい使い方を教えるほうが、将来のためになると思う。","Ｂ","小学生のうちは、スマートフォンを持たせないほうがよいと考える。連絡のためなら、通話しかできない電話で十分だ。スマートフォンがあれば、どうしてもゲームや動画に時間を使ってしまう。家庭でルールを作っても、親が見ていないところで守れる子どもは多くないだろう。この時期は、友達と外で遊んだり本を読んだりして、自分で考える力を育てることのほうが大切だ。使い方を学ぶのは、中学生になってからでも遅くない。"],"ko":["A","초등학생에게 스마트폰을 들려 주는 것에 나는 찬성이다. 맞벌이 가정이 늘어 아이가 혼자 보내는 시간은 길어지고 있다. 무슨 일이 있을 때 바로 연락이 되는 것은 부모에게도 아이에게도 안심이 된다. 물론 지나치게 쓸 걱정은 있다. 하지만 그것은 시간을 정하는 등 가정에서 규칙을 만들면 막을 수 있는 일이다. 위험하다고 해서 멀리하기보다 어릴 때부터 올바른 사용법을 가르치는 편이 장래에 도움이 된다고 생각한다.","B","초등학생 때는 스마트폰을 들려 주지 않는 편이 좋다고 생각한다. 연락을 위해서라면 통화만 되는 전화로 충분하다. 스마트폰이 있으면 아무래도 게임이나 동영상에 시간을 쓰고 만다. 가정에서 규칙을 만들어도 부모가 보지 않는 곳에서 지킬 수 있는 아이는 많지 않을 것이다. 이 시기는 친구와 밖에서 놀거나 책을 읽거나 해서 스스로 생각하는 힘을 기르는 것이 더 중요하다. 사용법을 배우는 것은 중학생이 되고 나서도 늦지 않다."],"qs":[{"q":"ＡとＢのどちらも認めていることは何か。","c":["子どもがスマートフォンを使いすぎるおそれがあること","小学生にも連絡用のスマートフォンが必要であること","家庭のルールがあれば問題は起こらないこと","使い方は中学生になってから学べばよいこと"],"note":"A는 \"使いすぎの心配はある\", B는 \"ゲームや動画に時間を使ってしまう\". 둘 다 과다 사용 우려를 인정한다.","qk":"A와 B가 둘 다 인정하고 있는 것은 무엇인가?","ck":["아이가 스마트폰을 지나치게 쓸 우려가 있다는 것","초등학생에게도 연락용 스마트폰이 필요하다는 것","가정의 규칙이 있으면 문제는 일어나지 않는다는 것","사용법은 중학생이 되고 나서 배우면 된다는 것"]},{"q":"家庭で作るルールについて、ＡとＢはどう考えているか。","c":["Ａはルールで問題を防げると考え、Ｂは子どもが守るのは難しいと考えている","ＡもＢも、ルールを作れば十分だと考えている","Ａはルールは必要ないと考え、Ｂはルールが必要だと考えている","ＡもＢも、ルールを作っても意味がないと考えている"],"note":"A: \"ルールを作れば防げる\". B: \"守れる子どもは多くないだろう\".","qk":"가정에서 만드는 규칙에 대해 A와 B는 어떻게 생각하는가?","ck":["A는 규칙으로 문제를 막을 수 있다고 생각하고, B는 아이가 지키기는 어렵다고 생각한다","A도 B도 규칙을 만들면 충분하다고 생각한다","A는 규칙이 필요 없다고 생각하고, B는 규칙이 필요하다고 생각한다","A도 B도 규칙을 만들어도 의미가 없다고 생각한다"]}]},{"type":"주장 이해 (장문)","text":["店でジャムを売る実験の話を聞いたことがある。ある日は二十四種類、別の日は六種類のジャムを並べて、客の行動を比べたそうだ。立ち止まる客が多かったのは二十四種類の日だったが、実際に買った客の割合は、六種類の日のほうがはるかに高かったという。","選べるものが多いほどよいと、私たちは考えがちだ。しかし、選択肢が増えれば、それぞれを比べるのに時間も力もかかる。そのうえ、選んだあとで「ほかのものにすればよかったのではないか」という気持ちも残りやすい。結果として、選ぶこと自体をやめてしまう人が出てくるのである。","これは買い物だけの話ではない。進路や仕事を選ぶ場面でも、同じことが起こる。情報が簡単に手に入る今、私たちの前にはかつてないほど多くの道が並んでいる。それは確かに恵まれたことだが、同時に、どれも選べずに立ち止まってしまう原因にもなっている。","では、どうすればよいのか。私は、①「十分によいもの」を選んだら、それ以上探さないと決めることをすすめたい。いちばんよいものを探し続けるかぎり、迷いは終わらない。自分にとって大切な条件を二つか三つ決め、それを満たすものに出会ったら、そこで選ぶ。そして選んだあとは、ほかの道と比べるのをやめて、選んだ道をよいものにすることに力を使う。","選ぶ自由は大切だ。しかし、自由を生かすためには、選び方を知っておかなければならない。"],"ko":["가게에서 잼을 파는 실험 이야기를 들은 적이 있다. 어느 날은 24종류, 다른 날은 6종류의 잼을 늘어놓고 손님의 행동을 비교했다고 한다. 멈춰 서는 손님이 많았던 것은 24종류인 날이었지만, 실제로 산 손님의 비율은 6종류인 날이 훨씬 높았다고 한다.","고를 수 있는 것이 많을수록 좋다고 우리는 생각하기 쉽다. 하지만 선택지가 늘면 각각을 비교하는 데 시간도 힘도 든다. 게다가 고른 뒤에 \"다른 것으로 할 걸 그랬나\" 하는 마음도 남기 쉽다. 결과적으로 고르는 것 자체를 그만두어 버리는 사람이 나오는 것이다.","이것은 쇼핑만의 이야기가 아니다. 진로나 일을 고르는 장면에서도 같은 일이 일어난다. 정보를 쉽게 손에 넣을 수 있는 지금, 우리 앞에는 일찍이 없었을 만큼 많은 길이 늘어서 있다. 그것은 분명 혜택받은 일이지만, 동시에 어느 것도 고르지 못하고 멈춰 서 버리는 원인도 되고 있다.","그러면 어떻게 하면 좋을까. 나는 ① \"충분히 좋은 것\"을 골랐다면 그 이상 찾지 않기로 정하는 것을 권하고 싶다. 가장 좋은 것을 계속 찾는 한 망설임은 끝나지 않는다. 자신에게 중요한 조건을 두세 가지 정하고, 그것을 충족하는 것을 만나면 거기서 고른다. 그리고 고른 뒤에는 다른 길과 비교하기를 그만두고, 고른 길을 좋은 것으로 만드는 데 힘을 쓴다.","고를 자유는 소중하다. 하지만 자유를 살리기 위해서는 고르는 법을 알아 두어야 한다."],"qs":[{"q":"ジャムの実験から分かったことは何か。","c":["種類が多いと客は集まるが、買う人の割合は低くなる","種類が多いほど、買う人の割合が高くなる","種類が少ないと、立ち止まる客が増える","種類の数は、客の行動に関係がない"],"note":"멈춰 선 손님은 24종류 쪽이 많았지만 산 비율은 6종류 쪽이 높았다.","qk":"잼 실험에서 알게 된 것은 무엇인가?","ck":["종류가 많으면 손님은 모이지만 사는 사람의 비율은 낮아진다","종류가 많을수록 사는 사람의 비율이 높아진다","종류가 적으면 멈춰 서는 손님이 늘어난다","종류의 수는 손님의 행동과 관계가 없다"]},{"q":"①「十分によいもの」を選ぶとは、どうすることか。","c":["大切な条件を満たすものが見つかったら、そこで決める","時間をかけて、いちばんよいものを探し続ける","できるだけ多くの選択肢を集めてから比べる","条件を決めずに、最初に見たものを選ぶ"],"note":"\"大切な条件を二つか三つ決め、それを満たすものに出会ったら、そこで選ぶ\".","qk":"① '충분히 좋은 것'을 고른다는 것은 어떻게 하는 것인가?","ck":["중요한 조건을 충족하는 것을 찾으면 거기서 정한다","시간을 들여 가장 좋은 것을 계속 찾는다","가능한 한 많은 선택지를 모은 뒤에 비교한다","조건을 정하지 않고 처음 본 것을 고른다"]},{"q":"筆者の考えに合うものはどれか。","c":["選んだあとは比べるのをやめ、選んだ道をよくする努力をするべきだ","選択肢は少ないほうがよいので、情報を集めるべきではない","迷うのは悪いことなので、何も考えずに早く決めるべきだ","選ぶ自由があるかぎり、人は必ず幸せになれる"],"note":"넷째 단락 마지막 문장이 필자의 제안.","qk":"필자의 생각에 맞는 것은 무엇인가?","ck":["고른 뒤에는 비교하기를 그만두고, 고른 길을 좋게 만드는 노력을 해야 한다","선택지는 적은 편이 좋으니 정보를 모아서는 안 된다","망설이는 것은 나쁜 일이니 아무 생각 없이 빨리 정해야 한다","고를 자유가 있는 한 사람은 반드시 행복해질 수 있다"]}]},{"type":"정보 검색","text":["さくら市 市民講座（秋学期）のご案内","対象：さくら市に住んでいる方、または市内に通勤・通学している十八歳以上の方","申し込み：九月一日から九月十五日まで。市役所の窓口かホームページで受け付けます。電話での申し込みはできません。申し込みが定員を超えた場合は、抽選になります。","受講料：一つの講座につき三千円。六十五歳以上の方は半額です。教材費は別に必要です。","講座一覧","・書道入門　毎週火曜日　午前十時から十一時半　定員二十名　教材費千円","・パソコン基礎　毎週水曜日　午後七時から八時半　定員十五名　教材費なし","・英会話初級　毎週土曜日　午後二時から三時半　定員二十名　教材費千五百円","・料理教室　第二・第四日曜日　午前十時から正午　定員十二名　教材費三千円","注意：一人で申し込めるのは二講座までです。初回を無断で欠席した場合は、受講を取り消すことがあります。"],"ko":["사쿠라시 시민 강좌 (가을 학기) 안내","대상: 사쿠라시에 사는 분, 또는 시내로 통근·통학하는 18세 이상인 분","신청: 9월 1일부터 9월 15일까지. 시청 창구나 홈페이지에서 접수합니다. 전화 신청은 할 수 없습니다. 신청이 정원을 넘은 경우는 추첨이 됩니다.","수강료: 한 강좌당 3천 엔. 65세 이상인 분은 반값입니다. 교재비는 따로 필요합니다.","강좌 목록","· 서예 입문　매주 화요일　오전 10시부터 11시 반　정원 20명　교재비 천 엔","· 컴퓨터 기초　매주 수요일　오후 7시부터 8시 반　정원 15명　교재비 없음","· 영어 회화 초급　매주 토요일　오후 2시부터 3시 반　정원 20명　교재비 천5백 엔","· 요리 교실　둘째·넷째 일요일　오전 10시부터 정오　정원 12명　교재비 3천 엔","주의: 한 사람이 신청할 수 있는 것은 두 강좌까지입니다. 첫 회를 무단으로 결석한 경우는 수강을 취소하는 일이 있습니다."],"qs":[{"q":"平日の昼間は仕事がある会社員（四十歳）が、仕事を休まずに受けられる講座はいくつあるか。","c":["三つ","一つ","二つ","四つ"],"note":"평일 낮(화요일 오전)의 서예만 불가. 수요일 밤 컴퓨터, 토요일 영어 회화, 일요일 요리의 세 개.","qk":"평일 낮에는 일이 있는 회사원(40세)이 일을 쉬지 않고 들을 수 있는 강좌는 몇 개인가?","ck":["세 개","한 개","두 개","네 개"]},{"q":"七十歳の人が書道入門と料理教室の両方を受ける場合、全部でいくら払うか。","c":["七千円","三千円","六千円","一万円"],"note":"수강료 3천 엔의 반값 1,500엔 × 2 = 3천 엔. 교재비 천 엔 + 3천 엔 = 4천 엔. 합계 7천 엔.","qk":"70세인 사람이 서예 입문과 요리 교실을 둘 다 들을 경우, 모두 얼마를 내는가?","ck":["7천 엔","3천 엔","6천 엔","1만 엔"]}]},{"type":"내용 이해 (중문)","text":["「早く寝なさい」と言われて育った人は多いだろう。ところが最近の研究では、睡眠で大切なのは長さだけではないことが分かってきた。同じ七時間でも、毎日決まった時間に寝て起きる人と、日によって時間がばらばらな人とでは、昼間の集中力に大きな差が出るという。","人の体には、一日のリズムを作る時計のような仕組みがある。この時計は、朝の光を浴びることで毎日合わせ直されている。平日は早く起き、休みの日は昼まで寝ているという生活を続けると、①時計が合わなくなり、月曜日の朝に体が重く感じられる。これは、外国へ旅行したときに起こる時差の問題と同じ仕組みだそうだ。","だから、休みの日に長く寝て疲れを取ろうとするのは、かえって逆の結果になりかねない。足りない分は、昼に二十分ほど眠ることで補うほうがよいという。大切なのは、寝る時間より、起きる時間を毎日そろえることなのである。"],"ko":["\"빨리 자라\"는 말을 듣고 자란 사람은 많을 것이다. 그런데 최근 연구에서는 수면에서 중요한 것은 길이만이 아니라는 것을 알게 되었다. 같은 7시간이라도 매일 정해진 시간에 자고 일어나는 사람과 날에 따라 시간이 제각각인 사람은 낮의 집중력에 큰 차이가 난다고 한다.","사람의 몸에는 하루의 리듬을 만드는 시계 같은 구조가 있다. 이 시계는 아침 햇빛을 쬠으로써 매일 다시 맞춰지고 있다. 평일은 일찍 일어나고 쉬는 날은 낮까지 자는 생활을 계속하면 ① 시계가 맞지 않게 되어 월요일 아침에 몸이 무겁게 느껴진다. 이것은 외국으로 여행 갔을 때 일어나는 시차 문제와 같은 구조라고 한다.","그러므로 쉬는 날에 길게 자서 피로를 풀려고 하는 것은 오히려 반대 결과가 될 수 있다. 모자란 만큼은 낮에 20분 정도 자는 것으로 보충하는 편이 좋다고 한다. 중요한 것은 자는 시간보다 일어나는 시간을 매일 맞추는 것이다."],"qs":[{"q":"①「時計が合わなくなり」とあるが、その原因は何か。","c":["平日と休みの日で、起きる時間が大きく違うこと","毎日、睡眠時間が七時間より短いこと","朝の光を浴びすぎること","外国へ旅行に行くこと"],"note":"\"平日は早く起き、休みの日は昼まで寝ている\"가 원인. 시차는 비유일 뿐.","qk":"① '시계가 맞지 않게 되어'라고 했는데, 그 원인은 무엇인가?","ck":["평일과 쉬는 날의 일어나는 시간이 크게 다른 것","매일 수면 시간이 7시간보다 짧은 것","아침 햇빛을 너무 많이 쬐는 것","외국으로 여행을 가는 것"]},{"q":"筆者が最も言いたいことは何か。","c":["毎日同じ時間に起きることが、何より大切だ","休みの日は、できるだけ長く寝たほうがいい","睡眠時間は、七時間より長くするべきだ","昼に眠るのは、体によくない"],"note":"마지막 문장 \"起きる時間を毎日そろえること\".","qk":"필자가 가장 말하고 싶은 것은 무엇인가?","ck":["매일 같은 시간에 일어나는 것이 무엇보다 중요하다","쉬는 날은 가능한 한 길게 자는 편이 좋다","수면 시간은 7시간보다 길게 해야 한다","낮에 자는 것은 몸에 좋지 않다"]}]},{"type":"내용 이해 (단문)","text":["お客様各位","いつも当店をご利用いただき、ありがとうございます。","このたび、材料費の値上がりに伴い、来月一日より一部の商品の価格を変更させていただくことになりました。パンは一つあたり二十円、ケーキは五十円の値上げとなります。飲み物の価格は変わりません。","なお、今月中にお買い求めいただいた回数券は、来月以降もそのままお使いいただけます。","ご理解のほど、よろしくお願いいたします。"],"ko":["고객 여러분께","언제나 저희 가게를 이용해 주셔서 감사합니다.","이번에 재료비 인상에 따라 다음 달 1일부터 일부 상품의 가격을 변경하게 되었습니다. 빵은 한 개당 20엔, 케이크는 50엔 인상됩니다. 음료 가격은 변하지 않습니다.","또한 이달 중에 구입하신 회수권은 다음 달 이후에도 그대로 쓰실 수 있습니다.","양해해 주시기를 부탁드립니다."],"qs":[{"q":"このお知らせの内容と合うものはどれか。","c":["今月買った回数券は、来月も使うことができる","来月から、すべての商品が値上げされる","飲み物は五十円高くなる","回数券は今月中に使わなければならない"],"note":"\"なお\" 뒤가 회수권 안내. 음료 가격은 그대로이고 인상은 일부 상품뿐.","qk":"이 안내문의 내용과 맞는 것은 무엇인가?","ck":["이달에 산 회수권은 다음 달에도 쓸 수 있다","다음 달부터 모든 상품이 인상된다","음료는 50엔 비싸진다","회수권은 이달 중에 써야 한다"]}]},{"type":"내용 이해 (단문)","text":["初めて部下を持ったとき、私は何でも自分でやってしまう上司だった。部下に任せると時間がかかるし、間違いも多い。それなら自分でやったほうが早いと思っていたのだ。しかし一年たっても、部下はまったく成長していなかった。任せなければ、人は育たない。失敗を見守るのも上司の仕事だと気づいてからは、口を出したい気持ちを抑えるようにしている。"],"ko":["처음 부하 직원을 두었을 때 나는 뭐든지 스스로 해 버리는 상사였다. 부하에게 맡기면 시간이 걸리고 실수도 많다. 그럴 바에야 내가 하는 편이 빠르다고 생각했던 것이다. 하지만 1년이 지나도 부하는 전혀 성장하지 않았다. 맡기지 않으면 사람은 자라지 않는다. 실패를 지켜보는 것도 상사의 일이라는 것을 깨닫고 나서는 참견하고 싶은 마음을 누르도록 하고 있다."],"qs":[{"q":"筆者は今、どのようにしているか。","c":["部下に仕事を任せ、口を出さないようにしている","時間がかかる仕事は、自分でやるようにしている","部下が失敗しないように、細かく指示している","部下の間違いを、すぐに直すようにしている"],"note":"\"任せなければ、人は育たない\", \"口を出したい気持ちを抑える\".","qk":"필자는 지금 어떻게 하고 있는가?","ck":["부하에게 일을 맡기고 참견하지 않으려고 한다","시간이 걸리는 일은 스스로 하려고 한다","부하가 실패하지 않도록 세세하게 지시한다","부하의 실수를 바로 고치려고 한다"]}]}];
const LISTEN=[{"type":"과제 이해","intro":"会社で女の人と男の人が話しています。男の人はこのあとまず何をしますか。","q":"男の人はこのあとまず何をしますか。","lines":[["女","田中さん、あしたの説明会の準備、どこまで進んでる？"],["男","資料の印刷は終わりました。これから会場の机を並べに行こうと思っています。"],["女","あ、机は午後に業者の人がやってくれることになったから、大丈夫。それより、参加者の名前のカード、もう作った？"],["男","いえ、まだです。人数が確定してから作ろうと思って。"],["女","人数ならさっき決まったよ。リストをメールで送ったから、先にそれをお願い。受付の案内の紙はそのあとでいいから。"],["男","わかりました。すぐ取りかかります。"]],"ko":["다나카 씨, 내일 설명회 준비 어디까지 됐어?","자료 인쇄는 끝났습니다. 이제 회장 책상을 배치하러 가려고 합니다.","아, 책상은 오후에 업체 분이 해 주기로 했으니까 괜찮아. 그것보다 참가자 이름 카드는 벌써 만들었어?","아니요, 아직입니다. 인원이 확정되면 만들려고요.","인원이라면 아까 정해졌어. 명단을 메일로 보냈으니까 그것부터 부탁해. 접수 안내문은 그다음에 해도 되니까.","알겠습니다. 바로 시작하겠습니다."],"c":["名前のカードを作る","資料を印刷する","会場の机を並べる","受付の案内の紙を作る"],"note":"인쇄는 이미 끝났고, 책상은 업체가 한다. \"先にそれをお願い\"의 それ는 이름 카드. 안내문은 그 뒤.","ik":"회사에서 여자와 남자가 이야기하고 있습니다. 남자는 이다음에 먼저 무엇을 합니까?","qk":"남자는 이다음에 먼저 무엇을 합니까?","ck":["이름 카드를 만든다","자료를 인쇄한다","회장의 책상을 배치한다","접수 안내문을 만든다"]},{"type":"과제 이해","intro":"大学で男の学生と事務の人が話しています。男の学生はこのあと何をしなければなりませんか。","q":"男の学生はこのあと何をしなければなりませんか。","lines":[["男","すみません、奨学金の申し込みをしたいんですが。"],["女","はい。申込書はもう書きましたか。"],["男","はい、ここに。それから成績証明書も持ってきました。"],["女","ありがとうございます。ええと、あ、先生の推薦状がまだですね。"],["男","え、それも必要なんですか。"],["女","ええ。締め切りは来週の金曜日ですから、それまでに出してください。申込書と証明書は今日お預かりしますね。"],["男","わかりました。今日、先生にお願いしてみます。"]],"ko":["실례합니다, 장학금 신청을 하고 싶은데요.","네. 신청서는 이미 쓰셨나요?","네, 여기요. 그리고 성적 증명서도 가져왔습니다.","감사합니다. 음, 아, 교수님 추천서가 아직이네요.","어, 그것도 필요한가요?","네. 마감은 다음 주 금요일이니까 그때까지 내 주세요. 신청서와 증명서는 오늘 받아 둘게요.","알겠습니다. 오늘 교수님께 부탁드려 보겠습니다."],"c":["先生に推薦状を頼む","申込書を書き直す","成績証明書を取りに行く","来週もう一度すべての書類を出す"],"note":"신청서와 증명서는 오늘 접수됐다. 빠진 것은 추천서뿐.","ik":"대학에서 남학생과 사무 직원이 이야기하고 있습니다. 남학생은 이다음에 무엇을 해야 합니까?","qk":"남학생은 이다음에 무엇을 해야 합니까?","ck":["교수님께 추천서를 부탁한다","신청서를 다시 쓴다","성적 증명서를 받으러 간다","다음 주에 모든 서류를 다시 낸다"]},{"type":"포인트 이해","intro":"ラジオで女の人が話しています。女の人は、朝の散歩を続けられた一番の理由は何だと言っていますか。","q":"女の人は、朝の散歩を続けられた一番の理由は何だと言っていますか。","lines":[["女","私は半年前から毎朝30分、散歩をしています。始めたきっかけは健康のためだったんですが、正直、最初の一週間でやめたくなりました。朝は眠いし、寒いですからね。でも、同じ時間に歩いていると、毎朝すれ違う人ができるんです。犬を連れたおじいさんとか、走っている学生さんとか。あいさつをするうちに、今日もあの人たちに会えるかなと思うようになって。体重が減ったとか、よく眠れるようになったとか、いいことは他にもありますが、続けられたのは、やっぱりそれが一番大きいですね。"]],"ko":["저는 반년 전부터 매일 아침 30분 산책을 하고 있습니다. 시작한 계기는 건강 때문이었는데, 솔직히 첫 일주일 만에 그만두고 싶어졌어요. 아침은 졸리고 추우니까요. 그런데 같은 시간에 걷다 보면 매일 아침 마주치는 사람이 생깁니다. 개를 데리고 나온 할아버지라든가 달리고 있는 학생이라든가요. 인사를 나누다 보니 오늘도 그분들을 만날 수 있을까 하고 생각하게 됐어요. 체중이 줄었다거나 잠을 잘 자게 됐다거나 좋은 점은 그 밖에도 있지만, 계속할 수 있었던 건 역시 그게 가장 큽니다."],"c":["毎朝会う人たちとのあいさつが楽しみになったから","健康のために必要だと思ったから","体重が減ってうれしかったから","よく眠れるようになったから"],"note":"건강은 \"시작한 계기\"일 뿐이다. 마지막 문장의 それ는 마주치는 사람들과의 인사를 가리킨다.","ik":"라디오에서 여자가 이야기하고 있습니다. 여자는 아침 산책을 계속할 수 있었던 가장 큰 이유가 무엇이라고 말하고 있습니까?","qk":"여자는 아침 산책을 계속할 수 있었던 가장 큰 이유가 무엇이라고 말하고 있습니까?","ck":["매일 아침 만나는 사람들과의 인사가 기다려지게 되어서","건강을 위해 필요하다고 생각해서","체중이 줄어서 기뻤기 때문에","잠을 잘 자게 되어서"]},{"type":"포인트 이해","intro":"男の人と女の人が話しています。女の人はどうして引っ越すことにしましたか。","q":"女の人はどうして引っ越すことにしましたか。","lines":[["男","聞いたよ、引っ越すんだって？今の部屋、駅から近くて便利だったのに。"],["女","うん、便利は便利なんだけどね。"],["男","家賃が上がったとか？"],["女","ううん、家賃は変わらないよ。実は来月から在宅勤務が増えるんだ。今の部屋、机を置く場所もなくて。"],["男","ああ、それは困るね。"],["女","そうなの。新しいところは駅から少し遠くなるけど、部屋が一つ多いから、仕事用に使おうと思って。"]],"ko":["들었어, 이사한다며? 지금 방, 역에서 가까워서 편했잖아.","응, 편하긴 편한데 말이야.","월세가 올랐다든가?","아니, 월세는 그대로야. 실은 다음 달부터 재택근무가 늘거든. 지금 방은 책상 놓을 자리도 없어서.","아, 그건 곤란하겠네.","맞아. 새집은 역에서 조금 멀어지지만 방이 하나 더 있어서 업무용으로 쓰려고."],"c":["家で仕事をする場所が必要になったから","家賃が上がったから","今の部屋が駅から遠くて不便だから","会社の近くに住みたいから"],"note":"월세는 그대로이고 지금 방은 역에서 가깝다. 이유는 \"実は\" 뒤에 나온다.","ik":"남자와 여자가 이야기하고 있습니다. 여자는 왜 이사하기로 했습니까?","qk":"여자는 왜 이사하기로 했습니까?","ck":["집에서 일할 공간이 필요해져서","집세가 올라서","지금 방이 역에서 멀어 불편해서","회사 근처에 살고 싶어서"]},{"type":"개요 이해","intro":"テレビで男の人が話しています。","q":"男の人は何について話していますか。","lines":[["男","最近、買い物のときに自分の袋を持っていく人が増えました。それ自体はいいことです。ただ、気をつけたいのは、その袋を何回使うかです。丈夫な布の袋は、作るときに紙やビニールの袋より多くの資源を使います。ですから、数回使っただけで新しい袋に買い替えてしまうと、かえって環境に負担をかけることになるんです。大切なのは、気に入った袋を一つ決めて、長く使い続けることです。"]],"ko":["요즘 장을 볼 때 자기 가방을 가져가는 사람이 늘었습니다. 그 자체는 좋은 일입니다. 다만 주의하고 싶은 것은 그 가방을 몇 번 쓰느냐입니다. 튼튼한 천 가방은 만들 때 종이나 비닐봉지보다 많은 자원을 씁니다. 그래서 몇 번 쓰고 새 가방으로 바꿔 버리면 오히려 환경에 부담을 주게 됩니다. 중요한 것은 마음에 드는 가방을 하나 정해서 오래 계속 쓰는 것입니다."],"c":["買い物袋を長く使うことの大切さ","布の袋の作り方","買い物袋が有料になった理由","ビニール袋の便利さ"],"note":"개요 이해는 질문이 나중에 나온다. \"大切なのは\" 뒤가 결론.","ik":"텔레비전에서 남자가 이야기하고 있습니다.","qk":"남자는 무엇에 대해 이야기하고 있습니까?","ck":["장바구니를 오래 쓰는 것의 중요성","천 가방을 만드는 방법","장바구니가 유료가 된 이유","비닐봉지의 편리함"]},{"type":"즉시 응답","lines":[["女","すみません、この書類、今日中に目を通していただけますか。"]],"ko":["죄송한데 이 서류, 오늘 중으로 훑어봐 주실 수 있을까요?"],"resp":"男","c":["はい、午後には見ておきます。","ええ、目が疲れていますね。","いいえ、通してはいけません。"],"note":"目を通す는 \"훑어보다\". 부탁에 대한 수락이 자연스럽다. 정답: 네, 오후에는 봐 두겠습니다.","ck":["네, 오후에는 봐 두겠습니다.","네, 눈이 피곤하네요.","아니요, 지나가게 하면 안 됩니다."]},{"type":"즉시 응답","lines":[["男","昨日の飲み会、行けばよかったなあ。"]],"ko":["어제 회식, 갈 걸 그랬네."],"resp":"女","c":["楽しかったよ。次はぜひ来てね。","うん、来てくれてありがとう。","そう、行かないほうがいいよ。"],"note":"〜ばよかった는 하지 않은 일에 대한 후회. 남자는 가지 않았다. 정답: 재미있었어. 다음엔 꼭 와.","ck":["재미있었어. 다음에는 꼭 와.","응, 와 줘서 고마워.","그래, 안 가는 편이 좋아."]},{"type":"즉시 응답","lines":[["女","お客様、こちらの商品はただいま品切れとなっております。"]],"ko":["손님, 이 상품은 현재 품절입니다."],"resp":"男","c":["そうですか。いつごろ入りますか。","じゃあ、それを一つください。","切れているなら、直してください。"],"note":"品切れ는 \"품절\". 정답: 그래요? 언제쯤 들어오나요?","ck":["그렇습니까? 언제쯤 들어옵니까?","그럼 그걸 하나 주세요.","끊어졌다면 고쳐 주세요."]},{"type":"즉시 응답","lines":[["男","部長、会議の資料、お持ちしましょうか。"]],"ko":["부장님, 회의 자료 가져다 드릴까요?"],"resp":"女","c":["ああ、助かるよ。お願い。","うん、持ってきてあげるよ。","いや、まだ持っていないよ。"],"note":"お〜しましょうか는 자기가 해 주겠다는 제안. 정답: 아, 도움이 되겠네. 부탁해.","ck":["아, 도움이 되겠다. 부탁해.","응, 가져다줄게.","아니, 아직 안 갖고 있어."]},{"type":"과제 이해","intro":"病院の受付で、受付の人と男の人が話しています。男の人はこのあとまず何をしますか。","q":"男の人はこのあとまず何をしますか。","lines":[["女","こんにちは。今日はどうされましたか。"],["男","昨日からのどが痛くて。こちらは初めてなんですが。"],["女","では、まずこちらの用紙に住所とお名前をご記入ください。保険証はお持ちですか。"],["男","あ、車の中に置いてきてしまいました。"],["女","それでしたら、先に取ってきていただけますか。用紙はそのあとで結構です。熱は測りましたか。"],["男","家で測ったら37度5分でした。"],["女","わかりました。では、お戻りになったら、もう一度こちらで測りますね。"]],"ko":["안녕하세요. 오늘은 어디가 불편하세요?","어제부터 목이 아파서요. 여기는 처음인데요.","그럼 우선 이 용지에 주소와 성함을 적어 주세요. 보험증은 가지고 계신가요?","아, 차 안에 두고 왔네요.","그러시면 먼저 가져와 주시겠어요? 용지는 그다음에 쓰셔도 됩니다. 열은 재 보셨나요?","집에서 쟀더니 37도 5부였습니다.","알겠습니다. 그럼 돌아오시면 여기서 한 번 더 재겠습니다."],"c":["保険証を取りに行く","用紙に名前を書く","熱を測る","診察室に入る"],"note":"\"先に取ってきていただけますか\"가 핵심. 용지 작성과 체온 측정은 그 뒤다.","ik":"병원 접수처에서 접수 직원과 남자가 이야기하고 있습니다. 남자는 이다음에 먼저 무엇을 합니까?","qk":"남자는 이다음에 먼저 무엇을 합니까?","ck":["보험증을 가지러 간다","용지에 이름을 쓴다","열을 잰다","진찰실에 들어간다"]},{"type":"과제 이해","intro":"電話で女の人と店の人が話しています。女の人はこのあと何をしますか。","q":"女の人はこのあと何をしますか。","lines":[["女","もしもし、先週そちらで買った掃除機なんですが、動かなくなってしまって。"],["男","申し訳ございません。お買い上げのときのレシートはお手元にございますか。"],["女","はい、あります。"],["男","では、修理か交換になりますので、商品をお店までお持ちいただけますか。"],["女","それが、重くて運ぶのが大変で。"],["男","それでしたら、こちらから配送業者を伺わせます。ご都合のよい日をあとでメールでお知らせいただけますか。箱はこちらで用意いたします。"],["女","わかりました。すぐ送ります。"]],"ko":["여보세요, 지난주에 거기서 산 청소기 말인데요, 작동이 안 돼서요.","죄송합니다. 구매하실 때의 영수증은 가지고 계신가요?","네, 있어요.","그럼 수리나 교환을 해 드릴 테니 상품을 매장까지 가져와 주시겠어요?","그게, 무거워서 옮기기가 힘들어서요.","그러시면 저희 쪽에서 배송 업체를 보내겠습니다. 편하신 날짜를 나중에 메일로 알려 주시겠어요? 상자는 저희가 준비하겠습니다.","알겠습니다. 바로 보낼게요."],"c":["都合のよい日をメールで知らせる","掃除機を店に持っていく","箱を用意する","レシートを探す"],"note":"매장에 가져가는 안은 무거워서 취소됐고, 상자는 가게가 준비한다. 영수증은 이미 있다.","ik":"전화로 여자와 가게 직원이 이야기하고 있습니다. 여자는 이다음에 무엇을 합니까?","qk":"여자는 이다음에 무엇을 합니까?","ck":["편한 날짜를 메일로 알린다","청소기를 가게에 가져간다","상자를 준비한다","영수증을 찾는다"]},{"type":"포인트 이해","intro":"会社で男の人と女の人が話しています。男の人は、新しい企画がうまくいかなかった一番の原因は何だと言っていますか。","q":"男の人は、新しい企画がうまくいかなかった一番の原因は何だと言っていますか。","lines":[["女","この前の企画、残念でしたね。予算が足りなかったんですか。"],["男","いや、予算は十分だったんだ。"],["女","じゃあ、宣伝が遅れたとか。"],["男","宣伝も予定どおりだったよ。ただね、商品を使ってくれるお客さんの声を、作る前にちゃんと聞いていなかったんだ。こっちがいいと思った機能が、実は必要とされていなかった。"],["女","なるほど。"],["男","発売の時期も少し悪かったけど、それは小さなことだよ。"]],"ko":["지난번 기획, 아쉬웠네요. 예산이 부족했던 건가요?","아니, 예산은 충분했어.","그럼 홍보가 늦어졌다든가요?","홍보도 예정대로였어. 다만 말이지, 상품을 써 줄 고객의 목소리를 만들기 전에 제대로 듣지 않았던 거야. 우리가 좋다고 생각한 기능이 실은 필요하지 않았던 거지.","그렇군요.","발매 시기도 조금 안 좋았지만 그건 사소한 문제야."],"c":["客の意見を事前に聞かなかったこと","予算が足りなかったこと","宣伝が遅れたこと","発売の時期が悪かったこと"],"note":"예산과 홍보는 부정했고, 발매 시기는 \"小さなこと\"라고 했다. \"ただね\" 뒤가 핵심.","ik":"회사에서 남자와 여자가 이야기하고 있습니다. 남자는 새 기획이 잘되지 않은 가장 큰 원인이 무엇이라고 말하고 있습니까?","qk":"남자는 새 기획이 잘되지 않은 가장 큰 원인이 무엇이라고 말하고 있습니까?","ck":["고객의 의견을 미리 듣지 않은 것","예산이 부족했던 것","홍보가 늦어진 것","발매 시기가 나빴던 것"]},{"type":"포인트 이해","intro":"大学で女の学生と男の学生が話しています。女の学生はどうしてアルバイトをやめることにしましたか。","q":"女の学生はどうしてアルバイトをやめることにしましたか。","lines":[["男","カフェのバイト、やめるんだって？店長が厳しいって言ってたよね。"],["女","うん、でも店長はいい人だよ。厳しいのは仕事のことだけだし。"],["男","じゃあ、時給が安いから？"],["女","時給は悪くないよ。ただ、来月からゼミの発表の準備が始まるでしょう。夜遅くまで働いていたら、とても間に合わないと思って。"],["男","ああ、あのゼミは大変らしいね。"],["女","うん。発表が終わったら、また働かせてもらうつもり。"]],"ko":["카페 알바 그만둔다며? 점장이 엄하다고 했었지.","응, 그래도 점장님은 좋은 사람이야. 엄한 건 일에 관해서뿐이고.","그럼 시급이 낮아서?","시급은 나쁘지 않아. 다만 다음 달부터 세미나 발표 준비가 시작되잖아. 밤늦게까지 일하면 도저히 못 맞출 것 같아서.","아, 그 세미나는 힘들다고 하더라.","응. 발표가 끝나면 다시 일하게 해 달라고 할 생각이야."],"c":["ゼミの準備の時間が必要だから","店長が厳しいから","時給が安いから","ほかの店で働きたいから"],"note":"점장과 시급은 이유가 아니라고 했다. \"ただ\" 뒤가 진짜 이유.","ik":"대학에서 여학생과 남학생이 이야기하고 있습니다. 여학생은 왜 아르바이트를 그만두기로 했습니까?","qk":"여학생은 왜 아르바이트를 그만두기로 했습니까?","ck":["세미나 준비 시간이 필요해서","점장이 엄해서","시급이 낮아서","다른 가게에서 일하고 싶어서"]},{"type":"개요 이해","intro":"ラジオで女の人が話しています。","q":"女の人は何について話していますか。","lines":[["女","私は料理が得意ではありませんでした。本のとおりに作っても、なぜかおいしくならないんです。でも、あるとき気づきました。私は、作っている途中で一度も味を見ていなかったんです。それからは、途中で必ず味を確かめるようにしました。塩が足りなければ足し、濃ければ水を加える。それだけのことで、料理は見違えるほどおいしくなりました。特別な道具も高い材料も要りません。"]],"ko":["저는 요리를 잘하지 못했습니다. 책대로 만들어도 왠지 맛있어지지 않았어요. 그런데 어느 날 깨달았습니다. 저는 만드는 도중에 한 번도 맛을 보지 않았던 거예요. 그 뒤로는 도중에 반드시 맛을 확인하게 되었습니다. 소금이 부족하면 더 넣고, 진하면 물을 더합니다. 그것만으로 요리는 몰라보게 맛있어졌습니다. 특별한 도구도 비싼 재료도 필요 없습니다."],"c":["料理がうまくなったきっかけ","料理の本の選び方","高い材料を使う理由","塩を減らす健康法"],"note":"전체 흐름은 \"못했다 → 깨달았다 → 맛있어졌다\". 부분적인 단어에 끌리지 말 것.","ik":"라디오에서 여자가 이야기하고 있습니다.","qk":"여자는 무엇에 대해 이야기하고 있습니까?","ck":["요리를 잘하게 된 계기","요리책 고르는 법","비싼 재료를 쓰는 이유","소금을 줄이는 건강법"]},{"type":"개요 이해","intro":"見学会で男の人が話しています。","q":"男の人は主に何について話していますか。","lines":[["男","本日は見学会にお越しいただき、ありがとうございます。見学の前に、いくつかお願いがあります。工場内では、必ず帽子とマスクをお着けください。機械には手を触れないでください。また、写真は入り口の展示室に限り、撮っていただけます。作業場での撮影はご遠慮ください。それでは、係の者がご案内します。"]],"ko":["오늘 견학회에 와 주셔서 감사합니다. 견학에 앞서 몇 가지 부탁드릴 것이 있습니다. 공장 안에서는 반드시 모자와 마스크를 착용해 주십시오. 기계에는 손을 대지 말아 주십시오. 또한 사진은 입구의 전시실에 한해 찍으실 수 있습니다. 작업장에서의 촬영은 삼가 주십시오. 그럼 담당자가 안내하겠습니다."],"c":["工場を見学するときの注意","工場で作っている製品の説明","見学会の申し込み方法","展示室の場所"],"note":"\"いくつかお願いがあります\" 뒤로 주의 사항이 이어진다.","ik":"견학회에서 남자가 이야기하고 있습니다.","qk":"남자는 주로 무엇에 대해 이야기하고 있습니까?","ck":["공장을 견학할 때의 주의 사항","공장에서 만드는 제품의 설명","견학회 신청 방법","전시실의 위치"]},{"type":"즉시 응답","lines":[["男","この資料、コピーしておいてくれない？"]],"ko":["이 자료, 복사해 둬 줄래?"],"resp":"女","c":["はい、何部必要ですか。","いいえ、コピーしてくれません。","ええ、もうしておきませんでした。"],"note":"〜てくれない?는 부탁. 정답: 네, 몇 부 필요하세요?","ck":["네, 몇 부 필요합니까?","아니요, 복사해 주지 않습니다.","네, 이미 해 두지 않았습니다."]},{"type":"즉시 응답","lines":[["女","田中さん、今日は顔色が悪いですね。"]],"ko":["다나카 씨, 오늘 안색이 안 좋네요."],"resp":"男","c":["ええ、ちょっと寝不足で。","いいえ、色は塗っていません。","はい、顔を洗ってきます。"],"note":"顔色が悪い는 \"안색이 나쁘다\". 정답: 네, 좀 잠이 부족해서요.","ck":["네, 잠을 좀 못 자서요.","아니요, 색은 칠하지 않았습니다.","네, 세수하고 오겠습니다."]},{"type":"즉시 응답","lines":[["男","先日はごちそうさまでした。"]],"ko":["지난번에는 잘 먹었습니다."],"resp":"女","c":["いいえ、こちらこそ楽しかったです。","はい、いただきます。","ええ、どうぞ召し上がってください。"],"note":"대접받은 일에 대한 감사 인사. 정답: 아니에요, 저야말로 즐거웠어요.","ck":["아니요, 저야말로 즐거웠습니다.","네, 잘 먹겠습니다.","네, 어서 드세요."]},{"type":"즉시 응답","lines":[["女","あの映画、見に行くまでもなかったね。"]],"ko":["그 영화, 보러 갈 것까지도 없었네."],"resp":"男","c":["うん、期待していたほどじゃなかった。","うん、もう一度見に行こう。","そう、行けなくて残念だったね。"],"note":"〜までもない는 \"~할 필요도 없다\". 영화가 별로였다는 뜻. 정답: 응, 기대한 만큼은 아니었어.","ck":["응, 기대했던 만큼은 아니었어.","응, 한 번 더 보러 가자.","그래, 못 가서 아쉬웠겠다."]},{"type":"과제 이해","intro":"会社で男の人と女の人が話しています。女の人はこのあとまず何をしますか。","q":"女の人はこのあとまず何をしますか。","lines":[["男","鈴木さん、来週の出張の準備、進んでる？"],["女","はい。新幹線の切符はもう買いました。これからホテルを予約しようと思っているんですが。"],["男","あ、ホテルは向こうの支店が取ってくれるそうだから、いいよ。それより、先方に渡す資料、部長に見てもらった？"],["女","いえ、まだです。印刷してからお見せしようと思って。"],["男","印刷の前に見てもらったほうがいいよ。直しが入るかもしれないから。部長、午後は出かけるそうだから、今のうちに。"],["女","わかりました。すぐデータを持っていきます。"]],"ko":["스즈키 씨, 다음 주 출장 준비 잘되고 있어?","네. 신칸센 표는 이미 샀습니다. 이제 호텔을 예약하려고 하는데요.","아, 호텔은 그쪽 지점이 잡아 준다고 하니까 괜찮아. 그것보다 상대 쪽에 건넬 자료, 부장님께 보여 드렸어?","아니요, 아직입니다. 인쇄하고 나서 보여 드리려고요.","인쇄 전에 보여 드리는 편이 좋아. 수정이 들어갈지도 모르니까. 부장님, 오후에는 나가신다고 하니까 지금 해.","알겠습니다. 바로 데이터를 가져가겠습니다."],"c":["部長に資料を見てもらう","ホテルを予約する","資料を印刷する","新幹線の切符を買う"],"note":"표는 이미 샀고 호텔은 지점이 잡는다. 인쇄보다 먼저 부장님 확인. \"今のうちに\".","ik":"회사에서 남자와 여자가 이야기하고 있습니다. 여자는 이다음에 먼저 무엇을 합니까?","qk":"여자는 이다음에 먼저 무엇을 합니까?","ck":["부장님께 자료를 보여 드린다","호텔을 예약한다","자료를 인쇄한다","신칸센 표를 산다"]},{"type":"과제 이해","intro":"市役所で女の人と係の人が話しています。女の人はこのあと何を持ってこなければなりませんか。","q":"女の人はこのあと何を持ってこなければなりませんか。","lines":[["女","すみません、市民講座に申し込みたいんですが。"],["男","はい。申込書はお持ちですか。"],["女","はい、書いてきました。それと、受講料もここに。"],["男","ありがとうございます。ええと、市内にお住まいではないんですね。"],["女","ええ、隣の市なんですが、会社がこの近くで。"],["男","それでしたら、勤め先が分かるものが必要なんです。社員証などはお持ちですか。"],["女","あ、今日は持ってきていません。"],["男","では、申込書と受講料は今日お預かりしますので、十五日までにお持ちください。"]],"ko":["실례합니다, 시민 강좌에 신청하고 싶은데요.","네. 신청서는 갖고 계십니까?","네, 써 왔습니다. 그리고 수강료도 여기에.","감사합니다. 음, 시내에 사시는 건 아니네요.","네, 옆 시인데 회사가 이 근처라서요.","그렇다면 근무처를 알 수 있는 것이 필요합니다. 사원증 같은 것은 갖고 계십니까?","아, 오늘은 안 가져왔습니다.","그러면 신청서와 수강료는 오늘 받아 둘 테니 15일까지 가져와 주세요."],"c":["社員証","申込書","受講料","住所が分かるもの"],"note":"신청서와 수강료는 오늘 접수. 부족한 것은 근무처를 알 수 있는 것(사원증).","ik":"시청에서 여자와 담당 직원이 이야기하고 있습니다. 여자는 이다음에 무엇을 가져와야 합니까?","qk":"여자는 이다음에 무엇을 가져와야 합니까?","ck":["사원증","신청서","수강료","주소를 알 수 있는 것"]},{"type":"포인트 이해","intro":"男の人と女の人が話しています。男の人は、どうして料理を始めましたか。","q":"男の人は、どうして料理を始めましたか。","lines":[["女","最近、お弁当を作ってきてるんだって？　節約のため？"],["男","いや、お金のことはあまり考えてなくて。実はこの前の健康診断で、塩分を取りすぎだって言われちゃってね。"],["女","へえ、外食が多かったもんね。"],["男","そう。自分で作れば、味を薄くできるだろう。やってみたら意外とおもしろくて、今は休みの日も作ってるよ。"],["女","奥さんも喜んでるでしょう。"],["男","まあね。でもそれは結果であって、始めた理由じゃないんだ。"]],"ko":["요즘 도시락을 싸 온다면서? 절약 때문에?","아니, 돈은 별로 생각 안 했어. 실은 지난번 건강 검진에서 염분을 너무 많이 섭취한다는 말을 들어서 말이야.","아, 외식이 많았으니까.","응. 직접 만들면 간을 싱겁게 할 수 있잖아. 해 보니 의외로 재미있어서 지금은 쉬는 날에도 만들고 있어.","부인도 좋아하겠네.","뭐 그렇지. 하지만 그건 결과지 시작한 이유는 아니야."],"c":["健康のために塩分を減らしたかったから","お金を節約したかったから","料理がおもしろそうだと思ったから","妻を喜ばせたかったから"],"note":"절약은 부정, 재미는 해 본 뒤의 일, 아내는 \"결과\". 이유는 건강 검진에서 지적받은 염분.","ik":"남자와 여자가 이야기하고 있습니다. 남자는 왜 요리를 시작했습니까?","qk":"남자는 왜 요리를 시작했습니까?","ck":["건강을 위해 염분을 줄이고 싶어서","돈을 절약하고 싶어서","요리가 재미있을 것 같아서","아내를 기쁘게 하고 싶어서"]},{"type":"포인트 이해","intro":"大学で先生が学生に話しています。先生は、レポートでいちばん大切なことは何だと言っていますか。","q":"先生は、レポートでいちばん大切なことは何だと言っていますか。","lines":[["男","レポートについて、いくつか注意があります。まず長さですが、多少長くても短くてもかまいません。資料もたくさん集めるに越したことはありませんが、数が多ければいいというものではありません。"],["男","私がいちばん見たいのは、皆さん自身の意見です。本に書いてあることをまとめただけのレポートが毎年多いのですが、それでは高い点はつけられません。"],["男","字のきれいさや形式は、読みやすければ十分です。締め切りだけは必ず守ってください。"]],"ko":["리포트에 대해 몇 가지 주의가 있습니다. 우선 길이인데, 조금 길어도 짧아도 상관없습니다. 자료도 많이 모으는 것보다 좋은 것은 없지만, 수가 많으면 좋다는 것은 아닙니다.","제가 가장 보고 싶은 것은 여러분 자신의 의견입니다. 책에 쓰여 있는 것을 정리하기만 한 리포트가 매년 많은데, 그래서는 높은 점수를 줄 수 없습니다.","글씨의 깔끔함이나 형식은 읽기 쉬우면 충분합니다. 마감만은 반드시 지켜 주세요."],"c":["自分の意見が書かれていること","決められた長さで書くこと","資料をたくさん集めること","字をきれいに書くこと"],"note":"\"私がいちばん見たいのは、皆さん自身の意見です\".","ik":"대학에서 선생님이 학생에게 이야기하고 있습니다. 선생님은 리포트에서 가장 중요한 것이 무엇이라고 말하고 있습니까?","qk":"선생님은 리포트에서 가장 중요한 것이 무엇이라고 말하고 있습니까?","ck":["자신의 의견이 쓰여 있는 것","정해진 길이로 쓰는 것","자료를 많이 모으는 것","글씨를 깔끔하게 쓰는 것"]},{"type":"개요 이해","intro":"ラジオで男の人が話しています。","q":"男の人は何について話していますか。","lines":[["男","私は三年前に都会から小さな村へ引っ越しました。最初は、店が少なくて不便だろうと心配していました。確かに買い物には車が必要ですし、病院も遠いです。"],["男","でも、住んでみて分かったのは、不便だからこそ人と人が助け合うということです。野菜を分けてもらったり、雪の日に車を出してもらったり。都会にいたころは、隣の人の名前も知りませんでした。"],["男","便利さと引きかえに、私たちは何かをなくしていたのかもしれません。"]],"ko":["저는 3년 전에 도시에서 작은 마을로 이사했습니다. 처음에는 가게가 적어서 불편하리라고 걱정했습니다. 확실히 장을 보려면 차가 필요하고 병원도 멉니다.","하지만 살아 보고 알게 된 것은 불편하기 때문에 오히려 사람과 사람이 서로 돕는다는 것입니다. 채소를 나눠 받거나 눈 오는 날에 차를 내어 주거나. 도시에 있던 때는 옆집 사람의 이름도 몰랐습니다.","편리함과 맞바꿔 우리는 무언가를 잃고 있었는지도 모릅니다."],"c":["村の生活で気づいた、人とのつながりの大切さ","村で暮らすことの不便さ","都会で暮らすための方法","引っ越しの準備のしかた"],"note":"불편함은 인정하지만 요점은 \"不便だからこそ人と人が助け合う\".","ik":"라디오에서 남자가 이야기하고 있습니다.","qk":"남자는 무엇에 대해 이야기하고 있습니까?","ck":["마을 생활에서 깨달은, 사람과의 유대의 소중함","마을에서 사는 것의 불편함","도시에서 살기 위한 방법","이사 준비 방법"]},{"type":"개요 이해","intro":"テレビで女の人が話しています。","q":"女の人が伝えたいことは何ですか。","lines":[["女","外国語を勉強している方から、単語がなかなか覚えられないという相談をよく受けます。多くの方は、一度に長い時間をかけて覚えようとします。"],["女","でも、一日に二時間まとめて勉強するより、朝と昼と夜に十分ずつ見直すほうが、ずっとよく覚えられるんです。人は忘れかけたころにもう一度見ると、記憶が強くなるからです。"],["女","大切なのは時間の長さではなく、回数なんですね。"]],"ko":["외국어를 공부하는 분들에게서 단어가 좀처럼 외워지지 않는다는 상담을 자주 받습니다. 많은 분들은 한 번에 긴 시간을 들여 외우려고 합니다.","하지만 하루에 두 시간 몰아서 공부하는 것보다 아침과 낮과 밤에 10분씩 다시 보는 편이 훨씬 잘 외워집니다. 사람은 잊어버릴 즈음에 한 번 더 보면 기억이 강해지기 때문입니다.","중요한 것은 시간의 길이가 아니라 횟수인 것입니다."],"c":["単語は短い時間で何度も見直すほうがよい","単語は一度に長い時間をかけて覚えるべきだ","外国語の勉強は朝にするのがよい","単語を覚えるのは大人には難しい"],"note":"마지막 문장 \"大切なのは時間の長さではなく、回数\".","ik":"텔레비전에서 여자가 이야기하고 있습니다.","qk":"여자가 전하고 싶은 것은 무엇입니까?","ck":["단어는 짧은 시간에 여러 번 다시 보는 편이 좋다","단어는 한 번에 긴 시간을 들여 외워야 한다","외국어 공부는 아침에 하는 것이 좋다","단어를 외우는 것은 어른에게는 어렵다"]},{"type":"통합 이해","intro":"家族三人が、週末の予定について話しています。","q":"三人は日曜日にどうすることにしましたか。","lines":[["父","日曜日、みんなで山へ行かないか。紅葉がきれいなころだろう。"],["娘","えー、山は疲れるよ。私は映画が見たいな。新しいのが始まったばかりだし。"],["母","でも天気予報だと、日曜日は午後から雨だって。山は無理じゃない？"],["父","そうか。じゃあ、映画にするか。"],["母","映画なら土曜日の夜でも行けるでしょう。日曜日は午前中だけ晴れるんだから、近くの公園でお弁当を食べるのはどう？　紅葉も見られるし。"],["娘","それならいいよ。で、映画は土曜日ね。"],["父","わかった。じゃあ、そうしよう。"]],"ko":["일요일에 다 같이 산에 가지 않을래? 단풍이 예쁠 때잖아.","에이, 산은 피곤해. 나는 영화가 보고 싶어. 새 영화가 막 시작했고.","하지만 일기예보로는 일요일은 오후부터 비래. 산은 무리 아니야?","그래? 그럼 영화로 할까.","영화라면 토요일 밤에도 갈 수 있잖아. 일요일은 오전만 맑으니까 근처 공원에서 도시락을 먹는 건 어때? 단풍도 볼 수 있고.","그거라면 좋아. 그럼 영화는 토요일이네.","알았어. 그럼 그렇게 하자."],"c":["午前中に近くの公園へ行く","山へ紅葉を見に行く","映画を見に行く","家で過ごす"],"note":"산은 비 때문에 취소, 영화는 토요일로. 일요일은 오전에 근처 공원.","ik":"가족 세 명이 주말 예정에 대해 이야기하고 있습니다.","qk":"세 사람은 일요일에 어떻게 하기로 했습니까?","ck":["오전 중에 근처 공원에 간다","산에 단풍을 보러 간다","영화를 보러 간다","집에서 보낸다"]},{"type":"통합 이해","intro":"店で店員と夫婦が、掃除機について話しています。","q":"二人はどの掃除機を買うことにしましたか。","lines":[["店員","こちらのＡは、吸う力がいちばん強いモデルです。ただ、少し重くて、音も大きめです。Ｂは軽くて静かですが、吸う力はＡほどではありません。Ｃはコードのないタイプで使いやすいんですが、充電が三十分ほどしかもちません。"],["夫","うちは広くないから、三十分あれば足りるんじゃないか。コードがないのは便利だよ。"],["妻","でも、充電を忘れたら使えないでしょう。私は毎日使うから、軽いのがいいな。夜に掃除することも多いし。"],["夫","夜なら、音が小さいほうがいいか。吸う力はどう？"],["妻","うちはじゅうたんがないから、そんなに強くなくても大丈夫よ。"],["夫","じゃあ、君が使いやすいのにしよう。"]],"ko":["이쪽 A는 흡입력이 가장 강한 모델입니다. 다만 조금 무겁고 소리도 큰 편입니다. B는 가볍고 조용하지만 흡입력은 A만큼은 아닙니다. C는 코드가 없는 타입이라 쓰기 편하지만 충전이 30분 정도밖에 가지 않습니다.","우리 집은 넓지 않으니까 30분이면 충분하지 않을까. 코드가 없는 건 편리해.","하지만 충전을 잊으면 못 쓰잖아. 나는 매일 쓰니까 가벼운 게 좋아. 밤에 청소하는 일도 많고.","밤이라면 소리가 작은 편이 좋겠네. 흡입력은 어때?","우리 집은 카펫이 없으니까 그렇게 강하지 않아도 괜찮아.","그럼 당신이 쓰기 편한 걸로 하자."],"c":["軽くて静かなＢ","吸う力が強いＡ","コードのないＣ","もう少し考えてから決める"],"note":"아내의 조건은 가벼움과 조용함. 흡입력은 강하지 않아도 된다. 남편도 동의.","ik":"가게에서 점원과 부부가 청소기에 대해 이야기하고 있습니다.","qk":"두 사람은 어느 청소기를 사기로 했습니까?","ck":["가볍고 조용한 B","흡입력이 강한 A","코드가 없는 C","좀 더 생각한 뒤에 정한다"]},{"type":"즉시 응답","lines":[["男","この書類、今日中に出さないといけないんだっけ。"]],"ko":["이 서류, 오늘 중으로 내야 하는 거였나?"],"c":["いえ、明日の午前中でも大丈夫ですよ。","はい、昨日出しておきました。","ええ、出さないことにしました。"],"note":"〜っけ는 확인. 기한을 알려 주는 대답이 맞다.","ck":["아니요, 내일 오전 중이라도 괜찮아요.","네, 어제 내 두었습니다.","네, 내지 않기로 했습니다."]},{"type":"즉시 응답","lines":[["女","せっかく来てくれたのに、何もおかまいできなくて。"]],"ko":["모처럼 와 주셨는데 아무 대접도 못 해 드려서."],"c":["いえいえ、こちらこそ急にお邪魔してすみません。","ええ、もう来ないことにします。","はい、かまわないでください。"],"note":"손님을 배웅할 때의 겸손한 인사. 손님 쪽도 겸손하게 답한다.","ck":["아니에요, 저야말로 갑자기 찾아와서 죄송합니다.","네, 이제 오지 않기로 하겠습니다.","네, 신경 쓰지 마세요."]},{"type":"즉시 응답","lines":[["男","あの二人、また言い合いしてるよ。仲が悪いわけじゃないのにね。"]],"ko":["저 두 사람, 또 말다툼하고 있어. 사이가 나쁜 것도 아닌데."],"c":["そうね。お互い、言いたいことを言えるからじゃない？","ええ、仲直りできてよかったね。","うん、初めて会ったらしいよ。"],"note":"〜わけじゃないのに: ~인 것도 아닌데. 그 이유를 추측하는 대답이 자연스럽다.","ck":["그러게. 서로 하고 싶은 말을 할 수 있어서 그런 거 아닐까?","응, 화해해서 다행이네.","응, 처음 만났대."]},{"type":"즉시 응답","lines":[["女","部長、お忙しいところ恐縮ですが、少しお時間をいただけますか。"]],"ko":["부장님, 바쁘신 중에 죄송하지만 잠시 시간을 내주실 수 있습니까?"],"c":["ああ、いいよ。どうしたの？","いや、忙しくないところだよ。","うん、時間をいただくよ。"],"note":"시간을 내 달라는 부탁. 수락하고 용건을 묻는다.","ck":["아, 좋아. 무슨 일이야?","아니, 바쁘지 않은 참이야.","응, 시간을 받을게."]},{"type":"즉시 응답","lines":[["男","今日の会議、思ったより早く終わってよかったね。"]],"ko":["오늘 회의, 생각보다 일찍 끝나서 다행이네."],"c":["ええ、長引くかと思っていました。","はい、早く始めましょう。","いいえ、まだ始まっていません。"],"note":"\"思ったより早く終わった\"에 공감하는 대답. 長引く: 길어지다.","ck":["네, 길어질 줄 알았습니다.","네, 빨리 시작합시다.","아니요, 아직 시작하지 않았습니다."]},{"type":"즉시 응답","lines":[["女","このパソコン、買ったばかりなのに、もう調子が悪くて。"]],"ko":["이 컴퓨터, 산 지 얼마 안 됐는데 벌써 상태가 안 좋아서."],"c":["それなら、店に持っていって見てもらったら？","へえ、調子がよくてよかったね。","そう、ずいぶん長く使ったんだね。"],"note":"〜たばかりなのに: ~한 지 얼마 안 됐는데. 해결책을 권하는 대답.","ck":["그러면 가게에 가져가서 봐 달라고 하는 게 어때?","와, 상태가 좋아서 다행이네.","그래, 꽤 오래 썼구나."]}];

const DAK={'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご','さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ','た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど','は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ'};
const UND=Object.fromEntries(Object.entries(DAK).map(([a,b])=>[b,a]));
const OU='おこそとのほもよろごぞどぼょうくすつぬふむゆるぐずぶゅ';
function mutate(r){const out=new Set();
  for(let i=0;i<r.length;i++){const c=r[i];
    if(c==='う'&&i>0&&OU.includes(r[i-1]))out.add(r.slice(0,i)+r.slice(i+1));
    if(OU.includes(c)&&c!=='う'&&r[i+1]!=='う')out.add(r.slice(0,i+1)+'う'+r.slice(i+1));
    if(DAK[c]&&c!=='ち'&&c!=='つ')out.add(r.slice(0,i)+DAK[c]+r.slice(i+1));
    if(UND[c]&&c!=='ぢ'&&c!=='づ')out.add(r.slice(0,i)+UND[c]+r.slice(i+1));
    if(c==='っ')out.add(r.slice(0,i)+r.slice(i+1));
    if(c==='つ'&&i>0&&i<r.length-1)out.add(r.slice(0,i)+'っ'+r.slice(i+1))}
  out.delete(r);return [...out]}
const YIDX=W.map((w,i)=>i).filter(i=>allKanji(W[i][0])&&yomi(W[i]).length>=3&&mutate(yomi(W[i])).length>=3);

const nrm=t=>t.replace(/(する|な|に|の|した|だ)$/,'');
const grp=w=>new Set([w,...(SA[w]?[...SA[w][0],...SA[w][1]]:[])].map(nrm));
const SIDX=W.map((w,i)=>i).filter(i=>SA[W[i][0]]&&SA[W[i][0]][0].length);
const AIDX=W.map((w,i)=>i).filter(i=>SA[W[i][0]]&&SA[W[i][0]][1].length);
// 품사 추정: 형용사 분류이거나 しい·ない로 끝나면 형용사 / 한자가 있고 う단으로 끝나면 동사 / 히라가나뿐이거나 に로 끝나면 부사 / 나머지는 명사
const pos=w=>(w[5]==='형용사'||/(しい|ない)$/.test(w[0]))?'adj':(/[一-龥]/.test(w[0])&&/[うくぐすつぬぶむる]$/.test(w[0])?'verb':((/^[ぁ-ん]+$/.test(w[0])||/[一-龥]に$/.test(w[0]))?'adv':'noun'));
function saOpts(i,k){const w=W[i][0],g=grp(w),ans=SA[w][k][0],out=[],p=pos(W[i]);
  const cand=shuffle(k===0?SIDX:AIDX);cand.sort((x,y)=>(pos(W[x])===p?0:1)-(pos(W[y])===p?0:1));
  for(const j of cand){if(out.length===3)break;if(j===i)continue;
    const v=W[j][0],c=SA[v][k][0],gv=grp(v);
    if([...gv].some(x=>g.has(x))||g.has(nrm(c))||out.includes(c)||c===ans||similar(W[j][2],W[i][2]))continue;
    out.push(c)}
  return shuffle([ans,...out])}
