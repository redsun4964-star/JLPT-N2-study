<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N2 학습 노트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
/* Layout: single study column. Stats strip under the header, six tabs, one item or one list per tab. */
:root{
  --paper:#f6f8f5; --sheet:#ffffff; --ink:#17231f; --mute:#5d6b66; --line:#d3dcd7;
  --mark:#0f6b5c; --mark-soft:#dcefe9; --ok:#1c7a43; --ok-soft:#dff3e6; --bad:#b3372c; --bad-soft:#fbe4e0; --star:#b8860b;
  --sans:"Noto Sans KR","Noto Sans JP",system-ui,sans-serif;
  --jp:"Noto Sans JP","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121816; --sheet:#1a2320; --ink:#e6eeea; --mute:#93a39d; --line:#2e3b36;
  --mark:#5fd0b8; --mark-soft:#1d3a34; --ok:#62cf8c; --ok-soft:#1a3626; --bad:#f08a7c; --bad-soft:#40211d; --star:#e6b84a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121816; --sheet:#1a2320; --ink:#e6eeea; --mute:#93a39d; --line:#2e3b36;
  --mark:#5fd0b8; --mark-soft:#1d3a34; --ok:#62cf8c; --ok-soft:#1a3626; --bad:#f08a7c; --bad-soft:#40211d; --star:#e6b84a; color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--paper)}
:root:fullscreen{background:var(--paper);overflow-y:auto}
@media (min-width:1100px){:root:fullscreen .wrap{zoom:1.3}}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:8px}
h1{font-size:22px;margin:0;font-weight:700}
h2{font-size:15px;margin:6px 0 0}
.sub{color:var(--mute);font-size:13px;margin:0}
rt{font-size:.5em;color:var(--mute);font-weight:400}
body.nofuri rt{display:none}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px 14px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.st b{display:block;font:600 17px var(--mono);font-variant-numeric:tabular-nums}
.st span{font-size:11px;color:var(--mute);letter-spacing:.03em}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.top{position:sticky;top:0;z-index:6;background:var(--paper);display:flex;flex-direction:column;gap:8px;padding-top:6px}
.qbox,.wr,h2{scroll-margin-top:calc(var(--top,60px) + 8px)}
body.focus .top{display:none}
@media (max-width:560px){.stats{grid-template-columns:repeat(3,1fr);padding:6px 10px;gap:2px 10px}.st b{font-size:14px}.st span{font-size:10px}}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px;cursor:pointer;color:var(--mute);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--mark)}
.pane{display:flex;flex-direction:column;gap:14px}
/* 글자 크기는 내용에만 적용한다: 카드, 문제, 지문, 목록 */
.fc,.qbox,.wl,.li,.done{zoom:var(--z,1)}
body.focus header,body.focus .stats,body.focus .tabs,body.focus footer{display:none}
body.focus .wrap{padding-block:10px 80px}
.dock{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;z-index:10;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:6px 8px}
.toc{display:flex;flex-wrap:wrap;gap:6px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px}
.toc .th{width:100%;font-size:12px;color:var(--mute);letter-spacing:.04em}
.jump{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search.num{width:120px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips.bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chips.bar .chip{white-space:nowrap;flex:none}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:var(--sheet)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--mark)}
.star{background:none;border:0;cursor:pointer;font-size:20px;line-height:1;color:var(--line);padding:2px 4px}
.star.on{color:var(--star)}
.fc{background:var(--sheet);border:1px solid var(--line);border-radius:14px;min-height:240px;padding:24px 20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;width:100%}
.fc .hw{font:700 38px/1.3 var(--jp)}
.fc .rd+.hw{margin-top:-6px}
.fc .rd{font:400 17px var(--jp);color:var(--mute)}
.fc .ko{font-weight:700;font-size:18px;color:var(--mark)}
.fc .ex{font:400 19px/2.1 var(--jp);margin-top:6px}
.fc .exk{font-size:14px;color:var(--mute)}
.fc .hint{font-size:12px;color:var(--mute)}
.sa{font:400 15px/2 var(--jp);color:var(--mute);display:block}
.exq{font:400 17px/2.1 var(--jp)}
.fcrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,34%);gap:14px;width:100%;align-items:start;text-align:center}
.fcrow:not(:has(.sap)){grid-template-columns:1fr}
.fcmain{display:flex;flex-direction:column;gap:6px;min-width:0}
.sap{display:flex;flex-direction:column;gap:10px;text-align:left;border-left:1px solid var(--line);padding-left:12px;min-width:0}
.sag{display:flex;flex-direction:column;gap:4px}
.sah{font:700 11px var(--sans);letter-spacing:.06em;color:var(--mark)}
.sah.ant{color:var(--bad)}
.sai{display:flex;flex-direction:column}
.saw{font:500 16px/2 var(--jp)}
.sam{font:400 13px/1.4 var(--sans);color:var(--mute)}
.wr .e .fcrow{text-align:left}
.flowcard{cursor:default;min-height:300px}
.fc .ex.big{font-size:21px;font-weight:500}
.optlabel{align-self:center}
.tag{font-size:11px;color:var(--mute);letter-spacing:.04em}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:10px 14px;cursor:pointer;min-width:120px}
.btn.pri{background:var(--mark);border-color:var(--mark);color:var(--sheet);font-weight:700}
.btn.no{border-color:var(--bad);color:var(--bad)}
.btn.yes{border-color:var(--ok);color:var(--ok)}
.btn.sm{flex:none;min-width:0;padding:4px 10px;font-size:13px}
.qbox{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.qs{font:500 19px/2.1 var(--jp)}
.qs.sm{font-size:16px}
.qs u{text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--mark)}
.inst{font-size:13px;color:var(--mute)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.one{grid-template-columns:1fr}
.opt{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;cursor:pointer;font:400 16px/1.9 var(--jp);text-align:left;min-width:0;overflow-wrap:anywhere}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.fb b.ok{color:var(--ok)} .fb b.bad{color:var(--bad)}
.fb .tr{font-size:14px;color:var(--mute)}
.done{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px}
.done .big{font:600 28px var(--mono)}
.passage{font:400 16px/2.1 var(--jp);border-left:3px solid var(--line);padding-left:12px}
.passage p,.trans p,.script p{margin:0 0 8px}
.trans{font-size:14px;color:var(--mute)}
.ko{display:block;font:400 13.5px/1.5 var(--sans);color:var(--mute);margin:0 0 6px}
.opt .ko{margin:2px 0 0}
.passage .sen{display:block}
.tr-btn{align-self:flex-start}
.subq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.script{font:400 15px/2.1 var(--jp);background:var(--paper);border-radius:8px;padding:10px 12px}
.script .nar{color:var(--mute)}
.script .tr{font-family:var(--sans);font-size:13px;color:var(--mute);line-height:1.5}
.search{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--sheet);padding:9px 12px}
.wl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--sheet);overflow:hidden}
.wr{display:grid;grid-template-columns:34px 34px minmax(0,1.1fr) minmax(0,1.4fr);gap:4px 10px;align-items:baseline;padding:8px 10px;border-top:1px solid var(--line)}
.wr:first-child{border-top:0}
.wr .w{font:700 17px var(--jp);cursor:pointer}
.wr .w small{display:block;font:400 12px var(--jp);color:var(--mute)}
.wr .m{font-size:14px}
.wr .no{font:400 12px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums;text-align:right}
.wr .e{grid-column:3 / -1;font:400 17px/2.1 var(--jp)}
.wr .e .etr{display:block;font-family:var(--sans);font-size:14px;color:var(--mute);line-height:1.5}
.li{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.li .qs{font-size:16px}
.li .a{font-family:var(--jp)} .li .a b{color:var(--ok)}
.li .n{font-size:13px;color:var(--mute)}
.li .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
footer{border-top:1px solid var(--line);padding-top:12px}
@media (max-width:560px){.fcrow{grid-template-columns:1fr}.sap{border-left:0;border-top:1px solid var(--line);padding:10px 0 0}.sag{flex-direction:row;flex-wrap:wrap;gap:2px 16px;align-items:flex-start}.sah{min-width:44px;padding-top:9px}}
@media (max-width:460px){.opts{grid-template-columns:1fr}.fc .hw{font-size:32px}.wr{grid-template-columns:28px 28px 1fr}.wr .m{grid-column:3}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>N2 학습 노트</h1>
    <p class="sub">N2 어휘·형용사·문법 카드와 퀴즈, 독해, 청해 대본 읽기 연습입니다. 예문·문제·지문은 모두 새로 쓴 것입니다.</p>


  </header>
  <div class="top" id="top">
    <div class="chips bar">
      <button class="chip" id="furi" aria-pressed="true">후리가나</button>
      <button class="chip" id="theme">야간 모드</button>
      <button class="chip" id="fs">전체화면</button>
      <button class="chip" id="zdn" aria-label="글자 작게">글자 −</button>
      <button class="chip" id="zup" aria-label="글자 크게">글자 +</button>
      <button class="chip" id="hide">메뉴 숨기기</button>
    </div>
  <div class="stats" id="stats"></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="cards" aria-selected="true">플래시카드</button>
    <button class="tab" role="tab" data-t="quiz" aria-selected="false">퀴즈</button>
    <button class="tab" role="tab" data-t="flow" aria-selected="false">통독</button>
    <button class="tab" role="tab" data-t="read" aria-selected="false">독해</button>
    <button class="tab" role="tab" data-t="script" aria-selected="false">청해 대본</button>
    <button class="tab" role="tab" data-t="book" aria-selected="false">단어장</button>
    <button class="tab" role="tab" data-t="review" aria-selected="false">오답·북마크</button>
  </div>
  </div>
  <div id="cards" class="pane"></div>
  <div id="quiz" class="pane" hidden></div>
  <div id="flow" class="pane" hidden></div>
  <div id="read" class="pane" hidden></div>
  <div id="script" class="pane" hidden></div>
  <div id="book" class="pane" hidden></div>
  <div id="review" class="pane" hidden></div>
  <div class="dock" id="dock" hidden>
    <button class="chip" id="show">메뉴 보기</button>
    <button class="chip" id="zdn2" aria-label="글자 작게">글자 −</button>
    <button class="chip" id="zup2" aria-label="글자 크게">글자 +</button>
  </div>
  <footer class="sub">© 2026 Tae · 예문과 문제는 직접 작성한 것입니다. 무단 복제·재배포를 금합니다.</footer>
</div>

<script>

な형용사","왕성하다, 번성하다","この町では、祭りをきっかけに観光が盛んになった。","이 마을에서는 축제를 계기로 관광이 활발해졌다.","형용사"],["寂しい","さびしい · い형용사","외롭다, 쓸쓸하다","一人暮らしを始めたばかりで、寂しくてしょうがない。","혼자 살기 시작한 지 얼마 안 돼서 외로워 견딜 수 없다.","형용사"],["様々","さまざま · な형용사","가지각색이다, 다양하다","国によって、習慣は様々だ。","나라에 따라 습관은 다양하다.","형용사"],["新鮮","しんせん · な형용사","신선하다","海に近いだけに、魚が新鮮だ。","바다에 가까운 만큼 생선이 신선하다.","형용사"],["素直","すなお · な형용사","순순하다, 솔직하다","子どもは大きくなるにつれて、素直でなくなる。","아이는 커 감에 따라 순순하지 않게 된다.","형용사"],["鋭い","するどい · い형용사","날카롭다, 예리하다","さすが記者だけあって、質問が鋭い。","과연 기자답게 질문이 날카롭다.","형용사"],["退屈","たいくつ · な형용사","지루하다, 따분하다","退屈なあまり、会議中に寝てしまった。","너무 지루한 나머지 회의 중에 자 버렸다.","형용사"],["確実","かくじつ · な형용사","확실하다, 틀림없다","確実とは言えないまでも、成功する可能性は高い。","확실하다고는 못해도 성공할 가능성은 높다.","형용사"],["頼もしい","たのもしい · い형용사","믿음직하다","彼は若いながら、頼もしいリーダーだ。","그는 젊지만 믿음직한 리더다.","형용사"],["大胆","だいたん · な형용사","대담하다","彼女は新人にしては、大胆な意見を言う。","그녀는 신입치고는 대담한 의견을 말한다.","형용사"],["地味","じみ · な형용사","수수하다, 소박하다","地味な服ばかり着ているわけではない。","수수한 옷만 입는 것은 아니다.","형용사"],["当然","とうぜん · な형용사","당연하다, 마땅하다","約束を破ったのだから、怒られて当然だ。","약속을 어겼으니 혼나는 게 당연하다.","형용사"],["特有","とくゆう · な형용사","특유하다, 고유하다","この地方特有の料理を食べてみたいものだ。","이 지방 특유의 요리를 먹어 보고 싶다.","형용사"],["のどか","な형용사","한가롭다, 평화롭다","都会に比べて、村の暮らしはのどかだ。","도시에 비해 마을 생활은 한가롭다.","형용사"],["熱心","ねっしん · な형용사","열심이다, 열중하다","熱心に勉強したかいがあって、試験に受かった。","열심히 공부한 보람이 있어 시험에 붙었다.","형용사"],["派手","はで · な형용사","화려하다, 요란하다","式に出るからには、派手すぎる服は避けたい。","식에 참석하는 이상 너무 화려한 옷은 피하고 싶다.","형용사"],["不潔","ふけつ · な형용사","불결하다, 더럽다","不潔な手で食べると、病気になりかねない。","불결한 손으로 먹으면 병에 걸릴 수 있다.","형용사"],["不利","ふり · な형용사","불리하다","条件が不利だとしても、挑戦してみたい。","조건이 불리하다고 해도 도전해 보고 싶다.","형용사"],["複雑","ふくざつ · な형용사","복잡하다","手続きが複雑すぎて、一人ではやりようがない。","절차가 너무 복잡해서 혼자서는 할 방도가 없다.","형용사"],["平凡","へいぼん · な형용사","평범하다","平凡ながらも、幸せな毎日だ。","평범하지만 행복한 나날이다.","형용사"],["真っ赤","まっか · な형용사","새빨갛다","恥ずかしさのあまり、顔が真っ赤になった。","부끄러운 나머지 얼굴이 새빨개졌다.","형용사"],["満足","まんぞく · な형용사","만족스럽다","結果はともかく、自分の努力には満足している。","결과는 어쨌든 자신의 노력에는 만족한다.","형용사"],["無理","むり · な형용사","무리이다, 불가능하다","無理をしたあげく、体をこわしてしまった。","무리한 끝에 몸을 망치고 말았다.","형용사"],["有利","ゆうり · な형용사","유리하다","経験がある人ほど、就職に有利だ。","경험이 있는 사람일수록 취업에 유리하다.","형용사"],["豊か","ゆたか · な형용사","풍요롭다, 풍부하다","経済が豊かになるにしたがって、ごみも増えた。","경제가 풍요로워짐에 따라 쓰레기도 늘었다.","형용사"],["楽","らく · な형용사","편안하다, 수월하다","楽な仕事などあるわけがない。","편한 일 같은 게 있을 리가 없다.","형용사"],["適当","てきとう · な형용사","적당하다, 적절하다, 대충이다","忙しいからといって、適当に答えてはいけない。","바쁘다고 해서 대충 대답해서는 안 된다.","형용사"],["冷淡","れいたん · な형용사","냉담하다","彼の態度が冷淡だったばかりに、客を失った。","그의 태도가 냉담했던 탓에 손님을 잃었다.","형용사"],["曖昧","あいまい · な형용사","애매하다, 모호하다","曖昧な返事をしたせいで、誤解されてしまった。","애매한 대답을 한 탓에 오해를 사고 말았다.","형용사"],["安全","あんぜん · な형용사","안전하다","安全が確認されないかぎり、工事は始められない。","안전이 확인되지 않는 한 공사는 시작할 수 없다.","형용사"],["意外","いがい · な형용사","의외이다","意外なことに、試験は思ったより易しかった。","의외로 시험은 생각보다 쉬웠다.","형용사"],["偉大","いだい · な형용사","위대하다","彼は作家としてだけでなく、教師としても偉大だった。","그는 작가로서뿐 아니라 교사로서도 위대했다.","형용사"],["一生懸命","いっしょうけんめい · な형용사","매우 열심이다","一生懸命やったところで、間に合いそうもない。","열심히 해 봤자 시간에 맞출 수 없을 것 같다.","형용사"],["一般的","いっぱんてき · な형용사","일반적이다","国によっては、チップを払うのが一般的だ。","나라에 따라서는 팁을 내는 것이 일반적이다.","형용사"],["華やか","はなやか · な형용사","화려하다, 찬란하다","式は華やかな雰囲気のうちに終わった。","식은 화려한 분위기 속에 끝났다.","형용사"],["科学的","かがくてき · な형용사","과학적이다","科学的な証拠に基づいて判断する。","과학적인 증거에 근거해 판단한다.","형용사"],["活発","かっぱつ · な형용사","활발하다","子どもは活発なものだ。","아이는 활발한 법이다.","형용사"],["完璧","かんぺき · な형용사","완벽하다","完璧を求めるあまり、何も始められない。","완벽을 추구한 나머지 아무것도 시작하지 못한다.","형용사"],["気楽","きらく · な형용사","마음 편하다","一人旅は気楽な反面、寂しいこともある。","혼자 하는 여행은 마음 편한 반면 외로울 때도 있다.","형용사"],["厳重","げんじゅう · な형용사","엄중하다, 철저하다","大会は厳重な警備のもとで開かれた。","대회는 엄중한 경비 아래 열렸다.","형용사"],["幸福","こうふく · な형용사","행복하다","お金があるからといって、幸福とは限らない。","돈이 있다고 해서 행복하다고는 할 수 없다.","형용사"],["最高","さいこう · な형용사","최고이다","仕事のあとのビールは最高としか言いようがない。","일 끝나고 마시는 맥주는 최고라고밖에 말할 수 없다.","형용사"],["最悪","さいあく · な형용사","최악이다","最悪の場合に備えて、準備しておくべきだ。","최악의 경우에 대비해 준비해 둬야 한다.","형용사"],["残念","ざんねん · な형용사","유감이다, 아쉽다","残念ながら、今回は参加できません。","유감스럽게도 이번에는 참가할 수 없습니다.","형용사"],["正直","しょうじき · な형용사","정직하다, 솔직하다","正直なところ、自信があるわけではない。","솔직히 말해 자신이 있는 것은 아니다.","형용사"],["丈夫","じょうぶ · な형용사","튼튼하다","このかばんは安いわりに丈夫だ。","이 가방은 싼 데 비해 튼튼하다.","형용사"],["深刻","しんこく · な형용사","심각하다","問題は深刻になる一方だ。","문제는 심각해지기만 한다.","형용사"],["素朴","そぼく · な형용사","소박하다, 순진하다","有名になったにもかかわらず、彼は素朴なままだ。","유명해졌는데도 그는 소박한 그대로다.","형용사"],["大げさ","おおげさ · な형용사","과장되다","彼の話は大げさで、信じがたい。","그의 이야기는 과장되어 믿기 어렵다.","형용사"],["丁寧","ていねい · な형용사","정중하다, 꼼꼼하다","急いでいるときこそ、丁寧に確認すべきだ。","서두를 때일수록 꼼꼼히 확인해야 한다.","형용사"],["特殊","とくしゅ · な형용사","특수하다","特殊な技術を持つ人に限り、応募できる。","특수한 기술을 가진 사람에 한해 지원할 수 있다.","형용사"],["突然","とつぜん · な형용사","갑작스럽다","突然の雨で、傘を買わざるを得なかった。","갑작스러운 비로 우산을 사지 않을 수 없었다.","형용사"],["不可欠","ふかけつ · な형용사","불가결하다","水は人間にとって不可欠だ。","물은 인간에게 불가결하다.","형용사"],["不満","ふまん · な형용사","불만이다","不満を言ったところで、何も変わらない。","불만을 말해 봤자 아무것도 변하지 않는다.","형용사"],["無駄","むだ · な형용사","헛되다, 쓸데없다","無駄な会議は減らすべきだ。","쓸데없는 회의는 줄여야 한다.","형용사"],["夢中","むちゅう · な형용사","열중하다, 몰두하다","ゲームに夢中になるあまり、宿題を忘れた。","게임에 열중한 나머지 숙제를 잊었다.","형용사"],["有効","ゆうこう · な형용사","유효하다","この券は本人に限り有効だ。","이 표는 본인에 한해 유효하다.","형용사"],["単純","たんじゅん · な형용사","단순하다","単純な作業にすぎないが、時間がかかる。","단순한 작업에 지나지 않지만 시간이 걸린다.","형용사"],["率直","そっちょく · な형용사","솔직하다","率直な意見を聞かせてほしいものだ。","솔직한 의견을 들려주었으면 한다.","형용사"],["柔軟","じゅうなん · な형용사","유연하다","状況に応じて、柔軟に対応する。","상황에 따라 유연하게 대응한다.","형용사"],["適切","てきせつ · な형용사","적절하다","適切な治療を受けたおかげで、早く治った。","적절한 치료를 받은 덕분에 빨리 나았다.","형용사"],["必須","ひっす · な형용사","필수적이다","この仕事には、英語が必須だということだ。","이 일에는 영어가 필수라고 한다.","형용사"],["貧乏","びんぼう · な형용사","가난하다","貧乏だったからこそ、お金の大切さがわかる。","가난했기 때문에 돈의 소중함을 안다.","형용사"],["不要","ふよう · な형용사","불필요하다","不要な物は、捨てるか人にあげるかするしかない。","필요 없는 물건은 버리거나 남에게 줄 수밖에 없다.","형용사"],["平均的","へいきんてき · な형용사","평균적이다","彼の成績は平均的というより、むしろ良いほうだ。","그의 성적은 평균적이라기보다 오히려 좋은 편이다.","형용사"],["理想的","りそうてき · な형용사","이상적이다","駅に近いうえに静かで、理想的な部屋だ。","역에서 가까운 데다 조용해서 이상적인 방이다.","형용사"],["冷静","れいせい · な형용사","냉정하다, 침착하다","彼は驚いたものの、すぐに冷静になった。","그는 놀라기는 했지만 금방 침착해졌다.","형용사"],["怪しい","あやしい · い형용사","수상하다","あの男の行動は怪しいとしか言いようがない。","저 남자의 행동은 수상하다고밖에 말할 수 없다.","형용사"],["慌ただしい","あわただしい · い형용사","분주하다, 어수선하다","年末は慌ただしくて、休むどころではない。","연말은 분주해서 쉴 상황이 아니다.","형용사"],["勇ましい","いさましい · い형용사","용감하다, 씩씩하다","子どもたちは勇ましい歌を歌いながら歩いた。","아이들은 씩씩한 노래를 부르며 걸었다.","형용사"],["著しい","いちじるしい · い형용사","현저하다, 두드러지다","最近、この分野の技術は著しく進歩した。","최근 이 분야의 기술은 현저하게 진보했다.","형용사"],["うっとうしい","い형용사","성가시다, 음울하다","梅雨の時期は、うっとうしくてたまらない。","장마철은 음울해서 견딜 수 없다.","형용사"],["大人しい","おとなしい · い형용사","얌전하다","弟は家では大人しいわりに、学校ではよく話す。","남동생은 집에서는 얌전한 데 비해 학교에서는 말을 잘한다.","형용사"],["輝かしい","かがやかしい · い형용사","빛나다, 눈부시다","彼は輝かしい成績を残して引退した。","그는 빛나는 성적을 남기고 은퇴했다.","형용사"],["賢い","かしこい · い형용사","영리하다","犬は賢い動物だと言われている。","개는 영리한 동물이라고 한다.","형용사"],["堅い","かたい · い형용사","단단하다, 입이 무겁다","彼は口が堅いから、秘密を話しても大丈夫だ。","그는 입이 무거우니까 비밀을 말해도 괜찮다.","형용사"],["かゆい","い형용사","가렵다","蚊に刺されたところがかゆくてしょうがない。","모기에 물린 곳이 가려워 견딜 수 없다.","형용사"],["辛い","つらい · い형용사","괴롭다, 힘들다","仕事が辛いからといって、すぐ辞めるわけにはいかない。","일이 힘들다고 해서 바로 그만둘 수는 없다.","형용사"],["きつい","い형용사","힘들다, 꽉 끼다","この靴はきつくて、長く歩けない。","이 신발은 꽉 껴서 오래 걸을 수 없다.","형용사"],["くどい","い형용사","장황하다, 끈덕지다","彼の説明はくどくて、聞いているうちに眠くなった。","그의 설명은 장황해서 듣는 사이에 졸려졌다.","형용사"],["悔しい","くやしい · い형용사","분하다","あと少しのところで負けて、悔しくてならない。","조금만 더 하면 되는데 져서 분해 견딜 수 없다.","형용사"],["険しい","けわしい · い형용사","험하다","険しい山道を登るにつれて、息が苦しくなった。","험한 산길을 오름에 따라 숨이 가빠졌다.","형용사"],["濃い","こい · い형용사","진하다","この店のスープは味が濃いわりに、後味がいい。","이 가게의 수프는 맛이 진한 데 비해 뒷맛이 좋다.","형용사"],["快い","こころよい · い형용사","기분 좋다, 흔쾌하다","彼は私の頼みを快く引き受けてくれた。","그는 내 부탁을 흔쾌히 맡아 주었다.","형용사"],["騒がしい","さわがしい · い형용사","소란스럽다","教室が騒がしくて、先生の声が聞こえない。","교실이 소란스러워서 선생님 목소리가 들리지 않는다.","형용사"],["親しい","したしい · い형용사","친하다","親しい友人だからこそ、本当のことを言える。","친한 친구이기 때문에 진실을 말할 수 있다.","형용사"],["渋い","しぶい · い형용사","떫다, 수수하고 멋지다","このお茶は渋いものの、慣れるとおいしい。","이 차는 떫긴 하지만 익숙해지면 맛있다.","형용사"],["しつこい","い형용사","끈질기다","しつこく聞かれて、答えざるを得なかった。","끈질기게 물어서 대답하지 않을 수 없었다.","형용사"],["ずるい","い형용사","치사하다, 교활하다","自分だけ休むなんて、ずるいというものだ。","자기만 쉬다니 치사한 것이다.","형용사"],["騒々しい","そうぞうしい · い형용사","떠들썩하다, 시끄럽다","工事の音が騒々しくて、勉強どころではない。","공사 소리가 시끄러워서 공부할 상황이 아니다.","형용사"],["たくましい","い형용사","씩씩하다, 튼튼하다","子どもは困難を通じて、たくましくなる。","아이는 어려움을 통해 씩씩해진다.","형용사"],["頼りない","たよりない · い형용사","미덥지 않다","彼は若いだけに、少し頼りないところがある。","그는 젊은 만큼 조금 미덥지 않은 데가 있다.","형용사"],["力強い","ちからづよい · い형용사","힘차다","彼の力強い言葉に、勇気をもらった。","그의 힘찬 말에 용기를 얻었다.","형용사"],["乏しい","とぼしい · い형용사","부족하다, 모자라다","経験が乏しいにもかかわらず、彼はよくやっている。","경험이 부족한데도 그는 잘하고 있다.","형용사"],["懐かしい","なつかしい · い형용사","그립다","この歌を聞くと、学生時代が懐かしくてたまらない。","이 노래를 들으면 학창 시절이 그리워 견딜 수 없다.","형용사"],["情けない","なさけない · い형용사","한심하다","こんな問題も解けないとは、情けない。","이런 문제도 못 풀다니 한심하다.","형용사"],["憎い","にくい · い형용사","밉다","うそをついた彼が憎いというより、悲しい。","거짓말을 한 그가 밉다기보다 슬프다.","형용사"],["鈍い","にぶい · い형용사","둔하다","疲れているせいで、頭の働きが鈍い。","피곤한 탓에 머리 회전이 둔하다.","형용사"],["望ましい","のぞましい · い형용사","바람직하다","全員が参加することが望ましい。","전원이 참가하는 것이 바람직하다.","형용사"],["激しい","はげしい · い형용사","격렬하다, 심하다","激しい雨のため、試合は中止せざるを得なかった。","심한 비 때문에 경기는 중지하지 않을 수 없었다.","형용사"],["等しい","ひとしい · い형용사","같다, 다름없다","何も言わないのは、認めたに等しい。","아무 말도 하지 않는 것은 인정한 것이나 다름없다.","형용사"],["相応しい","ふさわしい · い형용사","어울리다, 걸맞다","彼こそリーダーに相応しい人だ。","그야말로 리더에 걸맞은 사람이다.","형용사"],["貧しい","まずしい · い형용사","가난하다","貧しいながらも、家族は幸せに暮らしていた。","가난하지만 가족은 행복하게 살고 있었다.","형용사"],["紛らわしい","まぎらわしい · い형용사","헷갈리기 쉽다","この二つの漢字は紛らわしい。","이 두 한자는 헷갈리기 쉽다.","형용사"],["眩しい","まぶしい · い형용사","눈부시다","太陽が眩しくて、目を開けていられない。","태양이 눈부셔서 눈을 뜨고 있을 수 없다.","형용사"],["みっともない","い형용사","꼴사납다","人前で大声を出すのは、みっともない。","사람들 앞에서 큰 소리를 내는 것은 꼴사납다.","형용사"],["蒸し暑い","むしあつい · い형용사","무덥다","日本の夏は蒸し暑くてたまらない。","일본의 여름은 무더워서 견딜 수 없다.","형용사"],["空しい","むなしい · い형용사","허무하다","努力が無駄になって、空しい気持ちになった。","노력이 헛되이 되어 허무한 기분이 들었다.","형용사"],["目覚ましい","めざましい · い형용사","눈부시다, 놀랍다","この国の経済は目覚ましい発展をとげた。","이 나라의 경제는 눈부신 발전을 이뤘다.","형용사"],["面倒くさい","めんどうくさい · い형용사","귀찮다","面倒くさいからといって、掃除をしないわけにはいかない。","귀찮다고 해서 청소를 안 할 수는 없다.","형용사"],["申し訳ない","もうしわけない · い형용사","죄송하다, 면목 없다","迷惑をかけて、申し訳ない気持ちでいっぱいだ。","폐를 끼쳐서 죄송한 마음으로 가득하다.","형용사"],["もったいない","い형용사","아깝다","まだ使えるのに捨てるのは、もったいない。","아직 쓸 수 있는데 버리는 것은 아깝다.","형용사"],["やかましい","い형용사","시끄럽다, 까다롭다","隣の工事がやかましくて、眠れない。","옆집 공사가 시끄러워서 잠을 잘 수 없다.","형용사"],["緩い","ゆるい · い형용사","느슨하다","この学校は規則が緩いほうだ。","이 학교는 규칙이 느슨한 편이다.","형용사"],["喜ばしい","よろこばしい · い형용사","기쁘다, 경사스럽다","全員が合格したのは、喜ばしいことだ。","전원이 합격한 것은 기쁜 일이다.","형용사"],["若々しい","わかわかしい · い형용사","젊어 보이다","祖母は年のわりに若々しい。","할머니는 나이에 비해 젊어 보이신다.","형용사"],["煩わしい","わずらわしい · い형용사","번거롭다","手続きが煩わしくて、申し込みをやめた。","절차가 번거로워서 신청을 그만뒀다.","형용사"],["明らか","あきらか · な형용사","분명하다","彼がうそをついているのは明らかだ。","그가 거짓말을 하고 있는 것은 분명하다.","형용사"],["鮮やか","あざやか · な형용사","선명하다","秋になると、山が鮮やかな色に変わる。","가을이 되면 산이 선명한 색으로 바뀐다.","형용사"],["哀れ","あわれ · な형용사","불쌍하다","捨てられた犬が哀れ ようがない。","날씨가 불안정해서 예정을 세울 방도가 없다.","형용사"],["不規則","ふきそく · な형용사","불규칙하다","不規則な生活を続けると、体をこわしかねない。","불규칙한 생활을 계속하면 몸을 망칠 수 있다.","형용사"],["不公平","ふこうへい · な형용사","불공평하다","一人だけ休むのは不公平だ。","혼자만 쉬는 것은 불공평하다.","형용사"],["無事","ぶじ · な형용사","무사하다","全員が無事に帰ってきて、ほっとした。","전원이 무사히 돌아와서 안심했다.","형용사"],["不自由","ふじゆう · な형용사","불편하다, 부자유스럽다","言葉が通じなくて、不自由な思いをした。","말이 통하지 않아 불편을 겪었다.","형용사"],["不思議","ふしぎ · な형용사","이상하다, 신기하다","不思議なことに、だれもその音を聞いていない。","이상하게도 아무도 그 소리를 듣지 못했다.","형용사"],["物騒","ぶっそう · な형용사","뒤숭숭하다, 위험하다","最近は物騒な事件が増える一方だ。","요즘은 흉흉한 사건이 늘기만 한다.","형용사"],["膨大","ぼうだい · な형용사","방대하다","膨大な資料を読まざるを得ない。","방대한 자료를 읽지 않을 수 없다.","형용사"],["豊富","ほうふ · な형용사","풍부하다","この店は品物が豊富なうえに、安い。","이 가게는 물건이 풍부한 데다가 싸다.","형용사"],["前向き","まえむき · な형용사","긍정적이다, 적극적이다","失敗しても、前向きに考えることだ。","실패해도 긍정적으로 생각하는 것이 좋다.","형용사"],["稀","まれ · な형용사","드물다","こんな大雪は、この地方では稀だ。","이런 폭설은 이 지방에서는 드물다.","형용사"],["惨め","みじめ · な형용사","비참하다","雨にぬれて、惨めな気持ちになった。","비에 젖어 비참한 기분이 들었다.","형용사"],["密接","みっせつ · な형용사","밀접하다","食事と健康は密接に関係している。","식사와 건강은 밀접하게 관계되어 있다.","형용사"],["無口","むくち · な형용사","과묵하다","父は無口だが、冷たい人ではない。","아버지는 과묵하지만 차가운 사람은 아니다.","형용사"],["無邪気","むじゃき · な형용사","천진하다","子どもの無邪気な笑顔に、心が温まった。","아이의 천진한 웃는 얼굴에 마음이 따뜻해졌다.","형용사"],["無責任","むせきにん · な형용사","무책임하다","途中でやめるのは無責任というものだ。","도중에 그만두는 것은 무책임한 것이다.","형용사"],["無茶","むちゃ · な형용사","무모하다, 터무니없다","無茶な計画を立てたあげく、失敗した。","무모한 계획을 세운 끝에 실패했다.","형용사"],["明確","めいかく · な형용사","명확하다","目的が明確でないかぎり、計画は進められない。","목적이 명확하지 않는 한 계획은 진행할 수 없다.","형용사"],["厄介","やっかい · な형용사","성가시다, 귀찮다","厄介な問題を抱えている。","성가신 문제를 안고 있다.","형용사"],["優秀","ゆうしゅう · な형용사","우수하다","彼は優秀なだけに、期待も大きい。","그는 우수한 만큼 기대도 크다.","형용사"],["有能","ゆうのう · な형용사","유능하다","有能な人ほど、仕事を任される。","유능한 사람일수록 일을 맡게 된다.","형용사"],["愉快","ゆかい · な형용사","유쾌하다","昨日は友人と愉快な時間を過ごした。","어제는 친구와 유쾌한 시간을 보냈다.","형용사"],["幼稚","ようち · な형용사","유치하다","大人にしては、考え方が幼稚だ。","어른치고는 사고방식이 유치하다.","형용사"],["余計","よけい · な형용사","쓸데없다","余計なことを言ったばかりに、怒られた。","쓸데없는 말을 한 탓에 혼났다.","형용사"],["乱暴","らんぼう · な형용사","난폭하다","物を乱暴に扱うべきではない。","물건을 난폭하게 다뤄서는 안 된다.","형용사"],["立派","りっぱ · な형용사","훌륭하다","彼は立派な医者になったということだ。","그는 훌륭한 의사가 되었다고 한다.","형용사"],["わがまま","な형용사","제멋대로이다","わがままを言ったところで、何も変わらない。","제멋대로 굴어 봤자 아무것도 변하지 않는다.","형용사"],["厳しい","きびしい · い형용사","엄하다, 혹독하다","父は厳しい反面、やさしいところもある。","아버지는 엄한 반면 다정한 면도 있다.","형용사"],["淡い","あわい · い형용사","옅다, 연하다","春らしい淡い色のシャツを買った。","봄다운 연한 색 셔츠를 샀다.","형용사"],["真剣","しんけん · な형용사","진지하다","彼は真剣な顔で、将来の夢について話した。","그는 진지한 얼굴로 장래의 꿈에 대해 이야기했다.","형용사"],["適度","てきど · な형용사","적당하다, 알맞다","健康のためには、適度な運動が欠かせない。","건강을 위해서는 적당한 운동이 빠질 수 없다.","형용사"],["不得意","ふとくい · な형용사","서투르다, 잘 못하다","人前で話すのは不得意だが、やってみるしかない。","사람들 앞에서 말하는 것은 서투르지만 해 보는 수밖에 없다.","형용사"],["優良","ゆうりょう · な형용사","우량하다, 우수하다","この店は、市から優良な店として選ばれた。","이 가게는 시로부터 우수한 가게로 선정되었다.","형용사"],["〜おきに","","~간격으로, ~걸러","バスは10分おきに来る。","버스는 10분 간격으로 온다.","문법"],["〜くせに","","~인 주제에, ~면서도","知っているくせに教えてくれない。","알면서도 가르쳐 주지 않는다.","문법"],["〜ぐらい","","적어도 ~정도는","あいさつぐらいしてほしい。","인사 정도는 해 줬으면 한다.","문법"],["〜によって","","~로 인해 (원인)","台風によって電車が止まった。","태풍으로 인해 전철이 멈췄다.","문법"],["〜わけではない","","~인 것은 아니다","嫌いなわけではないが、あまり食べない。","싫어하는 건 아니지만 잘 먹지 않는다.","문법"],["お〜します","","겸양 표현 (제가 ~해 드리다)","荷物をお持ちします。","짐을 들어 드리겠습니다.","문법"],["〜はずがない","","~일 리가 없다","彼がうそをつくはずがない。","그가 거짓말할 리가 없다.","문법"],["〜ようがない","","~할 방도가 없다 (ます형 접속)","連絡先を知らないので、知らせようがない。","연락처를 몰라서 알릴 방도가 없다.","문법"],["〜とは言わないが","","~라고까지는 하지 않겠지만","毎日とは言わないが、週に一度は運動したい。","매일이라고는 하지 않겠지만 주 1회는 운동하고 싶다.","문법"],["〜とはいうものの","","~라고는 하지만","春とはいうものの、朝は冷える。","봄이라고는 하지만 아침은 쌀쌀하다.","문법"],["〜まいとする","","~하지 않으려고 하다","涙を見せまいとして横を向いた。","눈물을 보이지 않으려고 옆을 봤다.","문법"],["〜ないまでも","","~까지는 아니더라도","優勝しないまでも、決勝には進みたい。","우승까지는 아니더라도 결승에는 가고 싶다.","문법"],["〜だって","","~라도, ~도 (예외 없이)","練習すれば、子どもだってできる。","연습하면 아이라도 할 수 있다.","문법"],["〜うえで","","~한 뒤에, ~한 다음에","内容をよく読んだうえで、サインしてください。","내용을 잘 읽은 다음에 서명해 주세요.","문법"],["〜ぬきにして","","~을 빼고, ~없이","冗談はぬきにして、本当のことを話そう。","농담은 빼고 진짜 이야기를 하자.","문법"],["〜どころか","","~은커녕","貯金どころか、借金まである。","저금은커녕 빚까지 있다.","문법"],["〜に先立って","にさきだって","~에 앞서","開店に先立って、説明会が行われた。","개점에 앞서 설명회가 열렸다.","문법"],["〜てからでないと","","~하고 나서가 아니면","実物を見てからでないと、買うかどうか決められない。","실물을 보고 나서가 아니면 살지 말지 정할 수 없다.","문법"],["〜だけで","","~하는 것만으로도","その場面を思い出すだけで、涙が出る。","그 장면을 떠올리는 것만으로도 눈물이 난다.","문법"],["〜てもみない","","~해 보지도 않다 (전혀 예상 못 함)","自分が優勝するなんて、考えてもみなかった。","내가 우승하다니 생각해 보지도 못했다.","문법"],["〜気味","ぎみ","~한 기미, ~한 경향","最近、少し疲れ気味だ。","요즘 조금 피곤한 기미가 있다.","문법"],["〜させていただく","","(허락을 받아) ~하다 (겸양)","本日は早めに帰らせていただけませんか。","오늘은 일찍 돌아가도 되겠습니까?","문법"],["〜わけがない","","~일 리가 없다","こんな難しい問題が小学生に解けるわけがない。","이런 어려운 문제를 초등학생이 풀 수 있을 리가 없다.","문법"],["〜かける","","~하다 말다, ~하기 시작하다","読みかけの本が机の上に置いてある。","읽다 만 책이 책상 위에 놓여 있다.","문법"],["〜あげく","","~한 끝에 (좋지 않은 결과)","さんざん迷ったあげく、何も買わずに帰った。","한참 망설인 끝에 아무것도 사지 않고 돌아왔다.","문법"],["〜あまり","","~한 나머지","心配のあまり、一晩中眠れなかった。","걱정한 나머지 밤새 잠을 못 잤다.","문법"],["〜以上","いじょう","~한 이상","引き受けた以上、最後までやるつもりだ。","맡은 이상 끝까지 할 생각이다.","문법"],["〜一方だ","いっぽうだ","~하기만 하다","物価は上がる一方だ。","물가는 오르기만 한다.","문법"],["〜一方で","いっぽうで","~하는 한편","彼は会社で働く一方で、小説も書いている。","그는 회사에서 일하는 한편 소설도 쓰고 있다.","문법"],["〜うえに","","~한 데다가","この店は安いうえに、味もいい。","이 가게는 싼 데다가 맛도 좋다.","문법"],["〜うちに","","~하는 동안에, ~하기 전에","熱いうちに食べてください。","뜨거울 때 드세요.","문법"],["〜おかげで","","~덕분에","先生のおかげで、合格できた。","선생님 덕분에 합격할 수 있었다.","문법"],["〜おそれがある","","~할 우려가 있다","大雨で川があふれるおそれがある。","폭우로 강이 넘칠 우려가 있다.","문법"],["〜かぎり","","~하는 한","私が知っているかぎり、彼は正直な人だ。","내가 아는 한 그는 정직한 사람이다.","문법"],["〜ないかぎり","","~하지 않는 한","謝らないかぎり、許すつもりはない。","사과하지 않는 한 용서할 생각은 없다.","문법"],["〜がたい","","~하기 어렵다","彼がうそをついたとは信じがたい。","그가 거짓말을 했다고는 믿기 어렵다.","문법"],["〜がちだ","","~하기 쉽다, 자주 ~하다","冬は運動不足になりがちだ。","겨울에는 운동 부족이 되기 쉽다.","문법"],["〜かと思うと","かとおもうと","~했나 싶더니 곧","雨がやんだかと思うと、また降り出した。","비가 그쳤나 싶더니 또 내리기 시작했다.","문법"],["〜かねない","","~할지도 모른다 (나쁜 결과)","このままでは事故になりかねない。","이대로는 사고가 날지도 모른다.","문법"],["〜かねる","","~하기 어렵다 (정중한 거절)","その質問にはお答えしかねます。","그 질문에는 답변드리기 어렵습니다.","문법"],["〜かのようだ","","마치 ~인 것 같다","彼は何も知らないかのように話した。","그는 아무것도 모르는 것처럼 말했다.","문법"],["〜からこそ","","바로 ~이기 때문에","好きだからこそ、厳しく言うのだ。","좋아하기 때문에 엄하게 말하는 것이다.","문법"],["〜からすると","","~로 보면","話し方からすると、彼は関西の人らしい。","말투로 보면 그는 간사이 사람인 것 같다.","문법"],["〜からといって","","~라고 해서","安いからといって、買いすぎてはいけない。","싸다고 해서 너무 많이 사면 안 된다.","문법"],["〜からには","","~한 이상에는","やるからには、全力でやりたい。","하는 이상에는 전력으로 하고 싶다.","문법"],["〜から〜にかけて","","~부터 ~에 걸쳐","昨夜から今朝にかけて雪が降った。","어젯밤부터 오늘 아침에 걸쳐 눈이 내렸다.","문법"],["〜きり","","~한 채 (그 뒤로 없음)","彼とは去年会ったきり、連絡がない。","그와는 작년에 만난 뒤로 연락이 없다.","문법"],["〜きる","","끝까지 ~하다, 완전히 ~하다","長い小説を一日で読みきった。","긴 소설을 하루 만에 다 읽었다.","문법"],["〜くらいなら","","~할 바에는","途中でやめるくらいなら、始めないほうがいい。","도중에 그만둘 바에는 시작하지 않는 편이 낫다.","문법"],["〜げ","","~한 듯한 모양","彼女は寂しげに窓の外を見ていた。","그녀는 쓸쓸한 듯이 창밖을 보고 있었다.","문법"],["〜ことか","","얼마나 ~했던가","合格の知らせを聞いて、どんなにうれしかったことか。","합격 소식을 듣고 얼마나 기뻤던가.","문법"],["〜ことから","","~로 인해, ~때문에","富士山が見えることから、この町は富士見と呼ばれる。","후지산이 보여서 이 마을은 후지미라 불린다.","문법"],["〜ことだ","","~하는 것이 좋다 (충고)","上手になりたければ、毎日練習することだ。","잘하고 싶으면 매일 연습하는 것이 좋다.","문법"],["〜ことなく","","~하지 않고","彼は休むことなく働き続けた。","그는 쉬지 않고 계속 일했다.","문법"],["〜ことに","","~하게도 (감정 강조)","驚いたことに、彼はもう帰っていた。","놀랍게도 그는 이미 돌아가 있었다.","문법"],["〜ことになっている","","~하기로 되어 있다","会議は月曜日に開くことになっている。","회의는 월요일에 열기로 되어 있다.","문법"],["〜ことはない","","~할 필요는 없다","君が謝ることはない。","네가 사과할 필요는 없다.","문법"],["〜際に","さいに","~할 때","お帰りの際に、受付にお寄りください。","돌아가실 때 접수처에 들러 주세요.","문법"],["〜最中に","さいちゅうに","한창 ~하는 중에","会議の最中に電話が鳴った。","한창 회의 중에 전화가 울렸다.","문법"],["〜さえ〜ば","","~만 ~하면","時間さえあれば、もっと旅行したい。","시간만 있으면 더 여행하고 싶다.","문법"],["〜ざるを得ない","ざるをえない","~하지 않을 수 없다","台風のため、試合は中止せざるを得ない。","태풍 때문에 경기는 중지하지 않을 수 없다.","문법"],["〜しかない","","~할 수밖에 없다","電車が止まったので、歩くしかない。","전철이 멈춰서 걸을 수밖에 없다.","문법"],["〜次第","しだい","~하는 대로 (즉시)","結果がわかり次第、お知らせします。","결과를 아는 대로 알려 드리겠습니다.","문법"],["〜次第だ","しだいだ","~에 달려 있다","成功するかどうかは努力次第だ。","성공할지 어떨지는 노력에 달려 있다.","문법"],["〜上","じょう","~상, ~의 측면에서","この映画は教育上よくない。","이 영화는 교육상 좋지 않다.","문법"],["〜末に","すえに","~한 끝에","長い話し合いの末に、結論が出た。","오랜 논의 끝에 결론이 났다.","문법"],["〜ずにはいられない","","~하지 않을 수 없다","その話を聞いて、笑わずにはいられなかった。","그 이야기를 듣고 웃지 않을 수 없었다.","문법"],["〜せいで","","~탓에","寝不足のせいで、頭が痛い。","수면 부족 탓에 머리가 아프다.","문법"],["〜だけあって","","~인 만큼 (역시)","彼は留学しただけあって、英語がうまい。","그는 유학한 만큼 영어를 잘한다.","문법"],["〜だけに","","~인 만큼 (더욱)","期待していただけに、失望も大きかった。","기대했던 만큼 실망도 컸다.","문법"],["〜たところ","","~했더니","電話で聞いてみたところ、席はまだあった。","전화로 물어봤더니 자리는 아직 있었다.","문법"],["〜たとたん","","~하자마자","立ち上がったとたん、目の前が暗くなった。","일어서자마자 눈앞이 캄캄해졌다.","문법"],["〜たびに","","~할 때마다","この歌を聞くたびに、故郷を思い出す。","이 노래를 들을 때마다 고향이 떠오른다.","문법"],["〜だらけ","","~투성이","弟の部屋はごみだらけだ。","남동생 방은 쓰레기투성이다.","문법"],["〜ついでに","","~하는 김에","散歩のついでに、手紙を出してきた。","산책하는 김에 편지를 부치고 왔다.","문법"],["〜っこない","","~할 리가 없다 (회화체)","こんな量、一日で終わりっこない。","이런 양, 하루에 끝날 리가 없다.","문법"],["〜つつ","","~하면서","窓の外を眺めつつ、昔のことを考えた。","창밖을 바라보면서 옛일을 생각했다.","문법"],["〜つつある","","~하고 있다 (변화가 진행 중)","町の人口は減りつつある。","마을 인구는 줄어들고 있다.","문법"],["〜っぽい","","~같다, ~하는 경향이 있다","最近、忘れっぽくなった。","요즘 잘 잊어버리게 되었다.","문법"],["〜て以来","ていらい","~한 이래","日本に来て以来、一度も国に帰っていない。","일본에 온 이래 한 번도 고국에 돌아가지 않았다.","문법"],["〜てしょうがない","","~해서 견딜 수 없다","試験の結果が気になってしょうがない。","시험 결과가 신경 쓰여 견딜 수 없다.","문법"],["〜てたまらない","","~해서 참을 수 없다","暑くてたまらないので、窓を開けた。","더워서 참을 수 없어 창문을 열었다.","문법"],["〜てならない","","~해서 견딜 수 없다 (저절로 그렇게 됨)","母の体のことが心配でならない。","어머니 건강이 걱정되어 견딜 수 없다.","문법"],["〜ということだ","","~라고 한다 (전해 들은 말)","駅前に新しい病院ができるということだ。","역 앞에 새 병원이 생긴다고 한다.","문법"],["〜というものだ","","~라는 것이다 (단정)","困ったときに助け合うのが友達というものだ。","곤란할 때 서로 돕는 것이 친구라는 것이다.","문법"],["〜というより","","~라기보다","彼は先生というより、友達のような人だ。","그는 선생님이라기보다 친구 같은 사람이다.","문법"],["〜といっても","","~라고 해도","料理ができるといっても、簡単なものだけだ。","요리를 할 수 있다고 해도 간단한 것뿐이다.","문법"],["〜とおりに","","~대로","説明書のとおりに組み立てた。","설명서대로 조립했다.","문법"],["〜どころではない","","~할 상황이 아니다","仕事が忙しくて、旅行どころではない。","일이 바빠서 여행할 상황이 아니다.","문법"],["〜ところだった","","~할 뻔했다","もう少しで電車に乗り遅れるところだった。","하마터면 전철을 놓칠 뻔했다.","문법"],["〜としたら","","~라고 한다면","もし自由に選べるとしたら、どの国に住みたいですか。","만약 자유롭게 고를 수 있다면 어느 나라에 살고 싶습니까?","문법"],["〜として","","~로서","彼は医者として、多くの人を助けてきた。","그는 의사로서 많은 사람을 도와 왔다.","문법"],["〜とともに","","~와 함께, ~에 따라","年を取るとともに、体力が落ちてきた。","나이가 듦에 따라 체력이 떨어졌다.","문법"],["〜ないことには","","~하지 않고서는","食べてみないことには、味はわからない。","먹어 보지 않고서는 맛은 알 수 없다.","문법"],["〜ないことはない","","~못 할 것은 없다","走れば間に合わないことはない。","뛰면 시간에 못 맞출 것은 없다.","문법"],["〜ながらも","","~이지만, ~하면서도","狭いながらも、楽しい我が家だ。","좁지만 즐거운 우리 집이다.","문법"],["〜など","","~따위, ~같은 것","テレビなど見ている時間はない。","텔레비전 따위 볼 시간은 없다.","문법"],["〜にあたって","","~에 즈음하여, ~할 때에","留学するにあたって、保険に入った。","유학을 가면서 보험에 들었다.","문법"],["〜において","","~에서, ~에 있어서","式は大ホールにおいて行われる。","식은 대강당에서 열린다.","문법"],["〜に応じて","におうじて","~에 따라, ~에 맞게","収入に応じて、税金を払う。","수입에 따라 세금을 낸다.","문법"],["〜にかかわらず","","~에 관계없이","天気にかかわらず、大会は行われる。","날씨에 관계없이 대회는 열린다.","문법"],["〜にもかかわらず","","~에도 불구하고","雨にもかかわらず、多くの人が集まった。","비에도 불구하고 많은 사람이 모였다.","문법"],["〜に限って","にかぎって","~일 때만 꼭, ~에 한해서","急いでいるときに限って、バスが来ない。","서두를 때만 꼭 버스가 오지 않는다.","문법"],["〜に限らず","にかぎらず","~뿐만 아니라","この店は週末に限らず、平日も込んでいる。","이 가게는 주말뿐 아니라 평일에도 붐빈다.","문법"],["〜にかけては","","~에 관해서는 (자신 있음)","料理にかけては、だれにも負けない。","요리에 관해서는 누구에게도 지지 않는다.","문법"],["〜に関して","にかんして","~에 관하여","この件に関して、質問はありますか。","이 건에 관하여 질문 있습니까?","문법"],["〜に決まっている","にきまっている","당연히 ~다, ~할 게 뻔하다","そんな計画は失敗するに決まっている。","그런 계획은 실패할 게 뻔하다.","문법"],["〜に比べて","にくらべて","~에 비해","去年に比べて、今年は雨が多い。","작년에 비해 올해는 비가 많다.","문법"],["〜に加えて","にくわえて","~에 더하여","大雨に加えて、風も強くなってきた。","폭우에 더해 바람도 강해졌다.","문법"],["〜にこたえて","","~에 부응하여","客の要望にこたえて、営業時間を延ばした。","손님의 요망에 부응하여 영업시간을 늘렸다.","문법"],["〜にしたがって","","~에 따라","北へ行くにしたがって、寒くなる。","북쪽으로 감에 따라 추워진다.","문법"],["〜にしては","","~치고는","彼は初めてにしては、上手に話した。","그는 처음치고는 말을 잘했다.","문법"],["〜にしろ","","~라고 해도, ~든","行くにしろ行かないにしろ、連絡してください。","가든 안 가든 연락해 주세요.","문법"],["〜にすぎない","","~에 지나지 않는다","これは私の意見にすぎない。","이것은 내 의견에 지나지 않는다.","문법"],["〜に相違ない","にそういない","~임에 틀림없다 (문어체)","犯人はあの男に相違ない。","범인은 저 남자임에 틀림없다.","문법"],["〜に沿って","にそって","~에 따라, ~을 따라","計画に沿って、作業を進める。","계획에 따라 작업을 진행한다.","문법"],["〜に対して","にたいして","~에 대해, ~에게","客に対して、失礼なことを言ってはいけない。","손님에게 무례한 말을 하면 안 된다.","문법"],["〜に違いない","にちがいない","~임에 틀림없다","電気がついているから、彼は家にいるに違いない。","불이 켜져 있으니 그는 집에 있는 게 틀림없다.","문법"],["〜につき","","~이므로 (공지), ~당","工事中につき、通行できません。","공사 중이므로 통행할 수 없습니다.","문법"],["〜につれて","","~함에 따라","時間がたつにつれて、痛みが消えた。","시간이 지남에 따라 통증이 사라졌다.","문법"],["〜にとって","","~에게 있어서","私にとって、家族が一番大切だ。","나에게 있어 가족이 가장 소중하다.","문법"],["〜に伴って","にともなって","~에 따라, ~와 함께","人口の増加に伴って、住宅が不足している。","인구 증가에 따라 주택이 부족하다.","문법"],["〜に反して","にはんして","~에 반하여, ~와 달리","予想に反して、試験は易しかった。","예상과 달리 시험은 쉬웠다.","문법"],["〜にほかならない","","바로 ~이다","成功したのは、努力の結果にほかならない。","성공한 것은 바로 노력의 결과이다.","문법"],["〜に基づいて","にもとづいて","~에 근거하여","調査の結果に基づいて、計画を立てる。","조사 결과에 근거하여 계획을 세운다.","문법"],["〜によると","","~에 의하면","天気予報によると、明日は晴れるそうだ。","일기 예보에 의하면 내일은 맑다고 한다.","문법"],["〜にわたって","","~에 걸쳐서","大会は一週間にわたって行われた。","대회는 일주일에 걸쳐 열렸다.","문법"],["〜ばかりか","","~뿐만 아니라","彼は英語ばかりか、中国語も話せる。","그는 영어뿐만 아니라 중국어도 할 수 있다.","문법"],["〜ばかりに","","~한 탓에 (그것 하나 때문에)","うそをついたばかりに、信用を失った。","거짓말을 한 탓에 신용을 잃었다.","문법"],["〜はもちろん","","~은 물론","この歌は子どもはもちろん、大人にも人気がある。","이 노래는 아이는 물론 어른에게도 인기가 있다.","문법"],["〜反面","はんめん","~인 반면","この薬はよく効く反面、眠くなる。","이 약은 잘 듣는 반면 졸음이 온다.","문법"],["〜べきだ","","~해야 한다","約束は守るべきだ。","약속은 지켜야 한다.","문법"],["〜ほかない","","~할 수밖에 없다","だれも手伝ってくれないので、一人でやるほかない。","아무도 도와주지 않아서 혼자 할 수밖에 없다.","문법"],["〜ほど","","~할 정도로, ~만큼","涙が出るほど笑った。","눈물이 날 정도로 웃었다.","문법"],["〜ば〜ほど","","~하면 할수록","考えれば考えるほど、わからなくなる。","생각하면 할수록 모르게 된다.","문법"],["〜までして","","~까지 해서","借金までして、車を買う必要はない。","빚까지 내서 차를 살 필요는 없다.","문법"],["〜までもない","","~할 필요도 없다","説明するまでもなく、彼は理解していた。","설명할 필요도 없이 그는 이해하고 있었다.","문법"],["〜向きだ","むきだ","~에 적합하다","この本は初心者向きだ。","이 책은 초보자에게 적합하다.","문법"],["〜向けだ","むけだ","~용이다, ~을 대상으로 하다","これは外国人向けの新聞だ。","이것은 외국인용 신문이다.","문법"],["〜も〜ば〜も","","~도 ~하고 ~도","彼は歌も歌えば、ピアノも弾く。","그는 노래도 하고 피아노도 친다.","문법"],["〜もかまわず","","~도 아랑곳하지 않고","人目もかまわず、彼女は泣き出した。","남의 눈도 아랑곳하지 않고 그녀는 울기 시작했다.","문법"],["〜ものがある","","~한 데가 있다 (느낌)","彼の歌には、人の心を動かすものがある。","그의 노래에는 사람의 마음을 움직이는 데가 있다.","문법"],["〜ものだ","","~하는 법이다, ~하곤 했다","子どものころは、よく川で遊んだものだ。","어릴 때는 자주 강에서 놀곤 했다.","문법"],["〜ものだから","","~해서 (변명·이유)","道が込んでいたものだから、遅れてしまった。","길이 막혀서 늦고 말았다.","문법"],["〜ものなら","","~할 수 있다면","できるものなら、学生時代に戻りたい。","할 수 있다면 학창 시절로 돌아가고 싶다.","문법"],["〜ものの","","~이긴 하지만","買ったものの、まだ一度も使っていない。","사긴 했지만 아직 한 번도 쓰지 않았다.","문법"],["〜やら〜やら","","~이며 ~이며","宿題やら掃除やらで、休みが終わってしまった。","숙제며 청소며 하다 보니 휴일이 끝나 버렸다.","문법"],["〜わけにはいかない","","~할 수는 없다","大事な会議なので、休むわけにはいかない。","중요한 회의라서 쉴 수는 없다.","문법"],["〜わりに","","~에 비해서","この仕事は大変なわりに、給料が安い。","이 일은 힘든 데 비해 급여가 싸다.","문법"],["〜をきっかけに","","~을 계기로","入院をきっかけに、たばこをやめた。","입원을 계기로 담배를 끊었다.","문법"],["〜を込めて","をこめて","~을 담아","感謝の気持ちを込めて、手紙を書いた。","감사의 마음을 담아 편지를 썼다.","문법"],["〜を中心に","をちゅうしんに","~을 중심으로","駅を中心に、町が発展した。","역을 중심으로 마을이 발전했다.","문법"],["〜を通じて","をつうじて","~을 통해서","友人を通じて、彼と知り合った。","친구를 통해 그와 알게 되었다.","문법"],["〜を問わず","をとわず","~을 불문하고","この仕事は経験を問わず、応募できる。","이 일은 경험을 불문하고 지원할 수 있다.","문법"],["〜をはじめ","","~을 비롯하여","社長をはじめ、社員全員が出席した。","사장을 비롯하여 사원 전원이 출석했다.","문법"],["〜をめぐって","","~을 둘러싸고","土地の利用をめぐって、意見が分かれた。","토지 이용을 둘러싸고 의견이 갈렸다.","문법"],["〜をもとに","","~을 바탕으로","実際の事件をもとに、映画が作られた。","실제 사건을 바탕으로 영화가 만들어졌다.","문법"],["〜ところに","","~하는 참에, ~하던 때에","出かけようとしていたところに、電話がかかってきた。","나가려던 참에 전화가 걸려 왔다.","문법"],["〜てばかりいる","","~하기만 하다","弟は遊んでばかりいて、少しも勉強しない。","남동생은 놀기만 하고 조금도 공부하지 않는다.","문법"],["〜ところをみると","","~하는 것을 보면","電気が消えているところをみると、もう寝たらしい。","불이 꺼져 있는 것을 보면 벌써 잔 모양이다.","문법"],["〜とは","","~란, ~라는 것은 (정의)","「就活」とは、仕事を探すための活動のことだ。","'취활'이란 일자리를 찾기 위한 활동을 말한다.","문법"],["〜というと","","~라고 하면","京都というと、古いお寺を思い出す人が多い。","교토라고 하면 오래된 절을 떠올리는 사람이 많다.","문법"],["〜といった","","~와 같은, ~등의","この店では、すしや天ぷらといった日本料理が食べられる。","이 가게에서는 초밥이나 튀김 같은 일본 요리를 먹을 수 있다.","문법"],["〜によっては","","~에 따라서는","天気によっては、試合が中止になることもある。","날씨에 따라서는 시합이 중지되는 경우도 있다.","문법"],["〜すら","","~조차","忙しすぎて、昼ご飯を食べる時間すらない。","너무 바빠서 점심을 먹을 시간조차 없다.","문법"],["〜てはどうか","","~하면 어떨까 (제안)","疲れているなら、少し休んでみてはどうですか。","피곤하다면 조금 쉬어 보면 어떻습니까?","문법"],["〜たまま","","~한 채로","窓を開けたまま寝てしまって、風邪をひいた。","창문을 연 채로 자 버려서 감기에 걸렸다.","문법"],["〜っけ","","~였나?, ~였지? (확인)","明日の会議は、何時からだったっけ。","내일 회의는 몇 시부터였지?","문법"],["〜わけだ","","~인 셈이다, ~할 만하다","十年も日本に住んでいたのか。日本語が上手なわけだ。","10년이나 일본에 살았구나. 일본어를 잘할 만하다.","문법"],["〜というわけだ","","~라는 것이다, ~라는 말이다 (결론)","電車が止まった。つまり、今日は歩いて帰るしかないというわけだ。","전철이 멈췄다. 즉 오늘은 걸어서 돌아갈 수밖에 없다는 말이다.","문법"],["〜なくてはならない","","~하지 않으면 안 된다, 없어서는 안 된다","携帯電話は、今の生活になくてはならないものだ。","휴대전화는 지금 생활에 없어서는 안 되는 것이다.","문법"],["〜から見ると","","~의 입장에서 보면","親から見ると、子どもはいくつになっても子どもだ。","부모 입장에서 보면 자식은 몇 살이 되어도 아이다.","문법"],["〜に至るまで","","~에 이르기까지","この店は、食器からタオルに至るまで何でもそろっている。","이 가게는 식기에서 수건에 이르기까지 뭐든지 갖추어져 있다.","문법"],["どちらかというと","","어느 쪽인가 하면, 굳이 말하자면","私はどちらかというと、肉より魚のほうが好きだ。","나는 굳이 말하자면 고기보다 생선을 더 좋아한다.","문법"],["それどころか","","그렇기는커녕, 오히려","薬を飲んだのに治らない。それどころか、熱が上がってきた。","약을 먹었는데도 낫지 않는다. 오히려 열이 오르기 시작했다.","문법"],["すなわち","","즉, 다시 말해","父の兄、すなわち私のおじは、大阪に住んでいる。","아버지의 형, 즉 나의 큰아버지는 오사카에 살고 있다.","문법"],["〜てからしか〜ない","","~하고 나서야 ~하다","私は実際に使ってみてからしか、高い物は買わない。","나는 실제로 써 보고 나서야 비싼 물건을 산다.","문법"],["〜だけましだ","","~만 해도 다행이다","給料は安いが、仕事があるだけましだ。","급여는 적지만 일이 있는 것만 해도 다행이다.","문법"],["〜だけのことはある","","~한 보람이 있다, 과연 ~답다","この店の料理はおいしい。有名なだけのことはある。","이 가게 요리는 맛있다. 과연 유명할 만하다.","문법"],["〜でしかない","","~에 불과하다","それは一つの例でしかないので、ほかの場合も調べるべきだ。","그것은 하나의 예에 불과하므로 다른 경우도 조사해야 한다.","문법"],["〜得る","","~할 수 있다, ~할 가능성이 있다","この事故は、だれにでも起こり得ることだ。","이 사고는 누구에게나 일어날 수 있는 일이다.","문법"],["〜得ない","","~할 수 없다, ~일 리 없다","彼がそんなうそをつくなんて、あり得ない。","그가 그런 거짓말을 하다니 있을 수 없다.","문법"],["〜か〜ないかのうちに","","~하자마자","ベルが鳴るか鳴らないかのうちに、学生たちは教室を出た。","벨이 울리자마자 학생들은 교실을 나갔다.","문법"],["〜かいがある","","~한 보람이 있다","毎日練習したかいがあって、試合に勝つことができた。","매일 연습한 보람이 있어서 시합에 이길 수 있었다.","문법"],["〜から言うと","","~의 입장에서 말하면, ~로 보면","私の経験から言うと、この方法がいちばん早い。","내 경험으로 말하자면 이 방법이 가장 빠르다.","문법"],["〜からして","","~부터가 (대표적인 예)","あの店は、店員の態度からして気に入らない。","그 가게는 점원의 태도부터가 마음에 들지 않는다.","문법"],["〜ことだから","","~이니까 (그 사람의 성격으로 보아)","まじめな彼のことだから、約束は必ず守るだろう。","성실한 그 사람이니까 약속은 반드시 지킬 것이다.","문법"],["〜ならまだしも","","~라면 또 모르지만","一度ならまだしも、何度も同じ間違いをするのは困る。","한 번이라면 또 모르지만 몇 번이나 같은 실수를 하는 것은 곤란하다.","문법"],["〜まい","","~하지 않겠다, ~하지 않을 것이다","二度とあの店には行くまいと心に決めた。","두 번 다시 그 가게에는 가지 않겠다고 마음먹었다.","문법"],["〜ままに","","~하는 대로","店員に勧められるままに、高い服を買ってしまった。","점원이 권하는 대로 비싼 옷을 사 버렸다.","문법"],["〜ものではない","","~하는 것이 아니다 (충고)","人の悪口は言うものではない。","남의 험담은 하는 것이 아니다.","문법"],["〜ものか","","~할까 보냐 (강한 부정)","あんなに高い店には、二度と行くものか。","그렇게 비싼 가게에는 두 번 다시 가나 봐라.","문법"],["〜ないではいられない","","~하지 않고는 못 배기다","その話を聞いて、笑わないではいられなかった。","그 이야기를 듣고 웃지 않을 수 없었다.","문법"],["〜なくはない","","~하지 않는 것은 아니다","お酒は飲めなくはないが、あまり好きではない。","술은 못 마시는 것은 아니지만 별로 좋아하지 않는다.","문법"],["〜ずに済む","","~하지 않고 끝나다, ~하지 않아도 되다","友達が車で送ってくれたので、雨にぬれずに済んだ。","친구가 차로 데려다주어서 비에 젖지 않고 끝났다.","문법"],["〜ねばならない","","~해야 한다 (문어)","社会の一員として、ルールは守らねばならない。","사회의 일원으로서 규칙은 지켜야 한다.","문법"],["〜に限る","","~가 최고다","暑い日は、冷たいビールに限る。","더운 날은 차가운 맥주가 최고다.","문법"],["〜にかかわる","","~에 관계되다, ~가 걸리다","これは人の命にかかわる大事な問題だ。","이것은 사람의 목숨이 걸린 중요한 문제다.","문법"],["〜に越したことはない","","~보다 좋은 것은 없다","値段は安いに越したことはないが、質も大切だ。","가격은 싼 것보다 좋은 것은 없지만 질도 중요하다.","문법"],["〜に際して","","~에 즈음하여, ~할 때","入学に際して、必要な書類を用意してください。","입학에 즈음하여 필요한 서류를 준비해 주세요.","문법"],["〜にせよ","","~라고 해도","忙しいにせよ、連絡ぐらいはするべきだ。","바쁘다고 해도 연락 정도는 해야 한다.","문법"],["〜にしたら","","~의 입장에서는","親にしたら、子どもの一人暮らしは心配なものだ。","부모 입장에서는 자식의 자취는 걱정되는 법이다.","문법"],["〜にしても","","~라고 하더라도","冗談にしても、言っていいことと悪いことがある。","농담이라고 하더라도 해도 되는 말과 안 되는 말이 있다.","문법"],["〜につけ","","~할 때마다","この写真を見るにつけ、学生時代を思い出す。","이 사진을 볼 때마다 학창 시절이 떠오른다.","문법"],["〜のももっともだ","","~하는 것도 당연하다","三時間も待たされたのだから、彼が怒るのももっともだ。","세 시간이나 기다리게 했으니 그가 화내는 것도 당연하다.","문법"],["〜のもとで","","~아래에서, ~밑에서","私は山田先生の指導のもとで、研究を続けている。","나는 야마다 선생님의 지도 아래 연구를 계속하고 있다.","문법"],["〜の上では","","~상으로는","暦の上ではもう春だが、まだ寒い日が続いている。","달력상으로는 벌써 봄이지만 아직 추운 날이 계속되고 있다.","문법"],["〜のみならず","","~뿐만 아니라","この映画は子どものみならず、大人にも人気がある。","이 영화는 아이뿐만 아니라 어른에게도 인기가 있다.","문법"],["〜ぬく","","끝까지 ~하다","苦しかったが、最後まで走りぬいた。","힘들었지만 끝까지 달려 냈다.","문법"],["〜を契機に","","~을 계기로","入院を契機に、生活を見直すことにした。","입원을 계기로 생활을 다시 돌아보기로 했다.","문법"],["〜を除いて","","~을 제외하고","日曜日を除いて、毎日店を開けている。","일요일을 제외하고 매일 가게를 열고 있다.","문법"],["ろくに〜ない","","제대로 ~하지 않다","忙しくて、ろくに食事をする時間もない。","바빠서 제대로 식사할 시간도 없다.","문법"],["〜せいか","","~탓인지","疲れているせいか、今日は食欲がない。","피곤한 탓인지 오늘은 식욕이 없다.","문법"],["〜次第で","","~에 따라","結果は、あなたの努力次第で変わる。","결과는 당신의 노력에 따라 달라진다.","문법"],["〜てばかりはいられない","","~하고만 있을 수는 없다","試験に落ちたが、泣いてばかりはいられない。","시험에 떨어졌지만 울고만 있을 수는 없다.","문법"],["〜てでも","","~해서라도","借金をしてでも、この家を買いたい。","빚을 내서라도 이 집을 사고 싶다.","문법"],["〜ていては","","~하고 있어서는","毎日遊んでいては、試験に合格できない。","매일 놀고 있어서는 시험에 합격할 수 없다.","문법"],["〜てこそ","","~해야 비로소","自分でやってみてこそ、その難しさが分かる。","스스로 해 봐야 비로소 그 어려움을 알 수 있다.","문법"],["〜てまで","","~하면서까지","体を壊してまで、働く必要はない。","몸을 망치면서까지 일할 필요는 없다.","문법"],["〜てはいられない","","~하고 있을 수 없다","時間がないので、のんびりしてはいられない。","시간이 없어서 느긋하게 있을 수 없다.","문법"],["〜ては〜ては","","~하고는 ~하고는 (반복)","書いては消し、書いては消して、やっと手紙ができた。","쓰고는 지우고 쓰고는 지워서 겨우 편지가 완성됐다.","문법"],["〜と同時に","","~와 동시에","ドアを開けると同時に、電話が鳴った。","문을 여는 것과 동시에 전화가 울렸다.","문법"],["〜というものではない","","~라는 것은 아니다","お金があれば幸せだというものではない。","돈이 있으면 행복하다는 것은 아니다.","문법"],["〜としても","","~라고 해도","今から急いだとしても、もう間に合わないだろう。","지금부터 서두른다고 해도 이미 늦을 것이다.","문법"],["〜上は","","~한 이상은","約束した上は、最後まで守らなければならない。","약속한 이상은 끝까지 지켜야 한다.","문법"],["〜はもとより","","~은 물론","彼は英語はもとより、中国語も話せる。","그는 영어는 물론 중국어도 할 수 있다.","문법"],["〜はともかく","","~은 어쨌든, ~은 제쳐두고","味はともかく、この店は量が多くて安い。","맛은 어쨌든 이 가게는 양이 많고 싸다.","문법"],["〜よりほかない","","~할 수밖에 없다","電車が止まったので、歩いて帰るよりほかない。","전철이 멈췄으니 걸어서 돌아갈 수밖에 없다.","문법"],["〜ようでは","","~해서는 (곤란하다)","こんな問題が解けないようでは、合格は難しい。","이런 문제를 못 풀어서는 합격은 어렵다.","문법"],["〜ようではないか","","~하자, ~하지 않겠는가","みんなで力を合わせて、この問題を解決しようではないか。","모두 힘을 합쳐 이 문제를 해결하지 않겠는가.","문법"],["〜ようか〜まいか","","~할지 말지","パーティーに行こうか行くまいか、まだ迷っている。","파티에 갈지 말지 아직 망설이고 있다.","문법"],["〜っぱなし","","~한 채로 내버려 둠","窓を開けっぱなしにして、出かけてしまった。","창문을 열어 둔 채로 나가 버렸다.","문법"],["〜つつも","","~하면서도","体に悪いと知りつつも、たばこがやめられない。","몸에 나쁘다는 것을 알면서도 담배를 끊을 수 없다.","문법"],["〜を通して","","~을 통해서, ~동안 내내","ボランティア活動を通して、多くのことを学んだ。","봉사 활동을 통해 많은 것을 배웠다.","문법"],["〜というか〜というか","","~랄까 ~랄까","彼の話は、おもしろいというか変というか、とにかく忘れられない。","그의 이야기는 재미있다고 할까 이상하다고 할까, 아무튼 잊을 수 없다.","문법"],["〜てしかたがない","","~해서 견딜 수 없다","試験の結果が気になってしかたがない。","시험 결과가 신경 쓰여서 견딜 수 없다.","문법"],["〜を〜として","","~을 ~로 하여","山田さんをリーダーとして、新しいチームが作られた。","야마다 씨를 리더로 하여 새 팀이 만들어졌다.","문법"],["〜にすれば","","~의 입장에서는","子どもにすれば、親の気持ちは分かりにくいものだ。","아이 입장에서는 부모의 마음은 알기 어려운 법이다.","문법"],["〜ばかりだ","","~하기만 하다 (나쁜 변화)","物価は上がるばかりで、生活が苦しくなってきた。","물가는 오르기만 해서 생활이 힘들어졌다.","문법"],["〜あまりに","","너무 ~해서","問題があまりに難しくて、だれも答えられなかった。","문제가 너무 어려워서 아무도 대답하지 못했다.","문법"],["〜ことにはならない","","~한 것이 되지 않는다","本を読んだだけでは、勉強したことにはならない。","책을 읽은 것만으로는 공부한 것이 되지 않는다.","문법"],["〜も当然だ","","~도 당연하다","毎日練習しているのだから、上手になるのも当然だ。","매일 연습하고 있으니 능숙해지는 것도 당연하다.","문법"],["〜なくて済む","","~하지 않아도 되다","近くにスーパーができたので、遠くまで行かなくて済む。","근처에 슈퍼가 생겨서 멀리까지 가지 않아도 된다.","문법"],["〜中を","","~하는 가운데","お忙しい中を来ていただき、ありがとうございます。","바쁘신 가운데 와 주셔서 감사합니다.","문법"]];

,"資料は私が後ほど（　）。","자료는 제가 나중에 보내 드리겠습니다.",["お送りします","お送りになります","送られます","送ってくださいます"],"내 행동을 낮추는 겸양은 お〜します. お〜になる는 상대 행동의 존경."],["문법","鍵をかけて出たのだから、ドアが開いている（　）。","열쇠를 잠그고 나왔으니 문이 열려 있을 리가 없다.",["はずがない","わけにはいかない","ようがない","ほかない"],"〜はずがない: ~일 리가 없다."],["문법","住所も電話番号もわからないので、連絡の（　）。","주소도 전화번호도 몰라서 연락할 방도가 없다.",["しようがない","するわけがない","しかねない","するまでもない"],"ます형 + ようがない: 방법이 없다."],["문법","完璧（　）、もう少し丁寧に仕上げてほしい。","완벽하라고까지는 하지 않겠지만 조금 더 꼼꼼히 마무리해 줬으면 한다.",["とは言わないが","と言うからには","と言えば","と言ったところで"],"〜とは言わないが: ~라고까지는 요구하지 않지만."],["문법","退院した（　）、まだ無理はできない。","퇴원했다고는 하지만 아직 무리는 할 수 없다.",["とはいうものの","というより","といえば","というわけで"],"〜とはいうものの: ~이긴 하지만(역접)."],["문법","子どもを起こす（　）、そっとドアを閉めた。","아이를 깨우지 않으려고 살짝 문을 닫았다.",["まいとして","べくして","ようとして","ものとして"],"동사 사전형 + まいとする: ~하지 않으려고 하다."],["문법","毎日とは言わ（　）、週に二、三回は掃除したほうがいい。","매일까지는 아니더라도 주 2~3회는 청소하는 게 좋다.",["ないまでも","ないことには","ないかぎり","ないうちに"],"〜ないまでも: ~까지는 아니더라도."],["문법","この程度の料理なら、私（　）作れる。","이 정도 요리라면 나라도 만들 수 있다.",["だって","ばかり","ほど","しか"],"명사 + だって: ~라도, ~도."],["문법","両親と相談した（　）、進学先を決めます。","부모님과 상의한 다음에 진학할 곳을 정하겠습니다.",["うえで","うえに","ところを","ばかりに"],"동사 た형 + うえで: ~한 뒤에. うえに는 \"~한 데다가\"."],["문법","彼の協力（　）、この計画の成功は考えられない。","그의 협력 없이 이 계획의 성공은 생각할 수 없다.",["をぬきにして","をめぐって","にこたえて","を通じて"],"〜をぬきにして: ~을 빼고, ~없이."],["문법","彼は漢字（　）、ひらがなも読めない。","그는 한자는커녕 히라가나도 못 읽는다.",["どころか","のわりに","にしては","だけあって"],"〜どころか: ~은커녕. 뒤에 더 정도가 심한 내용이 온다."],["문법","工事の開始（　）、住民への説明会が開かれた。","공사 시작에 앞서 주민 설명회가 열렸다.",["に先立って","にこたえて","にかけて","に沿って"],"〜に先立って: ~에 앞서."],["문법","上司の許可を（　）、お答えできません。","상사의 허가를 받고 나서가 아니면 답변드릴 수 없습니다.",["もらってからでないと","もらうにつれて","もらうわりに","もらったばかりに"],"〜てからでないと: ~하고 나서가 아니면. 뒤에는 불가능·곤란한 내용이 온다."],["문법","あの事故のことは、考える（　）怖くなる。","그 사고는 생각하는 것만으로도 무서워진다.",["だけで","しかで","ばかりを","ほどを"],"동사 사전형 + だけで: ~하는 것만으로도."],["문법","まさか自分の作品が賞を取るなんて、（　）。","설마 내 작품이 상을 받다니 생각해 보지도 못했다.",["考えてもみなかった","考えかねなかった","考えつつあった","考えたばかりだった"],"〜てもみなかった: 전혀 예상하지 못했다."],["문법","最近、残業が続いて少し風邪（　）だ。","요즘 야근이 이어져서 조금 감기 기운이 있다.",["気味","がち","げ","だらけ"],"명사·ます형 + 気味: ~한 기미가 있다."],["문법","携帯を忘れてしまったので、こちらの電話を（　）。","휴대폰을 두고 와서 그러는데, 이 전화를 써도 되겠습니까?",["使わせていただけませんか","お使いいただけませんか","使ってくださいませんか","お使いになりませんか"],"〜させていただけませんか: 자신이 하도록 허락을 구하는 겸양 표현."],["문법","一度も練習していないのだから、うまく（　）。","한 번도 연습하지 않았으니 잘할 수 있을 리가 없다.",["できるわけがない","できるに違いない","できるにすぎない","できることになっている"],"〜わけがない: ~일 리가 없다."],["문법","机の上に、食べ（　）のパンが置いてある。","책상 위에 먹다 만 빵이 놓여 있다.",["かけ","次第","がち","気味"],"ます형 + かけ: ~하다 만."],["문법","さんざん悩んだ（　）、留学をあきらめた。","한참 고민한 끝에 유학을 포기했다.",["あげく","とたん","ついでに","うちに"],"〜たあげく: ~한 끝에. 뒤에는 좋지 않은 결과가 온다."],["문법","緊張の（　）、名前を言い間違えてしまった。","긴장한 나머지 이름을 잘못 말해 버렸다.",["あまり","わりに","かわりに","ついでに"],"명사 の + あまり: ~한 나머지."],["문법","この地域は地震が多い（　）、台風の被害も大きい。","이 지역은 지진이 많은 데다가 태풍 피해도 크다.",["うえに","うえで","あげく","ばかりに"],"〜うえに: ~한 데다가. うえで는 \"~한 뒤에\"."],["문법","忘れない（　）、メモしておこう。","잊기 전에 메모해 두자.",["うちに","あいだ","ところに","最中に"],"〜ないうちに: ~하기 전에."],["문법","このまま雨が続くと、川があふれる（　）。","이대로 비가 계속되면 강이 넘칠 우려가 있다.",["おそれがある","わけがない","ほかない","ものではない"],"〜おそれがある: 나쁜 일이 일어날 우려가 있다."],["문법","彼が犯人だとは、とても信じ（　）。","그가 범인이라고는 도저히 믿기 어렵다.",["がたい","がちだ","かねない","っぽい"],"ます형 + がたい: ~하기 어렵다. 信じがたい, 理解しがたい 등."],["문법","一人暮らしを始めると、食事が不規則になり（　）。","혼자 살기 시작하면 식사가 불규칙해지기 쉽다.",["がちだ","がたい","きれない","っこない"],"ます형 + がちだ: ~하기 쉽다(좋지 않은 경향)."],["문법","そんなにスピードを出したら、事故を起こし（　）。","그렇게 속도를 내면 사고를 낼지도 모른다.",["かねない","かねる","がたい","きれない"],"〜かねない: ~할지도 모른다. かねる는 \"~하기 어렵다\"로 반대 뜻."],["문법","申し訳ございませんが、その件についてはお答えし（　）。","죄송하지만 그 건에 대해서는 답변드리기 어렵습니다.",["かねます","かねません","きります","がちです"],"〜かねます: 정중하게 \"할 수 없다\"고 할 때 쓴다."],["문법","厳しく言うのは、君に期待している（　）だ。","엄하게 말하는 것은 너에게 기대하고 있기 때문이다.",["からこそ","からには","からといって","からして"],"〜からこそだ: 바로 ~이기 때문이다."],["문법","日本に住んでいる（　）、だれでも日本語が上手なわけではない。","일본에 살고 있다고 해서 누구나 일본어를 잘하는 것은 아니다.",["からといって","からこそ","おかげで","だけあって"],"〜からといって…わけではない: ~라고 해서 ~인 것은 아니다."],["문법","彼とは卒業式で別れた（　）、一度も会っていない。","그와는 졸업식에서 헤어진 뒤로 한 번도 만나지 않았다.",["きり","とたん","ところ","うえで"],"〜たきり: ~한 채 그 뒤로 변화가 없다."],["문법","こんなに多くの料理、一人では食べ（　）。","이렇게 많은 요리는 혼자서는 다 먹을 수 없다.",["きれない","かねない","がたい","っぽい"],"ます형 + きれない: 다 ~할 수 없다."],["문법","あんな人に頼む（　）、自分でやったほうがいい。","저런 사람에게 부탁할 바에는 내가 하는 편이 낫다.",["くらいなら","からには","ものなら","としたら"],"〜くらいなら…ほうがいい: ~할 바에는
